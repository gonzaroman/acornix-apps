<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Avatar Maker</title>
<style>
  :root { --bg:#f6f4ff; --card:#fff; --ink:#26215c; --muted:#8580b0; --a:#6c5ce7; --line:#e6e2fb; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { position:fixed; inset:0; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 12px); gap:10px; }
  .top { display:flex; align-items:center; gap:8px; }
  .top h1 { margin:0; font-size:20px; flex:1; }
  .b { padding:9px 13px; border-radius:12px; background:var(--card); font-weight:800; font-size:14px; border:2px solid var(--line); }
  .b.main { background:var(--a); color:#fff; border-color:var(--a); }
  .stage { flex:1; min-height:0; display:grid; place-items:center; }
  #av { width:min(280px, 68vw); height:auto; aspect-ratio:1; border-radius:50%; box-shadow:0 14px 40px #6c5ce733; }
  .saved { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; min-height:0; }
  .saved::-webkit-scrollbar { display:none; }
  .saved button { flex:none; width:44px; height:44px; border-radius:50%; padding:0; overflow:hidden; border:2px solid var(--line); background:#fff; }
  .saved img { width:100%; height:100%; display:block; }
  .tabs { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; padding:8px 12px; border-radius:20px; background:var(--card); font-weight:800; font-size:13px; color:var(--muted); border:2px solid var(--line); }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .opts { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .opt { aspect-ratio:1; border-radius:16px; background:var(--card); border:2px solid var(--line); padding:4px; display:grid; place-items:center; }
  .opt.on { border-color:var(--a); box-shadow:0 0 0 2px var(--a); }
  .opt svg { width:100%; height:100%; }
  .cols { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:3px; }
  .cols::-webkit-scrollbar { display:none; }
  .col { flex:none; width:32px; height:32px; border-radius:50%; border:2px solid #0001; }
  .col.on { outline:3px solid var(--a); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🧑‍🎨 <span id="ttl"></span></h1><button class="b" id="rnd">🎲</button><button class="b" id="keep">⭐</button><button class="b main" id="save"></button></div>
  <div class="stage"><svg id="av" viewBox="0 0 200 200"></svg></div>
  <div class="saved" id="saved"></div>
  <div class="tabs" id="tabs"></div>
  <div class="cols" id="cols"></div>
  <div class="opts" id="opts"></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Avatar', save:'Guardar', tabs:['Piel', 'Pelo', 'Ojos', 'Boca', 'Extras', 'Fondo'] } : { title:'Avatar Maker', save:'Save', tabs:['Skin', 'Hair', 'Eyes', 'Mouth', 'Extras', 'Background'] };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const SKIN = ['#ffdbb4', '#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#5c3a1e', '#a3e4ff', '#b5f5a8'];
const HAIRC = ['#2c1b10', '#5a3825', '#a0522d', '#d4a017', '#f4e1a1', '#e8e8e8', '#e64980', '#4c6ef5', '#12b886'];
const BG = ['#ffd8a8', '#a5d8ff', '#b2f2bb', '#eebefa', '#ffc9c9', '#fff3bf', '#c5f6fa', '#26215c', '#ffffff'];
const ACC = ['#26215c', '#e03131', '#f08c00', '#1971c2', '#ffffff'];
// Each part list draws SVG for the chosen option; c = its colour.
const HAIR = [
  c => '',
  c => `<path d="M48 92 Q50 40 100 38 Q150 40 152 92 Q140 62 100 60 Q60 62 48 92Z" fill="${c}"/>`,
  c => `<path d="M44 110 Q38 40 100 34 Q162 40 156 110 L150 150 Q148 80 128 64 Q100 74 72 64 Q52 80 50 150Z" fill="${c}"/>`,
  c => `<path d="M50 96 Q46 44 100 40 Q154 44 150 96 Q132 58 112 70 Q102 52 86 66 Q66 56 50 96Z" fill="${c}"/>`,
  c => `<circle cx="100" cy="46" r="20" fill="${c}"/><path d="M50 96 Q52 50 100 52 Q148 50 150 96 Q130 70 100 70 Q70 70 50 96Z" fill="${c}"/>`,
  c => `<g fill="${c}">${[50, 64, 80, 100, 120, 136, 150].map((x, i) => `<circle cx="${x}" cy="${68 - Math.sin(i / 6 * Math.PI) * 26}" r="17"/>`).join('')}<circle cx="46" cy="88" r="14"/><circle cx="154" cy="88" r="14"/></g>`,
  c => `<path d="M52 90 Q56 46 100 44 Q144 46 148 90 L148 80 Q120 50 52 78Z" fill="${c}"/><path d="M146 84 Q172 110 158 168 Q150 120 140 96Z" fill="${c}"/>`,
  c => `<path d="M60 70 L76 34 L92 62 L100 30 L108 62 L124 34 L140 70 Q100 56 60 70Z" fill="${c}"/>`,
  c => `<path d="M46 100 Q44 40 100 36 Q156 40 154 100 L158 170 Q140 160 142 100 Q120 62 100 62 Q80 62 58 100 Q60 160 42 170Z" fill="${c}"/>`,
  c => `<rect x="54" y="50" width="92" height="22" rx="11" fill="${c}"/><path d="M60 54 Q100 22 140 54Z" fill="${c}"/>`,
];
const EYES = [
  () => `<circle cx="80" cy="102" r="6" fill="#26215c"/><circle cx="120" cy="102" r="6" fill="#26215c"/>`,
  () => `<ellipse cx="80" cy="102" rx="9" ry="11" fill="#fff"/><ellipse cx="120" cy="102" rx="9" ry="11" fill="#fff"/><circle cx="82" cy="104" r="5" fill="#26215c"/><circle cx="122" cy="104" r="5" fill="#26215c"/>`,
  () => `<path d="M70 104 Q80 94 90 104 M110 104 Q120 94 130 104" stroke="#26215c" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  () => `<path d="M72 102 h16 M112 102 h16" stroke="#26215c" stroke-width="4" stroke-linecap="round"/>`,
  () => `<circle cx="80" cy="102" r="6" fill="#26215c"/><path d="M112 102 Q120 96 128 102" stroke="#26215c" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  () => `<path d="M80 92 l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z M120 92 l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#f59f00"/>`,
  () => `<path d="M72 100 q8-6 16 0 q-8 10-16 0z M112 100 q8-6 16 0 q-8 10-16 0z" fill="#26215c"/><path d="M70 96 l-4 -4 M130 96 l4 -4" stroke="#26215c" stroke-width="3" stroke-linecap="round"/>`,
  () => `<circle cx="80" cy="102" r="10" fill="#fff" stroke="#26215c" stroke-width="2"/><circle cx="120" cy="102" r="10" fill="#fff" stroke="#26215c" stroke-width="2"/><circle cx="80" cy="102" r="4" fill="#26215c"/><circle cx="120" cy="102" r="4" fill="#26215c"/>`,
];
const MOUTH = [
  () => `<path d="M84 130 Q100 144 116 130" stroke="#26215c" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  () => `<path d="M82 128 Q100 152 118 128Z" fill="#c92a2a"/><path d="M88 129 h24" stroke="#fff" stroke-width="5"/>`,
  () => `<path d="M88 134 h24" stroke="#26215c" stroke-width="4" stroke-linecap="round"/>`,
  () => `<circle cx="100" cy="134" r="7" fill="#c92a2a"/>`,
  () => `<path d="M86 132 Q100 140 114 128" stroke="#26215c" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  () => `<path d="M84 128 Q100 146 116 128Z" fill="#26215c"/><path d="M94 138 Q100 132 106 138Z" fill="#ff8787"/>`,
  () => `<path d="M86 136 Q100 124 114 136" stroke="#26215c" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  () => `<path d="M80 130 Q100 140 120 130" stroke="#26215c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M104 134 q6 10 12 0" fill="#ff8787"/>`,
];
const EXTRA = [
  c => '',
  c => `<g stroke="${c}" stroke-width="4" fill="#ffffff55"><circle cx="80" cy="102" r="15"/><circle cx="120" cy="102" r="15"/></g><path d="M95 102 h10" stroke="${c}" stroke-width="4"/>`,
  c => `<g fill="${c}"><rect x="62" y="92" width="32" height="20" rx="8"/><rect x="106" y="92" width="32" height="20" rx="8"/></g><path d="M94 98 h12" stroke="${c}" stroke-width="4"/>`,
  c => `<path d="M40 70 Q100 20 160 70 L170 76 Q100 50 30 76Z" fill="${c}"/><rect x="58" y="34" width="84" height="40" rx="18" fill="${c}"/>`,
  c => `<circle cx="52" cy="122" r="6" fill="${c}"/><circle cx="148" cy="122" r="6" fill="${c}"/>`,
  c => `<path d="M76 118 q4 6 8 0 M116 118 q4 6 8 0" stroke="#ff8787" stroke-width="4" fill="none"/><circle cx="70" cy="120" r="7" fill="#ff878766"/><circle cx="130" cy="120" r="7" fill="#ff878766"/>`,
  c => `<path d="M70 122 Q100 156 130 122 Q134 168 100 172 Q66 168 70 122Z" fill="${c}"/>`,
  c => `<path d="M58 44 L72 20 L86 40 L100 16 L114 40 L128 20 L142 44Z" fill="#fcc419" stroke="#f08c00" stroke-width="2"/>`,
  c => `<path d="M84 72 l5 10 11 1-8 7 2 11-10-6-10 6 2-11-8-7 11-1z" fill="${c}"/>`,
  c => `<path d="M60 152 Q100 176 140 152 L146 200 L54 200Z" fill="${c}"/>`,
];
const $ = id => document.getElementById(id);
$('ttl').textContent = T.title; $('save').textContent = T.save;
let a = { skin: 0, hair: 2, hairC: 0, eyes: 1, mouth: 0, extra: 0, accC: 0, bg: 1 }, tab = 0, kept = [];
function svg(x, size = 200) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="${size}" height="${size}"><rect width="200" height="200" fill="${BG[x.bg]}"/>
    <path d="M60 158 Q100 146 140 158 L156 200 L44 200Z" fill="${SKIN[x.skin]}"/><rect x="88" y="140" width="24" height="24" fill="${SKIN[x.skin]}"/>
    ${x.hair === 8 || x.hair === 2 ? HAIR[x.hair](HAIRC[x.hairC]) : ''}
    <ellipse cx="100" cy="104" rx="52" ry="58" fill="${SKIN[x.skin]}"/><circle cx="48" cy="108" r="9" fill="${SKIN[x.skin]}"/><circle cx="152" cy="108" r="9" fill="${SKIN[x.skin]}"/>
    ${x.hair === 8 || x.hair === 2 ? `<path d="M50 96 Q52 50 100 46 Q148 50 150 96 Q130 64 100 64 Q70 64 50 96Z" fill="${HAIRC[x.hairC]}"/>` : HAIR[x.hair](HAIRC[x.hairC])}
    ${EYES[x.eyes]()}<path d="M98 108 q4 10 -2 14" stroke="#0003" stroke-width="3" fill="none" stroke-linecap="round"/>${MOUTH[x.mouth]()}${EXTRA[x.extra](ACC[x.accC])}</svg>`;
}
const src = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
function render() {
  $('av').outerHTML = svg(a).replace('<svg ', '<svg id="av" ');
  $('tabs').innerHTML = T.tabs.map((t, i) => `<button class="tab ${i === tab ? 'on' : ''}" data-i="${i}">${t}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = +b.dataset.i; render(); });
  const colKey = [null, 'hairC', null, null, 'accC', null][tab], colList = [null, HAIRC, null, null, ACC, null][tab];
  $('cols').innerHTML = colList ? colList.map((c, i) => `<button class="col ${a[colKey] === i ? 'on' : ''}" data-i="${i}" style="background:${c}"></button>`).join('') : '';
  $('cols').hidden = !colList;
  $('cols').querySelectorAll('.col').forEach(b => b.onclick = () => { a[colKey] = +b.dataset.i; render(); persist(); });
  const key = ['skin', 'hair', 'eyes', 'mouth', 'extra', 'bg'][tab], n = [SKIN, HAIR, EYES, MOUTH, EXTRA, BG][tab].length;
  $('opts').innerHTML = Array.from({ length: n }, (_, i) => { const p = { ...a, [key]: i }; return `<button class="opt ${a[key] === i ? 'on' : ''}" data-i="${i}">${svg(p, 60)}</button>`; }).join('');
  $('opts').querySelectorAll('.opt').forEach(b => b.onclick = () => { a[key] = +b.dataset.i; render(); persist(); });
  $('saved').innerHTML = kept.map((k, i) => `<button data-i="${i}"><img src="${src(svg(k, 44))}"></button>`).join(''); $('saved').hidden = !kept.length;
  $('saved').querySelectorAll('button').forEach(b => b.onclick = () => { a = { ...kept[+b.dataset.i] }; render(); persist(); });
}
const persist = () => store.set('avatar', a);
const pick = n => Math.floor(Math.random() * n);
$('rnd').onclick = () => { a = { skin: pick(6), hair: pick(HAIR.length), hairC: pick(HAIRC.length), eyes: pick(EYES.length), mouth: pick(MOUTH.length), extra: Math.random() < .5 ? 0 : pick(EXTRA.length), accC: pick(ACC.length), bg: pick(BG.length) }; render(); persist(); try { window.Acornix && Acornix.vibrate(8); } catch (e) {} };
$('keep').onclick = () => { kept.unshift({ ...a }); kept = kept.slice(0, 30); store.set('kept', kept); render(); };
$('save').onclick = () => {
  const im = new Image(); im.onload = async () => { const c = document.createElement('canvas'); c.width = c.height = 1024; c.getContext('2d').drawImage(im, 0, 0, 1024, 1024); const url = c.toDataURL('image/png'), name = `avatar-${Date.now()}.png`;
    try { if (window.Acornix) { await Acornix.files.export(name, url); } else { const x = document.createElement('a'); x.href = url; x.download = name; x.click(); } } catch (e) {} };
  im.src = src(svg(a, 1024));
};
(async () => { a = { ...a, ...(await store.get('avatar', {})) }; kept = await store.get('kept', []); render(); })();
</script>
</body>
</html>
