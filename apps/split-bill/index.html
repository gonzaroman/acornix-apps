<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Split the Bill</title>
<style>
  :root { --bg:#fff6ef; --card:#fff; --ink:#2a1d14; --muted:#9a8576; --line:#f2e2d4; --a:#ff6a3d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, input, select { font:inherit; color:inherit; border:0; }
  button { cursor:pointer; background:none; }
  #app { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { margin:0 0 12px; font-size:26px; }
  .tabs { display:flex; background:var(--card); border-radius:14px; padding:4px; margin-bottom:12px; }
  .tabs button { flex:1; padding:10px; border-radius:11px; font-weight:800; }
  .tabs button.on { background:var(--a); color:#fff; }
  .card { background:var(--card); border-radius:20px; padding:16px; margin-bottom:12px; }
  .total input { width:100%; font-size:44px; font-weight:900; text-align:center; outline:none; background:transparent; }
  .total small { display:block; text-align:center; color:var(--muted); font-weight:700; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:10px 0; font-weight:700; }
  .stepper { display:flex; align-items:center; gap:10px; }
  .stepper button { width:42px; height:42px; border-radius:12px; background:var(--bg); font-size:22px; font-weight:800; }
  .stepper b { min-width:30px; text-align:center; font-size:22px; }
  .tips { display:flex; gap:6px; }
  .tips button { padding:8px 10px; border-radius:10px; background:var(--bg); font-weight:800; font-size:14px; }
  .tips button.on { background:var(--ink); color:#fff; }
  .result { background:linear-gradient(135deg,#ff6a3d,#ff9f43); color:#fff; border-radius:24px; padding:18px; text-align:center; }
  .result small { opacity:.9; font-weight:700; }
  .result .big { font-size:46px; font-weight:900; font-variant-numeric:tabular-nums; }
  .result .detail { display:flex; justify-content:space-around; margin-top:8px; font-size:14px; }
  .people .p { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .people .p input { flex:1; min-width:0; padding:8px; border-radius:10px; background:var(--bg); outline:none; }
  .people .p input.amt { flex:none; width:90px; text-align:right; }
  .people .p .owes { width:96px; text-align:right; font-weight:800; font-variant-numeric:tabular-nums; }
  .add { margin-top:10px; padding:11px; border-radius:12px; background:var(--bg); font-weight:800; width:100%; }
  .settle div { padding:10px 12px; border-radius:12px; background:var(--bg); margin-top:6px; font-weight:600; }
  .share { width:100%; padding:15px; border-radius:16px; background:var(--ink); color:#fff; font-weight:900; }
  .cur { display:flex; justify-content:flex-end; color:var(--muted); font-size:13px; gap:6px; align-items:center; }
  .cur select { background:var(--card); padding:5px; border-radius:8px; }
</style>
</head>
<body>
<div id="app">
  <h1>🍽️ <span id="ttl"></span></h1>
  <div class="tabs"><button id="tEven"></button><button id="tItems"></button></div>
  <section id="even">
    <div class="card total"><small id="lBill"></small><input id="bill" inputmode="decimal" placeholder="0"></div>
    <div class="card">
      <div class="row"><span id="lPeople"></span><div class="stepper"><button id="pMinus">−</button><b id="people">2</b><button id="pPlus">+</button></div></div>
      <div class="row"><span id="lTip"></span><div class="tips" id="tips"></div></div>
      <div class="row"><span id="lRound"></span><input type="checkbox" id="round" style="width:22px;height:22px;accent-color:var(--a)"></div>
    </div>
    <div class="result"><small id="lEach"></small><div class="big" id="each"></div><div class="detail"><span id="tipAmt"></span><span id="grand"></span></div></div>
  </section>
  <section id="items" style="display:none">
    <div class="card people"><b id="lWho"></b><div id="plist"></div><button class="add" id="addP"></button></div>
    <div class="card settle"><b id="lSettle"></b><div id="settle"></div></div>
  </section>
  <div style="height:12px"></div>
  <button class="share" id="share"></button>
  <div class="cur" style="margin-top:12px"><span id="lCur"></span><select id="cur"></select></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Dividir la cuenta', even:'A partes iguales', items:'Quién pagó qué', bill:'Total de la cuenta', people:'Personas', tip:'Propina', round:'Redondear hacia arriba', each:'Cada uno paga', tipA:'Propina', total:'Total', who:'¿Cuánto ha pagado cada uno?', add:'＋ Añadir persona', settle:'Para quedar en paz', pays:'paga a', even2:'¡Todos en paz! 🎉', share:'📤 Compartir', cur:'Moneda', person:'Persona' }
 : { title:'Split the Bill', even:'Split evenly', items:'Who paid what', bill:'Bill total', people:'People', tip:'Tip', round:'Round up', each:'Each person pays', tipA:'Tip', total:'Total', who:'How much did each person pay?', add:'＋ Add person', settle:'To settle up', pays:'pays', even2:'Everyone is square! 🎉', share:'📤 Share', cur:'Currency', person:'Person' };
const $ = id => document.getElementById(id);
[['ttl', 'title'], ['tEven', 'even'], ['tItems', 'items'], ['lBill', 'bill'], ['lPeople', 'people'], ['lTip', 'tip'], ['lRound', 'round'], ['lEach', 'each'], ['lWho', 'who'], ['addP', 'add'], ['lSettle', 'settle'], ['share', 'share'], ['lCur', 'cur']].forEach(([i, k]) => $(i).textContent = T[k]);
const st = (() => { try { return JSON.parse(localStorage.getItem('split')); } catch (e) { return null; } })() || { tab: 0, bill: '', people: 2, tip: 10, round: false, cur: ES ? 'EUR' : 'USD', paid: [[T.person + ' 1', ''], [T.person + ' 2', ''], [T.person + ' 3', '']] };
$('cur').innerHTML = ['EUR', 'USD', 'GBP', 'MXN', 'ARS', 'COP', 'CLP', 'BRL'].map(c => `<option>${c}</option>`).join(''); $('cur').value = st.cur;
const money = v => new Intl.NumberFormat(undefined, { style: 'currency', currency: st.cur }).format(v);
const num = s => parseFloat(String(s).replace(',', '.')) || 0;
[0, 5, 10, 15, 20].forEach(p => { const b = document.createElement('button'); b.textContent = p + '%'; b.onclick = () => { st.tip = p; calc(); }; $('tips').appendChild(b); });
function save() { try { localStorage.setItem('split', JSON.stringify(st)); } catch (e) {} }
let summary = '';
function calc() {
  $('even').style.display = st.tab ? 'none' : 'block'; $('items').style.display = st.tab ? 'block' : 'none';
  $('tEven').classList.toggle('on', !st.tab); $('tItems').classList.toggle('on', !!st.tab);
  if (!st.tab) {
    const bill = num(st.bill), tip = bill * st.tip / 100, grand = bill + tip; let each = grand / st.people;
    if (st.round) each = Math.ceil(each);
    $('people').textContent = st.people; $('round').checked = st.round;
    [...$('tips').children].forEach(b => b.classList.toggle('on', b.textContent === st.tip + '%'));
    $('each').textContent = money(each); $('tipAmt').textContent = `${T.tipA}: ${money(tip)}`; $('grand').textContent = `${T.total}: ${money(grand)}`;
    summary = `🍽️ ${T.total}: ${money(grand)} (${T.tipA} ${st.tip}%)\n👥 ${st.people} × ${money(each)}`;
  } else {
    $('plist').innerHTML = '';
    st.paid.forEach((p, i) => {
      const d = document.createElement('div'); d.className = 'p';
      d.innerHTML = `<input maxlength="16"><input class="amt" inputmode="decimal" placeholder="0"><span class="owes"></span><button>✕</button>`;
      const [name, amt] = d.querySelectorAll('input'); name.value = p[0]; amt.value = p[1];
      name.oninput = () => { p[0] = name.value; settle(); save(); }; amt.oninput = () => { p[1] = amt.value; settle(); save(); };
      d.querySelector('button').onclick = () => { if (st.paid.length > 2) { st.paid.splice(i, 1); calc(); } };
      $('plist').appendChild(d);
    });
    settle();
  }
  save();
}
// Everyone should end up paying the same: whoever paid less pays whoever paid more.
function settle() {
  const tot = st.paid.reduce((a, p) => a + num(p[1]), 0), share = tot / st.paid.length;
  const bal = st.paid.map(p => [p[0] || '?', num(p[1]) - share]);
  document.querySelectorAll('.people .owes').forEach((el, i) => { const v = bal[i][1]; el.textContent = Math.abs(v) < .005 ? '✓' : (v > 0 ? '+' : '−') + money(Math.abs(v)); el.style.color = v > .005 ? '#16a34a' : v < -.005 ? '#dc2626' : ''; });
  const deb = bal.filter(b => b[1] < -.005).map(b => [b[0], -b[1]]), cred = bal.filter(b => b[1] > .005).map(b => [...b]), out = [];
  while (deb.length && cred.length) { const d = deb[0], c = cred[0], m = Math.min(d[1], c[1]); out.push(`${d[0]} ${T.pays} ${c[0]}: ${money(m)}`); d[1] -= m; c[1] -= m; if (d[1] < .005) deb.shift(); if (c[1] < .005) cred.shift(); }
  $('settle').innerHTML = (out.length ? out : [T.even2]).map(t => `<div>💸 ${t.replace(/</g, '&lt;')}</div>`).join('');
  summary = `🧾 ${T.total}: ${money(tot)}\n` + (out.length ? out.join('\n') : T.even2);
}
$('bill').value = st.bill; $('bill').oninput = () => { st.bill = $('bill').value; calc(); };
$('pMinus').onclick = () => { st.people = Math.max(1, st.people - 1); calc(); }; $('pPlus').onclick = () => { st.people = Math.min(50, st.people + 1); calc(); };
$('round').onchange = () => { st.round = $('round').checked; calc(); };
$('tEven').onclick = () => { st.tab = 0; calc(); }; $('tItems').onclick = () => { st.tab = 1; calc(); };
$('addP').onclick = () => { st.paid.push([T.person + ' ' + (st.paid.length + 1), '']); calc(); };
$('cur').onchange = () => { st.cur = $('cur').value; calc(); };
$('share').onclick = async () => { try { if (window.Acornix) await Acornix.share(summary); else if (navigator.share) await navigator.share({ text: summary }); else await navigator.clipboard.writeText(summary); } catch (e) {} };
calc();
</script>
</body>
</html>
