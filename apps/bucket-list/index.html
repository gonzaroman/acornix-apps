<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bucket List</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; --a:#fbbf24; --line:#334155; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, label.btn { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  .head { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  .ring { width:84px; height:84px; flex:none; position:relative; } .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring b { position:absolute; inset:0; display:grid; place-items:center; font-size:20px; }
  h1 { margin:0; font-size:26px; } .sub { color:var(--muted); font-weight:600; margin-top:4px; }
  .add { display:flex; gap:8px; } .add input { flex:1; min-width:0; padding:13px 14px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); font:inherit; outline:none; } .add input:focus { border-color:var(--a); }
  .add button { padding:0 18px; border-radius:14px; background:var(--a); color:#1e1b10; font-weight:900; font-size:20px; }
  .cats { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; margin:12px 0; } .cats::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:7px 12px; border-radius:20px; background:var(--card); font-weight:800; font-size:13px; color:var(--muted); }
  .chip.on { background:var(--a); color:#1e1b10; }
  .ideas { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; margin-bottom:14px; } .ideas::-webkit-scrollbar { display:none; }
  .ideas button { flex:none; padding:7px 11px; border-radius:20px; border:1px dashed var(--line); background:none; color:var(--muted); font-size:13px; font-weight:700; }
  .item { display:flex; gap:12px; align-items:center; background:var(--card); border-radius:18px; padding:12px; margin-bottom:8px; }
  .item .ic { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-size:24px; background:#0f172a; flex:none; background-size:cover; background-position:center; }
  .item .t { flex:1; min-width:0; } .item .t b { display:block; font-size:15px; } .item .t small { color:var(--muted); font-weight:600; font-size:12px; }
  .item.done .t b { color:var(--a); }
  .item .ck { width:36px; height:36px; border-radius:50%; border:2px solid var(--line); background:none; font-size:16px; flex:none; }
  .item.done .ck { background:var(--a); border-color:var(--a); color:#1e1b10; }
  .sec { font-size:12px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:18px 4px 8px; }
  .modal { position:fixed; inset:0; background:#000a; display:grid; place-items:center; padding:20px; z-index:5; }
  .modal .in { width:100%; max-width:420px; background:var(--card); border-radius:22px; padding:18px; text-align:center; }
  .modal h3 { margin:6px 0 4px; } .modal p { color:var(--muted); margin:0 0 12px; }
  .modal .photo { width:100%; aspect-ratio:4/3; border-radius:14px; background:#0f172a center/cover; display:grid; place-items:center; font-size:40px; margin-bottom:10px; }
  .modal textarea { width:100%; min-height:60px; border-radius:12px; border:2px solid var(--line); background:#0f172a; color:var(--ink); padding:10px; font:inherit; outline:none; }
  .modal .row { display:flex; gap:8px; margin-top:10px; } .modal .row > * { flex:1; padding:12px; border-radius:14px; background:#0f172a; font-weight:800; text-align:center; } .modal .row .ok { background:var(--a); color:#1e1b10; }
  input[type=file] { display:none; }
  .burst { position:fixed; inset:0; pointer-events:none; z-index:6; }
  .burst i { position:absolute; left:50%; top:50%; font-size:26px; animation:b 1.1s ease-out forwards; }
  @keyframes b { to { transform:translate(var(--x), var(--y)) scale(.4); opacity:0; } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#334155" stroke-width="4"/><circle id="arc" cx="18" cy="18" r="15.5" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 100"/></svg><b id="pct"></b></div><div><h1>🪣 <span id="ttl"></span></h1><div class="sub" id="sub"></div></div></div>
  <form class="add" id="form"><input id="txt" maxlength="80" autocomplete="off"><button>＋</button></form>
  <div class="cats" id="cats"></div>
  <div class="ideas" id="ideas"></div>
  <div id="list"></div>
</div>
<div class="modal" id="modal" hidden><div class="in"><div style="font-size:40px">🎉</div><h3 id="mTitle"></h3><p id="mSub"></p><label class="photo" id="mPhoto"><input type="file" id="file" accept="image/*">📸</label><textarea id="mNote"></textarea><div class="row"><button id="mCancel"></button><button class="ok" id="mOk"></button></div></div></div>
<div class="burst" id="burst"></div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Antes de morir…', sub:n => `${n} sueños por cumplir`, ph:'Algo que quieres hacer en la vida', cats:['✨ Todo', '✈️ Viajes', '🏔️ Aventura', '🎓 Aprender', '❤️ Personas', '🎨 Crear'], pend:'Por cumplir', done:'¡Cumplidos!', did:'¡Lo conseguiste!', addPhoto:'Añade una foto y cómo fue', note:'¿Cómo fue?', cancel:'Aún no', ok:'¡Hecho!', on:'el', ideas:['Ver una aurora boreal', 'Aprender a nadar bien', 'Correr 10 km', 'Visitar Japón', 'Plantar un árbol', 'Escribir una carta a mi yo futuro', 'Dormir bajo las estrellas', 'Aprender un idioma', 'Hacer paracaidismo'] }
 : { title:'Bucket List', sub:n => `${n} dreams to go`, ph:'Something you want to do in life', cats:['✨ All', '✈️ Travel', '🏔️ Adventure', '🎓 Learn', '❤️ People', '🎨 Create'], pend:'To do', done:'Done!', did:'You did it!', addPhoto:'Add a photo and how it went', note:'How was it?', cancel:'Not yet', ok:'Done!', on:'on', ideas:['See the northern lights', 'Learn to swim well', 'Run 10 km', 'Visit Japan', 'Plant a tree', 'Write a letter to future me', 'Sleep under the stars', 'Learn a language', 'Go skydiving'] };
const ICON = ['⭐', '✈️', '🏔️', '🎓', '❤️', '🎨'];
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
$('ttl').textContent = T.title; $('txt').placeholder = T.ph; $('mTitle').textContent = T.did; $('mSub').textContent = T.addPhoto; $('mNote').placeholder = T.note; $('mCancel').textContent = T.cancel; $('mOk').textContent = T.ok;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let items = [], cat = 0, finishing = null, photo = null;
const save = () => store.set('items', items);
function render() {
  const done = items.filter(i => i.done).length, p = items.length ? Math.round(done / items.length * 100) : 0;
  $('arc').setAttribute('stroke-dasharray', `${p} 100`); $('pct').textContent = p + '%'; $('sub').textContent = T.sub(items.length - done);
  $('cats').innerHTML = T.cats.map((c, i) => `<button class="chip ${i === cat ? 'on' : ''}" data-i="${i}">${c}</button>`).join('');
  $('cats').querySelectorAll('.chip').forEach(b => b.onclick = () => { cat = +b.dataset.i; render(); });
  $('ideas').innerHTML = T.ideas.filter(x => !items.some(i => i.text === x)).map(x => `<button>＋ ${esc(x)}</button>`).join('');
  $('ideas').querySelectorAll('button').forEach(b => b.onclick = () => add(b.textContent.slice(2)));
  const vis = items.map((it, i) => ({ it, i })).filter(x => !cat || x.it.cat === cat), row = ({ it, i }) => `<div class="item ${it.done ? 'done' : ''}"><div class="ic" style="${it.photo ? `background-image:url(${it.photo})` : ''}">${it.photo ? '' : ICON[it.cat || 0]}</div><div class="t"><b>${esc(it.text)}</b><small>${it.done ? `✓ ${T.on} ${new Date(it.done).toLocaleDateString(ES ? 'es' : 'en', { day: 'numeric', month: 'short', year: 'numeric' })}${it.note ? ' · ' + esc(it.note) : ''}` : T.cats[it.cat || 0]}</small></div><button class="ck" data-i="${i}">${it.done ? '✓' : ''}</button></div>`;
  const pend = vis.filter(x => !x.it.done), fin = vis.filter(x => x.it.done);
  $('list').innerHTML = (pend.length ? `<div class="sec">${T.pend}</div>` + pend.map(row).join('') : '') + (fin.length ? `<div class="sec">${T.done}</div>` + fin.map(row).join('') : '');
  $('list').querySelectorAll('.ck').forEach(b => b.onclick = () => { const it = items[+b.dataset.i]; if (it.done) { it.done = null; it.photo = null; it.note = ''; save(); render(); } else openDone(+b.dataset.i); });
}
// A guess at the category from the words, so adding stays one step.
function guess(t) { const s = t.toLowerCase(); return /viaj|visit|japón|japan|país|country|trip|travel|ciudad|city/.test(s) ? 1 : /saltar|paracaid|sky|dive|escal|climb|correr|run|surf|nadar|swim|montaña|mountain|estrellas|stars/.test(s) ? 2 : /aprend|learn|idioma|language|curso|course|leer|read/.test(s) ? 3 : /carta|letter|famil|amig|friend|abuel|madre|padre|mum|dad/.test(s) ? 4 : /escrib|write|pint|paint|plant|music|tocar|play|construir|build/.test(s) ? 5 : 0; }
function add(t) { t = t.trim(); if (!t) return; items.unshift({ text: t, cat: cat || guess(t), done: null, t: Date.now() }); save(); render(); }
$('form').onsubmit = e => { e.preventDefault(); add($('txt').value); $('txt').value = ''; };
function openDone(i) { finishing = i; photo = null; $('mPhoto').style.backgroundImage = ''; $('mPhoto').childNodes[1].textContent = '📸'; $('mNote').value = ''; $('modal').hidden = false; }
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; const im = new Image(); im.onload = () => { const s = Math.min(1, 360 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); photo = c.toDataURL('image/jpeg', .75); $('mPhoto').style.backgroundImage = `url(${photo})`; $('mPhoto').childNodes[1].textContent = ''; URL.revokeObjectURL(im.src); }; im.src = URL.createObjectURL(f); };
$('mCancel').onclick = () => $('modal').hidden = true;
$('mOk').onclick = () => {
  const it = items[finishing]; if (!it) return; it.done = Date.now(); it.photo = photo; it.note = $('mNote').value.trim(); save(); $('modal').hidden = true; render();
  $('burst').innerHTML = Array.from({ length: 16 }, (_, k) => `<i style="--x:${Math.cos(k / 16 * 6.283) * 160}px;--y:${Math.sin(k / 16 * 6.283) * 160}px">${['🎉', '⭐', '✨', '🎊'][k % 4]}</i>`).join(''); setTimeout(() => $('burst').innerHTML = '', 1200);
  try { window.Acornix && Acornix.vibrate([30, 60, 30, 60, 80]); } catch (e) {}
};
(async () => { items = await store.get('items', []); render(); })();
</script>
</body>
</html>
