<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caption Writer</title>
<style>
  :root { --bg:#fff7f2; --card:#fff; --ink:#2a1d18; --muted:#94807a; --a:#ff5c39; --line:#f6e4da; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, label.btn { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  h1 { margin:0 0 4px; font-size:26px; }
  .sub { color:var(--muted); font-weight:600; margin-bottom:14px; font-size:15px; }
  .pick { display:block; position:relative; border-radius:22px; overflow:hidden; background:var(--card); border:2px dashed #f3c9b8; min-height:180px; cursor:pointer; }
  .pick img { width:100%; max-height:42vh; object-fit:cover; display:block; }
  .pick .ph { position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:var(--muted); font-weight:800; line-height:1.6; }
  .pick .ph b { font-size:46px; display:block; }
  .pick .chg { position:absolute; right:10px; bottom:10px; padding:6px 12px; border-radius:14px; background:#000a; color:#fff; font-size:13px; font-weight:800; }
  input[type=file] { display:none; }
  .lbl { font-size:13px; font-weight:900; color:var(--muted); margin:16px 2px 8px; text-transform:uppercase; letter-spacing:.5px; }
  .row { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:9px 13px; border-radius:20px; background:var(--card); border:2px solid var(--line); font-weight:800; font-size:14px; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .ctx { width:100%; padding:12px 14px; border-radius:14px; border:2px solid var(--line); background:var(--card); font:inherit; color:var(--ink); outline:none; }
  .ctx:focus { border-color:var(--a); }
  .go { width:100%; margin-top:16px; padding:16px; border-radius:18px; background:var(--a); color:#fff; font-weight:900; font-size:17px; box-shadow:0 8px 22px #ff5c3944; }
  .go:disabled { opacity:.5; }
  .err { color:#c92a2a; font-weight:700; margin:12px 0; }
  .caps { display:grid; gap:10px; margin-top:16px; }
  .cap { background:var(--card); border-radius:18px; padding:14px; border:2px solid var(--line); }
  .cap p { margin:0 0 6px; font-size:16px; line-height:1.45; white-space:pre-wrap; }
  .cap .tags { color:#2f6fed; font-size:14px; font-weight:600; line-height:1.5; }
  .cap .acts { display:flex; gap:8px; margin-top:10px; }
  .cap .acts button { padding:7px 12px; border-radius:12px; background:var(--bg); font-weight:800; font-size:13px; }
  .loading { text-align:center; padding:26px; color:var(--muted); font-weight:800; }
  .loading span { display:inline-block; animation:b 1s infinite alternate; font-size:30px; }
  @keyframes b { to { transform:translateY(-8px); } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✍️ <span id="ttl"></span></h1>
  <div class="sub" id="sub"></div>
  <label class="pick" id="pick"><input type="file" id="file" accept="image/*"><div class="ph" id="ph"></div></label>
  <div class="lbl" id="lTone"></div>
  <div class="row" id="tones"></div>
  <div class="lbl" id="lFor"></div>
  <div class="row" id="plats"></div>
  <div class="lbl" id="lCtx"></div>
  <input class="ctx" id="ctx" maxlength="140">
  <button class="go" id="go" disabled></button>
  <div class="err" id="err"></div>
  <div class="caps" id="caps"></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Pies de Foto', sub:'Tu IA mira la foto y te escribe el texto perfecto para publicarla', pick:'Toca para elegir una foto', change:'Cambiar', tone:'Tono', for:'Para', ctx:'Contexto (opcional)', ctxPh:'Ej: cumpleaños de mi abuela en Cádiz', go:'✨ Escribir pies de foto', more:'✨ Otros 4', noAi:'Abre esta app dentro de Acornix y conecta tu IA para usarla.', failed:'No he podido escribirlos: ', copy:'📋 Copiar', share:'📤 Compartir', copied:'Copiado', writing:'Escribiendo',
  tones:[['😂', 'Divertido'], ['🌙', 'Poético'], ['🔥', 'Con actitud'], ['🥹', 'Tierno'], ['🧐', 'Minimalista'], ['💼', 'Profesional']], plats:['Instagram', 'TikTok', 'WhatsApp', 'LinkedIn', 'X'], lang:'Spanish (Spain)' }
 : { title:'Caption Writer', sub:'Your AI looks at the photo and writes the perfect text to post it', pick:'Tap to choose a photo', change:'Change', tone:'Tone', for:'For', ctx:'Context (optional)', ctxPh:'E.g. my grandma\'s birthday in Lisbon', go:'✨ Write captions', more:'✨ 4 more', noAi:'Open this app inside Acornix and connect your AI to use it.', failed:'I couldn\'t write them: ', copy:'📋 Copy', share:'📤 Share', copied:'Copied', writing:'Writing',
  tones:[['😂', 'Funny'], ['🌙', 'Poetic'], ['🔥', 'Bold'], ['🥹', 'Sweet'], ['🧐', 'Minimal'], ['💼', 'Professional']], plats:['Instagram', 'TikTok', 'WhatsApp', 'LinkedIn', 'X'], lang:'English' };
const $ = id => document.getElementById(id);
['ttl', 'sub', 'lTone', 'lFor', 'lCtx', 'go'].forEach((id, i) => $(id).textContent = [T.title, T.sub, T.tone, T.for, T.ctx, T.go][i]);
$('ctx').placeholder = T.ctxPh; $('ph').innerHTML = `<div><b>🖼️</b>${T.pick}</div>`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let photo = null, tone = 0, plat = 0, caps = [];
function chips() {
  $('tones').innerHTML = T.tones.map(([e, n], i) => `<button class="chip ${i === tone ? 'on' : ''}" data-i="${i}">${e} ${n}</button>`).join('');
  $('tones').querySelectorAll('.chip').forEach(b => b.onclick = () => { tone = +b.dataset.i; chips(); });
  $('plats').innerHTML = T.plats.map((n, i) => `<button class="chip ${i === plat ? 'on' : ''}" data-i="${i}">${n}</button>`).join('');
  $('plats').querySelectorAll('.chip').forEach(b => b.onclick = () => { plat = +b.dataset.i; chips(); });
}
$('file').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const im = new Image(); im.onload = () => { const s = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); photo = c.toDataURL('image/jpeg', .85);
    $('pick').querySelectorAll('img,.chg').forEach(x => x.remove()); $('ph').hidden = true; $('pick').insertAdjacentHTML('beforeend', `<img src="${photo}"><span class="chg">${T.change}</span>`); $('pick').style.borderStyle = 'solid'; $('go').disabled = false; caps = []; renderCaps(); $('go').textContent = T.go; URL.revokeObjectURL(im.src); };
  im.src = URL.createObjectURL(f);
};
function renderCaps() {
  $('caps').innerHTML = caps.map((c, i) => `<div class="cap"><p>${esc(c.text)}</p>${c.tags && c.tags.length ? `<div class="tags">${c.tags.map(t => esc('#' + String(t).replace(/^#/, ''))).join(' ')}</div>` : ''}<div class="acts"><button data-c="${i}">${T.copy}</button><button data-s="${i}">${T.share}</button></div></div>`).join('');
  const full = c => c.text + (c.tags && c.tags.length ? '\n\n' + c.tags.map(t => '#' + String(t).replace(/^#/, '')).join(' ') : '');
  $('caps').querySelectorAll('[data-c]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(full(caps[+b.dataset.c])); } catch (e) {} b.textContent = '✅ ' + T.copied; try { window.Acornix && Acornix.vibrate(10); } catch (e) {} setTimeout(() => b.textContent = T.copy, 1400); });
  $('caps').querySelectorAll('[data-s]').forEach(b => b.onclick = async () => { const t = full(caps[+b.dataset.s]); try { if (window.Acornix) await Acornix.share(t); else if (navigator.share) await navigator.share({ text: t }); } catch (e) {} });
}
$('go').onclick = async () => {
  $('err').textContent = '';
  if (!window.Acornix) { $('err').textContent = T.noAi; return; }
  if (!photo) return;
  $('go').disabled = true; $('caps').innerHTML = `<div class="loading"><span>✍️</span><div>${T.writing}…</div></div>`;
  const p = T.plats[plat], tags = p === 'WhatsApp' ? 'no hashtags' : p === 'LinkedIn' ? '2 or 3 professional hashtags' : p === 'X' ? 'at most 2 hashtags, keep each caption under 240 characters' : '5 to 8 relevant hashtags';
  try {
    const r = await Acornix.askAI(`Write 4 different captions for this photo. Tone: ${T.tones[tone][1]}. Platform: ${p}.${$('ctx').value.trim() ? ' Context from the author: ' + $('ctx').value.trim() : ''}`, {
      images: [photo], json: true,
      system: `You write social media captions that sound human, never generic or cheesy. Base each caption on what is really in the photo. Vary the length and structure between the 4 options; emojis only where they add something. ${tags}. Write in ${T.lang}. Reply only with JSON: {"captions":[{"text":"the caption without hashtags","tags":["hashtag without #"]}]}`
    });
    if (!r || !Array.isArray(r.captions) || !r.captions.length) throw new Error('?');
    caps = r.captions.map(c => ({ text: String(c.text || ''), tags: Array.isArray(c.tags) ? c.tags : [] })).filter(c => c.text); renderCaps(); $('go').textContent = T.more;
    try { Acornix.vibrate(20); } catch (e) {}
  } catch (e) { renderCaps(); $('err').textContent = T.failed + (e.message || ''); }
  $('go').disabled = false;
};
chips();
</script>
</body>
</html>
