<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contrast Checker</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#15171c; --muted:#6b7180; --line:#e3e6eb; --ok:#2b8a3e; --no:#c92a2a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  h1 { margin:0 0 14px; font-size:24px; }
  .prev { border-radius:22px; padding:22px 20px; box-shadow:0 8px 30px #15171c14; transition:background .2s,color .2s; }
  .prev .big { font-size:30px; font-weight:800; line-height:1.15; margin:0 0 10px; }
  .prev p { margin:0 0 14px; font-size:16px; line-height:1.5; }
  .prev small { font-size:13px; opacity:1; }
  .prev .btnx { display:inline-block; margin-top:14px; padding:10px 16px; border-radius:12px; border:2px solid currentColor; font-weight:800; }
  .ratio { display:flex; align-items:center; gap:14px; margin:18px 2px 12px; }
  .ratio b { font-size:44px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-1px; }
  .ratio span { color:var(--muted); font-weight:700; line-height:1.35; }
  .grades { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .g { background:var(--card); border-radius:14px; padding:11px 12px; display:flex; justify-content:space-between; align-items:center; border:2px solid var(--line); font-size:14px; font-weight:700; }
  .g i { font-style:normal; font-weight:900; font-size:13px; padding:3px 9px; border-radius:8px; color:#fff; }
  .pick { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:end; margin-top:16px; }
  .pick label { display:block; font-size:12px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:0 0 6px 2px; }
  .field { display:flex; align-items:center; gap:8px; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:6px; }
  .field input[type=color] { width:38px; height:38px; border:0; padding:0; background:none; border-radius:10px; flex:none; }
  .field input[type=text] { width:100%; min-width:0; border:0; outline:none; font:700 16px ui-monospace,Menlo,monospace; text-transform:uppercase; background:none; color:var(--ink); }
  .swap { width:44px; height:52px; border-radius:14px; background:var(--card); border:2px solid var(--line); font-size:18px; }
  .fix { width:100%; margin-top:14px; padding:14px; border-radius:16px; background:var(--ink); color:#fff; font-weight:900; font-size:15px; }
  .fix:disabled { opacity:.35; }
  h3 { margin:24px 2px 10px; font-size:15px; }
  .pairs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pairs button { border-radius:14px; padding:14px 6px; font-weight:900; font-size:15px; border:2px solid #0000000d; }
  .pairs small { display:block; font-size:11px; font-weight:700; opacity:.8; margin-top:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌓 <span id="ttl"></span></h1>
  <div class="prev" id="prev"><div class="big" id="pBig"></div><p id="pTxt"></p><small id="pSmall"></small><br><span class="btnx" id="pBtn"></span></div>
  <div class="ratio"><b id="ratio"></b><span id="verdict"></span></div>
  <div class="grades" id="grades"></div>
  <div class="pick">
    <div><label id="lFg"></label><div class="field"><input type="color" id="fgC"><input type="text" id="fgT" maxlength="7"></div></div>
    <button class="swap" id="swap">⇄</button>
    <div><label id="lBg"></label><div class="field"><input type="color" id="bgC"><input type="text" id="bgT" maxlength="7"></div></div>
  </div>
  <button class="fix" id="fix"></button>
  <h3 id="lPairs"></h3>
  <div class="pairs" id="pairs"></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Contraste', big:'Titular grande', txt:'Así se lee un párrafo normal con estos dos colores. ¿Cómodo, o hay que forzar la vista?', small:'Texto pequeño de ayuda, el más difícil de leer', btn:'Botón', fg:'Texto', bg:'Fondo', fix:'🪄 Arreglar el texto para que pase AA', ok:'Lo pasa todo', okAA:'Bien para casi todo', large:'Solo para textos grandes', bad:'Muy poco contraste', normal:'Texto normal', largeT:'Texto grande', pairs:'Combinaciones que pasan', ui:'Iconos y bordes' }
 : { title:'Contrast Checker', big:'Big headline', txt:'This is how a normal paragraph reads with these two colours. Comfortable, or do you have to strain?', small:'Small helper text, the hardest to read', btn:'Button', fg:'Text', bg:'Background', fix:'🪄 Fix the text colour to pass AA', ok:'Passes everything', okAA:'Fine for almost everything', large:'Only for large text', bad:'Too little contrast', normal:'Normal text', largeT:'Large text', pairs:'Pairs that pass', ui:'Icons & borders' };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
['ttl', 'pBig', 'pTxt', 'pSmall', 'pBtn', 'lFg', 'lBg', 'fix', 'lPairs'].forEach((id, i) => $(id).textContent = [T.title, T.big, T.txt, T.small, T.btn, T.fg, T.bg, T.fix, T.pairs][i]);
let fg = '#6b7180', bg = '#ffffff';
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const hex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
// WCAG 2 relative luminance and contrast ratio.
const lum = h => { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
function render() {
  const r = ratio(fg, bg);
  $('prev').style.background = bg; $('prev').style.color = fg;
  $('ratio').textContent = r.toFixed(2) + ':1';
  $('verdict').textContent = r >= 7 ? '✅ ' + T.ok : r >= 4.5 ? '👍 ' + T.okAA : r >= 3 ? '⚠️ ' + T.large : '⛔ ' + T.bad;
  const G = [[T.normal + ' AA', 4.5], [T.normal + ' AAA', 7], [T.largeT + ' AA', 3], [T.largeT + ' AAA', 4.5], [T.ui, 3]];
  $('grades').innerHTML = G.map(([n, need]) => `<div class="g">${n}<i style="background:${r >= need ? 'var(--ok)' : 'var(--no)'}">${r >= need ? '✓' : '✗'} ${need}</i></div>`).join('');
  $('fgC').value = fg; $('bgC').value = bg;
  if (document.activeElement !== $('fgT')) $('fgT').value = fg.toUpperCase();
  if (document.activeElement !== $('bgT')) $('bgT').value = bg.toUpperCase();
  $('fix').disabled = r >= 4.5;
  store.set('pair', [fg, bg]);
}
// Darken or lighten the text (keeping its hue) in small steps until it reaches 4.5:1.
function fix() {
  const dark = lum(bg) > .18, c = rgb(fg);
  for (let t = 0; t <= 1; t += .01) { const m = c.map(v => dark ? v * (1 - t) : v + (255 - v) * t), h = hex(m); if (ratio(h, bg) >= 4.5) { fg = h; break; } }
  render(); try { window.Acornix && Acornix.vibrate(15); } catch (e) {}
}
$('fix').onclick = fix;
$('swap').onclick = () => { [fg, bg] = [bg, fg]; render(); };
$('fgC').oninput = e => { fg = e.target.value; render(); };
$('bgC').oninput = e => { bg = e.target.value; render(); };
const typed = (id, set) => $(id).oninput = e => { let v = e.target.value.trim(); if (!v.startsWith('#')) v = '#' + v; if (/^#[0-9a-f]{6}$/i.test(v)) { set(v.toLowerCase()); render(); } else if (/^#[0-9a-f]{3}$/i.test(v)) { set(('#' + [...v.slice(1)].map(x => x + x).join('')).toLowerCase()); render(); } };
typed('fgT', v => fg = v); typed('bgT', v => bg = v);
['fgT', 'bgT'].forEach(id => $(id).onblur = render);
const PAIRS = [['#1d3557', '#f1faee'], ['#ffffff', '#2b2d42'], ['#3d0066', '#ffd166'], ['#ffffff', '#0b7285'], ['#14213d', '#fca311'], ['#264653', '#e9f5db'], ['#ffffff', '#c1121f'], ['#2d1e2f', '#f7b2bd'], ['#fefae0', '#283618']];
$('pairs').innerHTML = PAIRS.map(([f, b], i) => `<button data-i="${i}" style="color:${f};background:${b}">Aa<small>${ratio(f, b).toFixed(1)}:1</small></button>`).join('');
$('pairs').querySelectorAll('button').forEach(b => b.onclick = () => { [fg, bg] = PAIRS[+b.dataset.i]; render(); scrollTo({ top: 0, behavior: 'smooth' }); });
(async () => { const p = await store.get('pair', null); if (p) [fg, bg] = p; render(); })();
</script>
</body>
</html>
