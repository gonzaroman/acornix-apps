<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>What Can I Do?</title>
<style>
  :root { --bg:#0b0b12; --card:#171725; --line:#2a2a3d; --text:#f4f2ff; --muted:#a19fbd; --accent:#ffcf4a; --accent2:#ff7ab6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { overflow:hidden; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }

  /* Camera view */
  #cam { position:relative; flex:1; overflow:hidden; background:radial-gradient(circle at 50% 40%,#22223a,#0b0b12 70%); }
  video, #still { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #still { display:none; }
  .top { position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 14px) 16px 26px; background:linear-gradient(#000a,#0000); z-index:2; }
  .title { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; letter-spacing:-.3px; }
  .title small { font-weight:600; color:var(--muted); font-size:13px; }
  .lenses { display:flex; gap:8px; overflow-x:auto; margin-top:12px; scrollbar-width:none; }
  .lenses::-webkit-scrollbar { display:none; }
  .lens { flex:none; padding:8px 13px; border-radius:999px; background:#ffffff1f; backdrop-filter:blur(10px); font-size:14px; font-weight:600; white-space:nowrap; border:1px solid #ffffff22; }
  .lens.on { background:var(--accent); color:#1d1600; border-color:var(--accent); }
  .hint { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(78vw,300px); aspect-ratio:1; border-radius:28px; border:2px dashed #ffffff40; display:flex; align-items:center; justify-content:center; text-align:center; color:#ffffffb0; font-size:15px; padding:24px; pointer-events:none; }
  .hint.hide { display:none; }
  .bottom { position:absolute; left:0; right:0; bottom:0; padding:22px 28px calc(env(safe-area-inset-bottom) + 22px); display:flex; align-items:center; justify-content:space-between; background:linear-gradient(#0000,#000b); z-index:2; }
  .round { width:52px; height:52px; border-radius:50%; background:#ffffff22; backdrop-filter:blur(10px); display:grid; place-items:center; font-size:22px; }
  .shutter { width:78px; height:78px; border-radius:50%; border:5px solid #fff; background:radial-gradient(circle,var(--accent) 0 55%,#fff0 56%); box-shadow:0 0 0 6px #ffffff22; transition:transform .12s; }
  .shutter:active { transform:scale(.9); }

  /* Results sheet */
  #sheet { position:absolute; left:0; right:0; bottom:0; max-height:72%; background:var(--bg); border-radius:26px 26px 0 0; transform:translateY(105%); transition:transform .35s cubic-bezier(.2,.8,.2,1); z-index:5; display:flex; flex-direction:column; box-shadow:0 -12px 40px #0008; }
  #sheet.open { transform:none; }
  .grab { width:42px; height:5px; border-radius:3px; background:var(--line); margin:10px auto 4px; flex:none; }
  .sheet-head { padding:6px 20px 10px; flex:none; }
  .seen { color:var(--muted); font-size:14px; line-height:1.4; }
  .seen b { color:var(--text); }
  #ideas { overflow-y:auto; padding:4px 16px 12px; flex:1; }
  .idea { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:10px; }
  .idea-top { display:flex; gap:12px; align-items:flex-start; }
  .idea-emoji { font-size:28px; width:46px; height:46px; display:grid; place-items:center; background:#ffffff0d; border-radius:14px; flex:none; }
  .idea h3 { margin:0 0 4px; font-size:16px; }
  .idea p { margin:0; color:var(--muted); font-size:14px; line-height:1.4; }
  .meta { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .chip { font-size:12px; padding:3px 9px; border-radius:999px; background:#ffffff12; color:#d8d6ef; }
  .steps { margin:12px 0 0; padding-left:20px; color:#dcdaf2; font-size:14px; line-height:1.5; display:none; }
  .idea.open .steps { display:block; }
  .actions { display:flex; gap:10px; padding:10px 16px calc(env(safe-area-inset-bottom) + 14px); flex:none; border-top:1px solid var(--line); }
  .btn { flex:1; padding:14px; border-radius:16px; background:var(--card); border:1px solid var(--line); font-weight:700; font-size:15px; }
  .btn.main { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#1d1020; border:0; }
  .loading { padding:18px 4px; }
  .shimmer { height:84px; border-radius:18px; margin-bottom:10px; background:linear-gradient(90deg,#171725 0%,#24243a 50%,#171725 100%); background-size:200% 100%; animation:sh 1.2s infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  .msg { text-align:center; padding:26px 18px; color:var(--muted); line-height:1.5; }
  .msg .big { font-size:40px; display:block; margin-bottom:8px; }

  /* History */
  #history { position:absolute; inset:0; background:var(--bg); z-index:8; display:none; flex-direction:column; }
  #history.open { display:flex; }
  .h-head { display:flex; align-items:center; justify-content:space-between; padding:calc(env(safe-area-inset-top) + 14px) 16px 10px; font-weight:800; font-size:20px; }
  .h-list { overflow-y:auto; padding:0 16px 20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .h-item { background:var(--card); border-radius:16px; overflow:hidden; border:1px solid var(--line); text-align:left; }
  .h-item img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
  .h-item div { padding:8px 10px; font-size:13px; color:var(--muted); }
  .h-item b { display:block; color:var(--text); font-size:14px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { color:var(--muted); text-align:center; padding:40px 20px; grid-column:1/-1; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="cam">
    <video id="video" playsinline muted autoplay></video>
    <img id="still" alt="">
    <div class="top">
      <div class="title">📸 <span id="tTitle"></span></div>
      <div class="lenses" id="lenses"></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="bottom">
      <button class="round" id="galleryBtn" aria-label="Photo">🖼️</button>
      <button class="shutter" id="shutter" aria-label="Snap"></button>
      <button class="round" id="historyBtn" aria-label="History">🕘</button>
    </div>
  </div>
  <div id="sheet">
    <div class="grab"></div>
    <div class="sheet-head"><div class="seen" id="seen"></div></div>
    <div id="ideas"></div>
    <div class="actions">
      <button class="btn" id="againBtn"></button>
      <button class="btn main" id="moreBtn"></button>
    </div>
  </div>
  <div id="history">
    <div class="h-head"><span id="hTitle"></span><button class="round" id="closeHistory">✕</button></div>
    <div class="h-list" id="hList"></div>
  </div>
</div>
<input type="file" id="file" accept="image/*">
<canvas id="canvas" hidden></canvas>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? {
  title: '¿Qué puedo hacer?', hint: 'Apunta a cualquier cosa y pulsa el botón: tu IA te dará ideas',
  lenses: [['any','✨ Lo que sea'],['cook','🍳 Cocinar'],['make','🎨 Crear'],['fix','🛠️ Arreglar'],['gift','🎁 Regalar'],['play','🧸 Jugar'],['learn','🔬 Aprender']],
  thinking: 'Mirando tu foto…', seen: 'Veo:', again: '📷 Otra foto', more: '✨ Más ideas', history: 'Tus fotos',
  noHistory: 'Aquí aparecerán tus fotos con sus ideas.', noAcornix: 'Abre esta app en Acornix y conecta tu IA para recibir ideas.',
  failed: 'No he podido pensar ideas', retry: 'Reintentar', min: 'min', levels: { easy:'fácil', medium:'media', hard:'difícil' },
  noCam: 'No hay cámara disponible: elige una foto con 🖼️', lang: 'Spanish'
} : {
  title: 'What Can I Do?', hint: 'Point at anything and tap the button: your AI will give you ideas',
  lenses: [['any','✨ Anything'],['cook','🍳 Cook'],['make','🎨 Create'],['fix','🛠️ Fix'],['gift','🎁 Gift'],['play','🧸 Play'],['learn','🔬 Learn']],
  thinking: 'Looking at your photo…', seen: 'I see:', again: '📷 New photo', more: '✨ More ideas', history: 'Your photos',
  noHistory: 'Your photos and their ideas will show up here.', noAcornix: 'Open this app in Acornix and connect your AI to get ideas.',
  failed: "I couldn't come up with ideas", retry: 'Try again', min: 'min', levels: { easy:'easy', medium:'medium', hard:'hard' },
  noCam: 'No camera available: pick a photo with 🖼️', lang: 'English'
};
const FOCUS = {
  any: 'anything useful, fun or creative to do with what is in the photo',
  cook: 'dishes, drinks or snacks to make with the food or ingredients in the photo',
  make: 'crafts, DIY projects, art or upcycling ideas using what is in the photo',
  fix: 'how to repair, clean, organise or improve what is in the photo',
  gift: 'gift ideas inspired by the photo, or ways to turn it into a present',
  play: 'games and activities for kids or friends using what is in the photo',
  learn: 'surprising facts and small experiments to learn about what is in the photo'
};

const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const $ = id => document.getElementById(id);
const video = $('video'), still = $('still'), canvas = $('canvas');
let lens = 'any', photo = null, last = null, shown = [];

$('tTitle').textContent = T.title;
$('hint').textContent = T.hint;
$('againBtn').textContent = T.again;
$('moreBtn').textContent = T.more;
$('hTitle').textContent = T.history;
T.lenses.forEach(([id, label]) => {
  const b = document.createElement('button');
  b.className = 'lens' + (id === lens ? ' on' : '');
  b.textContent = label;
  b.onclick = () => { lens = id; document.querySelectorAll('.lens').forEach(x => x.classList.toggle('on', x === b)); store.set('lens', id); };
  b.dataset.id = id;
  $('lenses').appendChild(b);
});
store.get('lens', 'any').then(v => { lens = v; document.querySelectorAll('.lens').forEach(x => x.classList.toggle('on', x.dataset.id === v)); });

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
    video.srcObject = stream;
  } catch (e) {
    $('hint').textContent = T.noCam;
  }
}

function frameToDataUrl(source, w, h) {
  const max = 1024, s = Math.min(1, max / Math.max(w, h));
  canvas.width = Math.round(w * s); canvas.height = Math.round(h * s);
  canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.85);
}

function thumb(dataUrl) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'), s = 220 / Math.max(img.width, img.height);
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

function snap() {
  if (!video.videoWidth) { $('file').click(); return; }
  if (window.Acornix) Acornix.vibrate(30).catch(() => {});
  usePhoto(frameToDataUrl(video, video.videoWidth, video.videoHeight));
}

function usePhoto(dataUrl) {
  photo = dataUrl; shown = [];
  still.src = dataUrl; still.style.display = 'block';
  $('hint').classList.add('hide');
  ask();
}

$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { usePhoto(frameToDataUrl(img, img.width, img.height)); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
  e.target.value = '';
};

function openSheet() { $('sheet').classList.add('open'); }
function closeSheet() {
  $('sheet').classList.remove('open');
  still.style.display = 'none'; photo = null;
  $('hint').classList.remove('hide');
}

function loading() {
  $('seen').textContent = T.thinking;
  $('ideas').innerHTML = '<div class="loading">' + '<div class="shimmer"></div>'.repeat(3) + '</div>';
  $('moreBtn').disabled = true;
  openSheet();
}

function message(icon, text, retry) {
  $('seen').textContent = '';
  $('ideas').innerHTML = '';
  const m = document.createElement('div'); m.className = 'msg';
  m.innerHTML = '<span class="big"></span><span class="t"></span>';
  m.querySelector('.big').textContent = icon; m.querySelector('.t').textContent = text;
  if (retry) {
    const b = document.createElement('button'); b.className = 'btn main'; b.style.marginTop = '16px'; b.style.width = '100%';
    b.textContent = T.retry; b.onclick = ask; m.appendChild(b);
  }
  $('ideas').appendChild(m);
}

async function ask() {
  if (!photo) return;
  loading();
  if (!window.Acornix) { message('🧠', T.noAcornix); $('moreBtn').disabled = false; return; }
  const avoid = shown.length ? ' Do not repeat these ideas: ' + shown.join('; ') + '.' : '';
  try {
    const r = await Acornix.askAI(
      'Look at this photo. Suggest 5 ideas: ' + FOCUS[lens] + '.' + avoid +
      ' Make them practical and specific to what you actually see, mixing quick and more ambitious ones.',
      {
        images: [photo], json: true,
        system: 'You are a cheerful, practical idea coach. Answer in ' + T.lang + '. Reply only with JSON: ' +
          '{"seen":"what you see, max 12 words","ideas":[{"emoji":"one emoji","title":"max 6 words","why":"one sentence",' +
          '"minutes":15,"level":"easy|medium|hard","steps":["3 to 5 short steps"]}]}'
      });
    render(r);
    last = r;
    const list = await store.get('history', []);
    list.unshift({ at: Date.now(), lens, thumb: await thumb(photo), seen: r.seen || '', ideas: r.ideas || [] });
    store.set('history', list.slice(0, 24));
  } catch (e) {
    message('😕', T.failed + (e && e.message ? ': ' + e.message : ''), true);
  }
  $('moreBtn').disabled = false;
}

function render(r) {
  $('seen').innerHTML = '';
  const b = document.createElement('b'); b.textContent = T.seen + ' ';
  $('seen').append(b, document.createTextNode(r.seen || ''));
  $('ideas').innerHTML = '';
  (r.ideas || []).forEach((idea, i) => {
    shown.push(idea.title);
    const card = document.createElement('div'); card.className = 'idea' + (i === 0 ? ' open' : '');
    card.innerHTML = '<div class="idea-top"><div class="idea-emoji"></div><div><h3></h3><p></p><div class="meta"></div></div></div><ol class="steps"></ol>';
    card.querySelector('.idea-emoji').textContent = idea.emoji || '💡';
    card.querySelector('h3').textContent = idea.title || '';
    card.querySelector('p').textContent = idea.why || '';
    const meta = card.querySelector('.meta');
    if (idea.minutes) meta.insertAdjacentHTML('beforeend', '<span class="chip">⏱ ' + Number(idea.minutes) + ' ' + T.min + '</span>');
    if (idea.level) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = '📶 ' + (T.levels[idea.level] || idea.level); meta.appendChild(c); }
    (idea.steps || []).forEach(s => { const li = document.createElement('li'); li.textContent = s; card.querySelector('.steps').appendChild(li); });
    card.onclick = () => card.classList.toggle('open');
    $('ideas').appendChild(card);
  });
  openSheet();
}

async function showHistory() {
  const list = await store.get('history', []);
  const box = $('hList'); box.innerHTML = '';
  if (!list.length) box.innerHTML = '<div class="empty"></div>', box.firstChild.textContent = T.noHistory;
  list.forEach(h => {
    const b = document.createElement('button'); b.className = 'h-item';
    b.innerHTML = '<img alt=""><div><b></b><span></span></div>';
    b.querySelector('img').src = h.thumb;
    b.querySelector('b').textContent = h.ideas[0] ? h.ideas[0].emoji + ' ' + h.ideas[0].title : '…';
    b.querySelector('span').textContent = new Date(h.at).toLocaleDateString();
    b.onclick = () => {
      $('history').classList.remove('open');
      photo = h.thumb; still.src = h.thumb; still.style.display = 'block'; $('hint').classList.add('hide');
      shown = []; render(h);
    };
    box.appendChild(b);
  });
  $('history').classList.add('open');
}

$('shutter').onclick = snap;
$('galleryBtn').onclick = () => $('file').click();
$('historyBtn').onclick = showHistory;
$('closeHistory').onclick = () => $('history').classList.remove('open');
$('againBtn').onclick = closeSheet;
$('moreBtn').onclick = ask;
startCamera();
</script>
</body>
</html>
