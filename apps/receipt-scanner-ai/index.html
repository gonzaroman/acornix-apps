<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Receipt Scanner</title>
<style>
  :root { --bg:#f3f1ec; --card:#fff; --ink:#23211d; --muted:#8c877b; --line:#e7e2d7; --a:#0f9d74; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:inherit; border:0; cursor:pointer; background:none; }
  #app { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px); }
  h1 { margin:0; font-size:26px; }
  .sum { margin:12px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sum div { background:var(--card); border-radius:18px; padding:14px; }
  .sum small { display:block; color:var(--muted); font-weight:700; font-size:11px; letter-spacing:1px; text-transform:uppercase; }
  .sum b { font-size:24px; font-variant-numeric:tabular-nums; }
  .r { background:var(--card); border-radius:18px; margin-bottom:10px; overflow:hidden; }
  .r .head { display:flex; align-items:center; gap:10px; padding:12px 14px; width:100%; text-align:left; }
  .r .e { width:40px; height:40px; border-radius:12px; background:var(--bg); display:grid; place-items:center; font-size:20px; flex:none; }
  .r .t { flex:1; min-width:0; } .r .t b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .r .t small { color:var(--muted); }
  .r .amt { font-weight:800; font-variant-numeric:tabular-nums; }
  .r .items { display:none; padding:0 14px 12px; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .r.open .items { display:block; }
  .r .items div { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed var(--line); }
  .r .items .x { margin-top:8px; color:#c0392b; font-family:system-ui,sans-serif; font-weight:700; font-size:13px; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(env(safe-area-inset-bottom) + 14px); background:linear-gradient(#f3f1ec00,#f3f1ec 30%); display:flex; gap:10px; max-width:560px; margin:0 auto; }
  .bar button { padding:16px; border-radius:18px; font-weight:900; }
  .bar .snap { flex:1; background:var(--a); color:#fff; font-size:17px; box-shadow:0 8px 20px #0f9d7455; }
  .bar .csv { background:var(--card); }
  .status { background:var(--card); border-radius:18px; padding:16px; margin-bottom:10px; display:none; gap:12px; align-items:center; }
  .status.on { display:flex; }
  .status img { width:54px; height:72px; object-fit:cover; border-radius:8px; }
  .empty { text-align:center; color:var(--muted); padding:40px 16px; line-height:1.5; }
  .empty div { font-size:56px; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div id="app">
  <h1>🧾 <span id="ttl"></span></h1>
  <div class="sum"><div><small id="lMonth"></small><b id="month">0</b></div><div><small id="lCount"></small><b id="count">0</b></div></div>
  <div class="status" id="status"><img id="thumb" alt=""><div id="statusTxt"></div></div>
  <div id="list"></div>
</div>
<div class="bar"><button class="csv" id="csv">⬇ CSV</button><button class="snap" id="snap"></button></div>
<input type="file" id="file" accept="image/*" capture="environment">
<canvas id="canvas" hidden></canvas>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Tickets', month:'Este mes', count:'Tickets', snap:'📷 Escanear ticket', reading:'Leyendo el ticket…', noAi:'Abre esta app en Acornix y conecta tu IA para leer tickets.', failed:'No he podido leer el ticket: ', notReceipt:'Eso no parece un ticket. Prueba con otra foto.', del:'Borrar ticket', empty:'Haz una foto a tus tickets de compra y tu IA apuntará la tienda, los productos y el total.', lang:'Spanish',
  cats:{ groceries:'🛒', restaurant:'🍽️', transport:'⛽', shopping:'🛍️', health:'💊', home:'🏠', other:'🧾' } }
 : { title:'Receipts', month:'This month', count:'Receipts', snap:'📷 Scan a receipt', reading:'Reading the receipt…', noAi:'Open this app in Acornix and connect your AI to read receipts.', failed:'I couldn\'t read the receipt: ', notReceipt:'That doesn\'t look like a receipt. Try another photo.', del:'Delete receipt', empty:'Take a photo of your shopping receipts and your AI will note the shop, the items and the total.', lang:'English',
  cats:{ groceries:'🛒', restaurant:'🍽️', transport:'⛽', shopping:'🛍️', health:'💊', home:'🏠', other:'🧾' } };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
$('ttl').textContent = T.title; $('lMonth').textContent = T.month; $('lCount').textContent = T.count; $('snap').textContent = T.snap;
let receipts = [];
const money = (v, c) => { try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: c || 'EUR' }).format(v); } catch (e) { return v.toFixed(2) + ' ' + (c || ''); } };
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function render() {
  const now = new Date(), month = receipts.filter(r => { const d = new Date(r.date); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  $('month').textContent = money(month.reduce((a, r) => a + (+r.total || 0), 0), (month[0] || receipts[0] || {}).currency);
  $('count').textContent = receipts.length;
  const box = $('list'); box.innerHTML = '';
  if (!receipts.length) { box.innerHTML = `<div class="empty"><div>🧾</div>${T.empty}</div>`; return; }
  receipts.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(r => {
    const el = document.createElement('div'); el.className = 'r';
    el.innerHTML = `<button class="head"><span class="e">${T.cats[r.category] || '🧾'}</span><div class="t"><b>${esc(r.merchant)}</b><small>${new Date(r.date).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' })} · ${(r.items || []).length} ×</small></div><span class="amt">${money(+r.total || 0, r.currency)}</span></button>
      <div class="items">${(r.items || []).map(i => `<div><span>${esc(i.name)}</span><span>${money(+i.price || 0, r.currency)}</span></div>`).join('')}<button class="x">🗑 ${T.del}</button></div>`;
    el.querySelector('.head').onclick = () => el.classList.toggle('open');
    el.querySelector('.x').onclick = () => { receipts = receipts.filter(x => x !== r); store.set('receipts', receipts); render(); };
    box.appendChild(el);
  });
}
function shrink(file) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => { const c = $('canvas'), s = Math.min(1, 1600 / Math.max(im.width, im.height)); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .88)); }; im.onerror = rej; im.src = URL.createObjectURL(file); }); }
$('snap').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = await shrink(f); $('thumb').src = img; $('status').classList.add('on'); $('statusTxt').textContent = T.reading;
  if (!window.Acornix) { $('statusTxt').textContent = T.noAi; return; }
  try {
    const r = await Acornix.askAI('Read this shopping receipt.', { images: [img], json: true,
      system: `You read receipts precisely. Item names in ${T.lang} if you can translate them simply, otherwise as written. Reply only with JSON: {"isReceipt":true,"merchant":"","date":"YYYY-MM-DD","currency":"ISO code like EUR","total":0,"category":"groceries|restaurant|transport|shopping|health|home|other","items":[{"name":"","price":0}]}. Use numbers, not strings, for prices.` });
    if (!r || r.isReceipt === false || !r.total) { $('statusTxt').textContent = T.notReceipt; return; }
    if (!r.date || isNaN(new Date(r.date))) r.date = new Date().toISOString().slice(0, 10);
    receipts.push({ ...r, id: Date.now() }); await store.set('receipts', receipts);
    $('status').classList.remove('on'); try { Acornix.vibrate(20); } catch (e) {} render();
  } catch (err) { $('statusTxt').textContent = T.failed + (err && err.message || ''); }
};
$('csv').onclick = async () => {
  const rows = [['date', 'merchant', 'category', 'item', 'price', 'currency']];
  receipts.forEach(r => (r.items && r.items.length ? r.items : [{ name: 'TOTAL', price: r.total }]).forEach(i => rows.push([r.date, r.merchant, r.category, i.name, i.price, r.currency])));
  const csv = rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n');
  try { if (window.Acornix) { const file = await Acornix.files.save('receipts.csv', 'data:text/csv;base64,' + btoa(unescape(encodeURIComponent(csv)))); await Acornix.share(csv); } else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'receipts.csv'; a.click(); } } catch (e) {}
};
(async () => { receipts = await store.get('receipts', []); render(); })();
</script>
</body>
</html>
