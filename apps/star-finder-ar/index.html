  .find { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; }
  .find::-webkit-scrollbar { display:none; }
  .find button { flex:none; padding:8px 12px; border-radius:20px; background:#0b1030b3; backdrop-filter:blur(10px); font-weight:800; font-size:13px; border:1px solid #ffffff1f; }
  .find button.on { background:#ffd43b; color:#1a1300; }

  .card .x { position:absolute; top:8px; right:10px; background:none; font-size:18px; color:#9fb0ff; }
  .sheet { position:fixed; inset:0; background:#000a; display:flex; align-items:flex-end; }
  .sheet .in { width:100%; background:#0b1030; border-radius:22px 22px 0 0; padding:18px 16px calc(env(safe-area-inset-bottom) + 18px); border-top:1px solid #ffffff26; }
  .sheet h3 { margin:0 0 10px; }
  .sheet input { width:100%; padding:13px 14px; border-radius:14px; border:2px solid #ffffff26; background:#ffffff0d; outline:none; }
  .sheet .res button { display:block; width:100%; text-align:left; padding:12px 6px; background:none; border-bottom:1px solid #ffffff14; }
  .sheet .res small { color:#9fb0ff; }
  .sheet .muted { color:#9fb0ff; font-size:13px; margin-top:10px; line-height:1.5; }
  .msg { position:fixed; left:20px; right:20px; top:40%; text-align:center; font-weight:800; text-shadow:0 2px 12px #000; pointer-events:none; line-height:1.5; }
  [hidden] { display:none !important; }
