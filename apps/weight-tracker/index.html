<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weight Tracker</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#18203a; --muted:#6f7894; --a:#ff6b4a; --g:#12b886; --line:#e6e9f2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }
  .head { display:flex; justify-content:space-between; align-items:center; }
  h1 { margin:4px 0; font-size:26px; }
  .gear { width:42px; height:42px; border-radius:14px; background:var(--card); font-size:18px; }
  .hero { margin:10px 0; padding:18px; border-radius:24px; background:var(--card); box-shadow:0 8px 24px #18203a0d; }
  .hero .w { font-size:48px; font-weight:900; letter-spacing:-1.5px; font-variant-numeric:tabular-nums; }
  .hero .w small { font-size:20px; color:var(--muted); font-weight:700; letter-spacing:0; }
  .hero .ch { font-weight:800; }
  .hero .ch.down { color:var(--g); } .hero .ch.up { color:var(--a); }
  .prog { margin-top:12px; }
  .prog .t { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); font-weight:700; }
  .prog .bar { height:10px; border-radius:5px; background:var(--line); margin-top:6px; overflow:hidden; }
  .prog .bar i { display:block; height:100%; background:linear-gradient(90deg,#ffa94d,var(--g)); border-radius:5px; }
  .entry { display:flex; gap:8px; margin-bottom:10px; }
  .entry input { flex:1; min-width:0; padding:14px; border-radius:16px; border:2px solid var(--line); font:inherit; font-size:20px; font-weight:800; outline:none; background:#fff; }
  .entry input:focus { border-color:var(--a); }
  .entry button { padding:0 22px; border-radius:16px; background:var(--a); color:#fff; font-weight:900; font-size:16px; }
  .card { background:var(--card); border-radius:20px; padding:14px; margin-bottom:10px; }
  .card h3 { margin:0 0 8px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; display:flex; justify-content:space-between; align-items:center; }
  .range { display:flex; gap:4px; }
  .range button { padding:4px 8px; border-radius:8px; font-size:12px; font-weight:800; color:var(--muted); background:var(--bg); }
  .range button.on { background:var(--ink); color:#fff; }
  svg { width:100%; height:180px; display:block; }
  .bmi { display:flex; align-items:center; gap:12px; }
  .bmi b { font-size:28px; }
  .bmi .scale { flex:1; height:10px; border-radius:5px; background:linear-gradient(90deg,#74c0fc 0 18%,#51cf66 18% 50%,#ffd43b 50% 70%,#ff8787 70%); position:relative; }
  .bmi .scale i { position:absolute; top:-4px; width:4px; height:18px; border-radius:2px; background:var(--ink); }
  .bmi small { display:block; color:var(--muted); font-weight:700; }
  .row { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); font-weight:700; }
  .row:first-of-type { border-top:0; }
  .row span:first-child { color:var(--muted); font-weight:600; }
  .row button { color:#e03131; background:none; font-size:14px; margin-left:8px; }
  .sheet { position:fixed; inset:0; background:#0007; display:none; align-items:flex-end; z-index:5; }
  .sheet.on { display:flex; }
  .sheet > div { width:100%; background:var(--bg); border-radius:24px 24px 0 0; padding:18px 16px calc(env(safe-area-inset-bottom) + 18px); }
  .sheet label { display:block; font-weight:800; margin:12px 0 6px; }
  .sheet input { width:100%; padding:12px; border-radius:14px; border:2px solid var(--line); font:inherit; font-size:18px; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; padding:12px; border-radius:12px; background:#fff; font-weight:800; }
  .seg button.on { background:var(--ink); color:#fff; }
  .done { width:100%; margin-top:16px; padding:14px; border-radius:16px; background:var(--a); color:#fff; font-weight:900; }
  .note { color:var(--muted); font-size:12px; line-height:1.5; margin-top:8px; }
</style>
</head>
<body>
<div class="head"><h1>📉 <span id="ttl"></span></h1><button class="gear" id="gear">⚙️</button></div>
<div class="hero" id="hero"></div>
<div class="entry"><input id="w" type="number" inputmode="decimal" step="0.1"><button id="log"></button></div>
<div class="card"><h3><span id="trendT"></span><span class="range" id="range"></span></h3><svg id="chart" viewBox="0 0 340 180" preserveAspectRatio="none"></svg></div>
<div class="card" id="bmiCard"></div>
<div class="card" id="hist"></div>
<div class="sheet" id="sheet"><div>
  <label id="lUnit"></label><div class="seg" id="unit"><button data-u="kg">kg</button><button data-u="lb">lb</button></div>
  <label id="lGoal"></label><input id="goal" type="number" inputmode="decimal" step="0.1">
  <label id="lHeight"></label><input id="height" type="number" inputmode="numeric">
  <p class="note" id="note"></p>
  <button class="done" id="close"></button>
</div></div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const loc = ES ? 'es-ES' : 'en-GB';
const T = ES ? { title:'Peso', log:'Anotar', ph:'Tu peso de hoy', trend:'Tendencia', since:'desde el principio', week:'esta semana', goal:'Objetivo', left:'Faltan', reached:'¡Objetivo conseguido! 🎉', start:'Inicio', history:'Historial', empty:'Anota tu primer peso para empezar.', bmi:'IMC', bmiCats:['Bajo peso','Normal','Sobrepeso','Obesidad'], noHeight:'Añade tu altura en ⚙️ para ver tu IMC.', unit:'Unidad', goalL:'Peso objetivo', height:'Altura (cm)', note:'La línea gruesa es la media de 7 días: el peso sube y baja cada día por el agua y la comida, la tendencia es lo que cuenta. El IMC es orientativo.', done:'Listo', del:'Borrar' }
 : { title:'Weight', log:'Log', ph:'Today\'s weight', trend:'Trend', since:'since you started', week:'this week', goal:'Goal', left:'To go', reached:'Goal reached! 🎉', start:'Start', history:'History', empty:'Log your first weight to get started.', bmi:'BMI', bmiCats:['Underweight','Healthy','Overweight','Obese'], noHeight:'Add your height in ⚙️ to see your BMI.', unit:'Unit', goalL:'Goal weight', height:'Height (cm)', note:'The thick line is the 7-day average: weight goes up and down every day with water and food, the trend is what matters. BMI is only a rough guide.', done:'Done', del:'Delete' };
const $ = id => document.getElementById(id);
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
// Weights are stored in kg; shown in the chosen unit.
let entries = [], cfg = { unit: 'kg', goal: null, height: null }, days = 90;
const toU = kg => cfg.unit === 'lb' ? kg * 2.20462 : kg, fromU = v => cfg.unit === 'lb' ? v / 2.20462 : v;
const f1 = v => (Math.round(v * 10) / 10).toLocaleString(loc, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const dayKey = t => new Date(t).toDateString();
['ttl', 'log', 'trendT', 'lUnit', 'lGoal', 'lHeight', 'note', 'close'].forEach((id, i) => $(id).textContent = [T.title, T.log, T.trend, T.unit, T.goalL, T.height, T.note, T.done][i]);
$('w').placeholder = T.ph;
$('range').innerHTML = [[30, '1M'], [90, '3M'], [365, '1A'], [9999, '∞']].map(([d, l]) => `<button data-d="${d}">${ES ? l : l.replace('1A', '1Y')}</button>`).join('');
$('range').querySelectorAll('button').forEach(b => b.onclick = () => { days = +b.dataset.d; render(); });
function smooth(list) { return list.map((e, i) => { const win = list.filter(x => x.t <= e.t && x.t > e.t - 7 * 864e5); return { t: e.t, kg: win.reduce((s, x) => s + x.kg, 0) / win.length }; }); }
function render() {
  $('range').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.d === days));
  const list = [...entries].sort((a, b) => a.t - b.t), u = cfg.unit;
  if (!list.length) { $('hero').innerHTML = `<div style="color:var(--muted);font-weight:700">${T.empty}</div>`; $('chart').innerHTML = ''; $('hist').innerHTML = ''; bmi(null); return; }
  const last = list[list.length - 1], first = list[0], weekAgo = list.filter(e => e.t <= last.t - 6 * 864e5).pop();
  const ch = last.kg - first.kg, wk = weekAgo ? last.kg - weekAgo.kg : null;
  const sign = v => (v > 0 ? '+' : v < 0 ? '−' : '±') + f1(Math.abs(toU(v)));
  let goalHtml = '';
  if (cfg.goal) {
    const total = first.kg - cfg.goal, done = first.kg - last.kg, p = total ? Math.max(0, Math.min(100, done / total * 100)) : 100, rem = Math.abs(last.kg - cfg.goal);
    goalHtml = `<div class="prog"><div class="t"><span>${T.start} ${f1(toU(first.kg))}</span><span>${rem < .05 || (total > 0 ? last.kg <= cfg.goal : last.kg >= cfg.goal) ? T.reached : `${T.left} ${f1(toU(rem))} ${u}`}</span><span>${T.goal} ${f1(toU(cfg.goal))}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`;
  }
  $('hero').innerHTML = `<div class="w">${f1(toU(last.kg))} <small>${u}</small></div><div><span class="ch ${ch < 0 ? 'down' : ch > 0 ? 'up' : ''}">${sign(ch)} ${u}</span> <span style="color:var(--muted);font-weight:600">${T.since}</span>${wk != null ? ` · <span class="ch ${wk < 0 ? 'down' : wk > 0 ? 'up' : ''}">${sign(wk)}</span> <span style="color:var(--muted);font-weight:600">${T.week}</span>` : ''}</div>${goalHtml}`;
  // Chart: daily points plus the 7-day average.
  const from = last.t - days * 864e5, pts = list.filter(e => e.t >= from), avg = smooth(list).filter(e => e.t >= from);
  const vals = [...pts.map(e => e.kg), ...(cfg.goal ? [cfg.goal] : [])], lo = Math.min(...vals) - .5, hi = Math.max(...vals) + .5, t0 = pts[0].t, t1 = Math.max(last.t, t0 + 864e5);
  const X = t => 6 + (t - t0) / (t1 - t0) * 328, Y = kg => 170 - (kg - lo) / (hi - lo) * 160;
  let svg = '';
  if (cfg.goal) svg += `<line x1="0" x2="340" y1="${Y(cfg.goal)}" y2="${Y(cfg.goal)}" stroke="#12b886" stroke-dasharray="5 5" stroke-width="1.5"/><text x="336" y="${Y(cfg.goal) - 5}" text-anchor="end" font-size="11" fill="#12b886" font-weight="700">${T.goal}</text>`;
  svg += pts.map(e => `<circle cx="${X(e.t)}" cy="${Y(e.kg)}" r="3" fill="#ffb4a3"/>`).join('');
  if (avg.length > 1) svg += `<path d="${avg.map((e, i) => `${i ? 'L' : 'M'}${X(e.t).toFixed(1)} ${Y(e.kg).toFixed(1)}`).join(' ')}" fill="none" stroke="#ff6b4a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  $('chart').innerHTML = svg;
  bmi(last.kg);
  $('hist').innerHTML = `<h3>${T.history}</h3>` + [...list].reverse().slice(0, 30).map(e => `<div class="row"><span>${new Date(e.t).toLocaleDateString(loc, { weekday: 'short', day: 'numeric', month: 'short' })}</span><span>${f1(toU(e.kg))} ${u}<button data-t="${e.t}">${T.del}</button></span></div>`).join('');
  $('hist').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { entries = entries.filter(e => e.t !== +b.dataset.t); store.set('entries', entries); render(); });
}
function bmi(kg) {
  if (!kg) { $('bmiCard').style.display = 'none'; return; } $('bmiCard').style.display = '';
  if (!cfg.height) { $('bmiCard').innerHTML = `<h3>${T.bmi}</h3><div style="color:var(--muted);font-weight:600">${T.noHeight}</div>`; return; }
  const v = kg / (cfg.height / 100) ** 2, cat = v < 18.5 ? 0 : v < 25 ? 1 : v < 30 ? 2 : 3, pos = Math.max(0, Math.min(100, (v - 15) / 20 * 100));
  $('bmiCard').innerHTML = `<h3>${T.bmi}</h3><div class="bmi"><div><b>${v.toFixed(1)}</b><small>${T.bmiCats[cat]}</small></div><div class="scale"><i style="left:${pos}%"></i></div></div>`;
}
$('log').onclick = () => {
  const v = parseFloat(String($('w').value).replace(',', '.')); if (!(v > 20 && v < 700)) { $('w').focus(); return; }
  const kg = fromU(v), now = Date.now();
  entries = entries.filter(e => dayKey(e.t) !== dayKey(now)); entries.push({ t: now, kg });
  store.set('entries', entries); $('w').value = ''; $('w').blur(); render();
  try { if (window.Acornix) Acornix.vibrate(20); } catch (e) {}
};
$('gear').onclick = () => { paintUnit(); $('goal').value = cfg.goal ? f1(toU(cfg.goal)).replace(',', '.') : ''; $('height').value = cfg.height || ''; $('sheet').classList.add('on'); };
function paintUnit() { $('unit').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.u === cfg.unit)); }
$('unit').querySelectorAll('button').forEach(b => b.onclick = () => { const g = parseFloat($('goal').value); cfg.unit = b.dataset.u; paintUnit(); if (cfg.goal) $('goal').value = f1(toU(cfg.goal)).replace(',', '.'); });
$('close').onclick = () => { const g = parseFloat(String($('goal').value).replace(',', '.')), h = parseFloat($('height').value); cfg.goal = g > 0 ? fromU(g) : null; cfg.height = h > 80 && h < 250 ? h : null; store.set('cfg', cfg); $('sheet').classList.remove('on'); render(); };
$('sheet').onclick = e => { if (e.target === $('sheet')) $('close').onclick(); };
(async () => { entries = await store.get('entries', []); cfg = Object.assign(cfg, await store.get('cfg', {})); render(); })();
</script>
</body>
</html>
