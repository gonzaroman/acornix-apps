<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fuel Cost</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f27; --muted:#7c8494; --a:#f76707; --line:#e4e7ec; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  h1 { margin:0 0 12px; font-size:26px; }
  .units { display:flex; gap:6px; background:#e9ecf1; padding:4px; border-radius:14px; margin-bottom:12px; } .units button { flex:1; padding:9px; border-radius:10px; font-weight:800; font-size:13px; color:var(--muted); background:none; } .units button.on { background:#fff; color:var(--ink); box-shadow:0 1px 4px #0001; }
  .card { background:var(--card); border-radius:22px; padding:14px 16px; box-shadow:0 2px 0 var(--line); margin-bottom:12px; }
  .f { display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; padding:10px 0; border-bottom:1px solid #f0f2f5; } .f:last-child { border:0; }
  .f label { font-weight:800; font-size:14px; } .f small { grid-column:1/-1; color:var(--muted); font-size:12px; font-weight:600; }
  .f .in { display:flex; align-items:center; gap:6px; } .f input { width:110px; text-align:right; font-size:22px; font-weight:900; border:0; border-bottom:2px solid var(--line); outline:none; background:none; color:var(--ink); font-variant-numeric:tabular-nums; } .f input:focus { border-color:var(--a); } .f span { color:var(--muted); font-weight:800; font-size:13px; min-width:48px; }
  .tog { display:flex; gap:8px; margin-top:4px; } .tog button { flex:1; padding:10px; border-radius:12px; background:#f1f3f6; font-weight:800; font-size:13px; } .tog button.on { background:var(--ink); color:#fff; }
  .res { background:linear-gradient(135deg,#f76707,#fd7e14); color:#fff; border-radius:24px; padding:18px; box-shadow:0 10px 30px #f7670744; }
  .res small { font-weight:800; opacity:.85; text-transform:uppercase; font-size:12px; letter-spacing:.5px; } .res .big { font-size:46px; font-weight:900; font-variant-numeric:tabular-nums; margin:2px 0 10px; }
  .res .g { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; } .res .g div { background:#ffffff26; border-radius:14px; padding:10px; } .res .g b { display:block; font-size:18px; font-variant-numeric:tabular-nums; } .res .g span { font-size:11px; font-weight:800; opacity:.9; }
  .ev { margin-top:12px; color:var(--muted); font-size:13px; font-weight:600; line-height:1.45; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⛽ <span id="ttl"></span></h1>
  <div class="units" id="units"></div>
  <div class="card" id="form"></div>
  <div class="res" id="res"></div>
  <div class="ev" id="ev"></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Coste de gasolina', metric:'km y litros', us:'Millas y galones', dist:'Distancia', distH:'Solo ida', cons:'Consumo', price:'Precio', people:'Personas', tolls:'Peajes y parking', round:['Solo ida', 'Ida y vuelta'], total:'Coste del viaje', each:'Por persona', fuel:'Combustible', per:'Por', km:'km', mi:'mi', evNote:(c, cur) => `Con un coche eléctrico (16 kWh/100 km a 0,25 ${cur}/kWh) costaría unos ${c}.`, cur:'€' }
 : { title:'Fuel Cost', metric:'km & litres', us:'Miles & gallons', dist:'Distance', distH:'One way', cons:'Consumption', price:'Price', people:'People', tolls:'Tolls & parking', round:['One way', 'Round trip'], total:'Trip cost', each:'Per person', fuel:'Fuel', per:'Per', km:'km', mi:'mi', evNote:(c, cur) => `In an electric car (16 kWh/100 km at ${cur}0.25/kWh) it would be about ${c}.`, cur:'$' };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
$('ttl').textContent = T.title;
let st = ES ? { us: false, dist: 300, cons: 6.5, price: 1.6, people: 2, tolls: 0, round: 1 } : { us: true, dist: 200, cons: 30, price: 3.5, people: 2, tolls: 0, round: 1 };
const save = () => store.set('fuel', st);
const money = v => (ES ? v.toLocaleString('es', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €' : '$' + v.toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
function form() {
  $('units').innerHTML = [T.metric, T.us].map((u, i) => `<button class="${(i === 1) === st.us ? 'on' : ''}" data-i="${i}">${u}</button>`).join('');
  $('units').querySelectorAll('button').forEach(b => b.onclick = () => { const us = b.dataset.i === '1'; if (us === st.us) return;
    // Convert the numbers so switching units keeps the same trip.
    if (us) { st.dist = Math.round(st.dist / 1.609); st.cons = Math.round(235.215 / st.cons * 10) / 10; st.price = Math.round(st.price * 3.785 * 100) / 100; } else { st.dist = Math.round(st.dist * 1.609); st.cons = Math.round(235.215 / st.cons * 10) / 10; st.price = Math.round(st.price / 3.785 * 100) / 100; }
    st.us = us; save(); form(); });
  const F = [['dist', T.dist, st.us ? 'mi' : 'km', T.distH], ['cons', T.cons, st.us ? 'mpg' : 'L/100km', ''], ['price', T.price, st.us ? '$/gal' : (ES ? '€/L' : '/L'), ''], ['tolls', T.tolls, T.cur, ''], ['people', T.people, '👤', '']];
  $('form').innerHTML = F.map(([k, l, u, h]) => `<div class="f"><label>${l}</label><div class="in"><input type="number" inputmode="decimal" data-k="${k}" value="${st[k]}"><span>${u}</span></div>${h ? `<small>${h}</small>` : ''}</div>`).join('') + `<div class="tog">${T.round.map((r, i) => `<button class="${i === st.round ? 'on' : ''}" data-r="${i}">${r}</button>`).join('')}</div>`;
  $('form').querySelectorAll('input').forEach(i => i.oninput = () => { st[i.dataset.k] = +i.value || 0; save(); calc(); });
  $('form').querySelectorAll('[data-r]').forEach(b => b.onclick = () => { st.round = +b.dataset.r; save(); form(); });
  calc();
}
function calc() {
  const d = st.dist * (st.round ? 2 : 1), fuel = st.us ? (st.cons ? d / st.cons : 0) : d * st.cons / 100, fuelCost = fuel * st.price, total = fuelCost + st.tolls, ppl = Math.max(1, st.people);
  const per100 = d ? fuelCost / d * (st.us ? 100 : 100) : 0;
  $('res').innerHTML = `<small>${T.total}</small><div class="big">${money(total)}</div><div class="g"><div><b>${money(total / ppl)}</b><span>${T.each}</span></div><div><b>${Math.round(fuel * 10) / 10} ${st.us ? 'gal' : 'L'}</b><span>${T.fuel}</span></div><div><b>${money(per100)}</b><span>${T.per} 100 ${st.us ? T.mi : T.km}</span></div></div>`;
  const km = st.us ? d * 1.609 : d; $('ev').textContent = '⚡ ' + T.evNote(money(km * .16 * .25 + st.tolls), T.cur);
}
(async () => { st = { ...st, ...(await store.get('fuel', {})) }; form(); })();
</script>
</body>
</html>
