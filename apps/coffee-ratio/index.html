<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coffee Ratio</title>
<style>
  :root { --bg:#1b1410; --card:#2a1f19; --ink:#f6ece2; --muted:#b39c88; --a:#d4a373; --line:#3d2e25; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  h1 { margin:0 0 14px; font-size:26px; }
  .methods { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .m { background:var(--card); border-radius:16px; padding:10px 4px; text-align:center; border:2px solid transparent; } .m span { font-size:26px; display:block; } .m b { font-size:12px; } .m.on { border-color:var(--a); background:#3a2a20; }
  .card { background:var(--card); border-radius:22px; padding:16px; margin-bottom:12px; }
  .nums { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; text-align:center; }
  .num input { width:100%; font-size:38px; font-weight:900; text-align:center; background:none; border:0; border-bottom:3px solid var(--line); color:var(--ink); outline:none; font-variant-numeric:tabular-nums; } .num input:focus { border-color:var(--a); }
  .num small { display:block; color:var(--muted); font-weight:800; font-size:12px; margin-top:4px; }
  .ratio { font-weight:900; color:var(--a); font-size:15px; }
  .sl { display:flex; align-items:center; gap:10px; margin-top:16px; font-weight:800; color:var(--muted); font-size:13px; } .sl input { flex:1; accent-color:var(--a); } .sl b { color:var(--ink); min-width:42px; }
  .facts { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; } .facts div { background:#3a2a20; border-radius:14px; padding:10px; text-align:center; } .facts b { display:block; font-size:15px; } .facts span { color:var(--muted); font-size:11px; font-weight:800; }
  .timer { text-align:center; } .timer .t { font-size:56px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-2px; } .timer .step { min-height:46px; font-weight:700; line-height:1.4; margin:4px 0 12px; color:#f0dcc8; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-bottom:14px; } .bar i { display:block; height:100%; background:var(--a); }
  .go { width:100%; padding:15px; border-radius:16px; background:var(--a); color:#1b1410; font-weight:900; font-size:16px; }
  .steps { margin:12px 0 0; padding:0; list-style:none; display:grid; gap:6px; text-align:left; } .steps li { padding:9px 12px; border-radius:12px; background:#3a2a20; font-size:14px; color:var(--muted); display:flex; gap:10px; } .steps li b { color:var(--a); min-width:44px; } .steps li.now { color:var(--ink); outline:2px solid var(--a); } .steps li.done { opacity:.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>☕ <span id="ttl"></span></h1>
  <div class="methods" id="methods"></div>
  <div class="card"><div class="nums"><div class="num"><input id="coffee" type="number" inputmode="decimal"><small id="lCoffee"></small></div><div class="ratio" id="ratioT"></div><div class="num"><input id="water" type="number" inputmode="decimal"><small id="lWater"></small></div></div>
    <div class="sl"><span id="lStrength"></span><input type="range" id="ratio" min="5" max="20" step=".5"><b id="ratioV"></b></div></div>
  <div class="card facts" id="facts"></div>
  <div class="card timer"><div class="t" id="t">0:00</div><div class="bar"><i id="bar" style="width:0"></i></div><div class="step" id="step"></div><button class="go" id="go"></button><ul class="steps" id="steps"></ul></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Ratio de café', coffee:'g de café', water:'ml de agua', strength:'Intensidad', start:'▶ Empezar', stop:'⏹ Parar', grind:'Molienda', temp:'Agua', time:'Tiempo', done:'¡Listo! Disfrútalo ☕', ready:'Pulsa empezar cuando tengas todo listo.' }
 : { title:'Coffee Ratio', coffee:'g coffee', water:'ml water', strength:'Strength', start:'▶ Start', stop:'⏹ Stop', grind:'Grind', temp:'Water', time:'Time', done:'Done! Enjoy ☕', ready:'Press start when everything is ready.' };
// name, emoji, default ratio, default coffee, grind, temperature, steps [seconds at which it starts, text with {w} for water so far]
const M = ES ? [
  ['V60', '🫖', 16, 15, 'Media-fina', '93 °C', [[0, 'Vierte {b} ml para el bloom y remueve suave'], [45, 'Vierte en espiral hasta {h} ml'], [75, 'Sigue hasta {w} ml'], [105, 'Deja que filtre'], [180, 'Fin']]],
  ['Prensa', '🧋', 15, 30, 'Gruesa', '95 °C', [[0, 'Vierte todo el agua: {w} ml'], [30, 'Remueve y tapa'], [240, 'Rompe la costra y retira la espuma'], [270, 'Baja el émbolo despacio'], [300, 'Fin']]],
  ['AeroPress', '🧪', 13, 17, 'Fina', '85 °C', [[0, 'Vierte {w} ml y remueve 10 s'], [10, 'Pon el émbolo y espera'], [90, 'Presiona suave 30 s'], [120, 'Fin']]],
  ['Moka', '🇮🇹', 10, 18, 'Fina', 'Caliente', [[0, 'Agua caliente hasta la válvula, café sin apretar'], [20, 'Fuego medio, tapa abierta'], [180, 'Cuando suene, apártala del fuego'], [240, 'Fin']]],
  ['Espresso', '⚡', 2, 18, 'Muy fina', '93 °C', [[0, 'Extrae hasta {w} g en la taza'], [28, 'Fin']]],
  ['Cold brew', '🧊', 8, 60, 'Muy gruesa', 'Fría', [[0, 'Mezcla {w} ml de agua fría con el café'], [30, 'Tapa y a la nevera 12-18 h'], [40, 'Fin']]] ]
 : [
  ['V60', '🫖', 16, 15, 'Medium-fine', '93 °C', [[0, 'Pour {b} ml to bloom, stir gently'], [45, 'Pour in spirals up to {h} ml'], [75, 'Keep pouring up to {w} ml'], [105, 'Let it draw down'], [180, 'Done']]],
  ['French press', '🧋', 15, 30, 'Coarse', '95 °C', [[0, 'Pour all the water: {w} ml'], [30, 'Stir and put the lid on'], [240, 'Break the crust, skim the foam'], [270, 'Press slowly'], [300, 'Done']]],
  ['AeroPress', '🧪', 13, 17, 'Fine', '85 °C', [[0, 'Pour {w} ml and stir 10 s'], [10, 'Insert the plunger and wait'], [90, 'Press gently for 30 s'], [120, 'Done']]],
  ['Moka pot', '🇮🇹', 10, 18, 'Fine', 'Hot', [[0, 'Hot water to the valve, coffee unpacked'], [20, 'Medium heat, lid open'], [180, 'When it gurgles, take it off the heat'], [240, 'Done']]],
  ['Espresso', '⚡', 2, 18, 'Very fine', '93 °C', [[0, 'Pull {w} g into the cup'], [28, 'Done']]],
  ['Cold brew', '🧊', 8, 60, 'Very coarse', 'Cold', [[0, 'Mix {w} ml cold water with the coffee'], [30, 'Cover and refrigerate 12-18 h'], [40, 'Done']]] ];
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
['ttl', 'lCoffee', 'lWater', 'lStrength', 'go'].forEach((id, i) => $(id).textContent = [T.title, T.coffee, T.water, T.strength, T.start][i]);
let m = 0, coffee = 15, ratio = 16, run = null, t0 = 0;
const save = () => store.set('brew', { m, coffee, ratio });
const r1 = x => Math.round(x * 10) / 10;
function methods() { $('methods').innerHTML = M.map((x, i) => `<button class="m ${i === m ? 'on' : ''}" data-i="${i}"><span>${x[1]}</span><b>${x[0]}</b></button>`).join(''); $('methods').querySelectorAll('.m').forEach(b => b.onclick = () => { m = +b.dataset.i; ratio = M[m][2]; coffee = M[m][3]; stop(); all(); save(); }); }
function fill(s) { const w = Math.round(coffee * ratio); return s.replace('{w}', w).replace('{b}', Math.round(coffee * 2)).replace('{h}', Math.round(w * .6)); }
function all() {
  methods(); $('coffee').value = r1(coffee); $('water').value = Math.round(coffee * ratio); $('ratio').value = ratio; $('ratioV').textContent = `1:${ratio}`; $('ratioT').textContent = `1 : ${ratio}`;
  const x = M[m], end = x[6][x[6].length - 1][0];
  $('facts').innerHTML = `<div><b>${x[4]}</b><span>${T.grind}</span></div><div><b>${x[5]}</b><span>${T.temp}</span></div><div><b>${Math.floor(end / 60)}:${String(end % 60).padStart(2, '0')}</b><span>${T.time}</span></div>`;
  steps(-1);
}
function steps(cur) { const S = M[m][6]; $('steps').innerHTML = S.slice(0, -1).map((s, i) => `<li class="${i === cur ? 'now' : i < cur ? 'done' : ''}"><b>${Math.floor(s[0] / 60)}:${String(s[0] % 60).padStart(2, '0')}</b>${fill(s[1])}</li>`).join(''); if (cur < 0) { $('step').textContent = T.ready; $('t').textContent = '0:00'; $('bar').style.width = 0; } }
$('coffee').oninput = () => { coffee = +$('coffee').value || 0; $('water').value = Math.round(coffee * ratio); steps(-1); save(); };
$('water').oninput = () => { coffee = (+$('water').value || 0) / ratio; $('coffee').value = r1(coffee); steps(-1); save(); };
$('ratio').oninput = () => { ratio = +$('ratio').value; $('water').value = Math.round(coffee * ratio); $('ratioV').textContent = `1:${ratio}`; $('ratioT').textContent = `1 : ${ratio}`; steps(-1); save(); };
let lastStep = -1;
function stop() { clearInterval(run); run = null; $('go').textContent = T.start; lastStep = -1; }
$('go').onclick = () => {
  if (run) { stop(); steps(-1); return; }
  t0 = Date.now(); $('go').textContent = T.stop; const S = M[m][6], end = S[S.length - 1][0];
  const tick = () => {
    const s = (Date.now() - t0) / 1000, i = S.findIndex((x, k) => k === S.length - 1 || S[k + 1][0] > s);
    $('t').textContent = `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; $('bar').style.width = Math.min(100, s / end * 100) + '%';
    if (i !== lastStep) { lastStep = i; steps(i); $('step').textContent = i === S.length - 1 ? T.done : fill(S[i][1]); try { window.Acornix && Acornix.vibrate(i === S.length - 1 ? [200, 100, 200] : 60); } catch (e) {} }
    if (s >= end) { clearInterval(run); run = null; $('go').textContent = T.start; }
  };
  tick(); run = setInterval(tick, 250);
};
(async () => { const s = await store.get('brew', null); if (s && M[s.m] && s.coffee > 0 && s.ratio > 0) ({ m, coffee, ratio } = s); all(); })();
</script>
</body>
</html>
