<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stock Counter</title>
<style>
  :root { --bg:#f7f5f0; --card:#fff; --ink:#262019; --muted:#8c8274; --line:#ebe5da; --a:#b45309; --low:#dc2626; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, input { font:inherit; color:inherit; border:0; }
  button { cursor:pointer; background:none; }
  #app { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  header { display:flex; align-items:center; gap:10px; }
  header h1 { margin:0; font-size:26px; flex:1; }
  .alert { margin:10px 0; padding:10px 12px; border-radius:14px; background:#fee2e2; color:#991b1b; font-weight:700; font-size:14px; display:none; }
  .search { width:100%; padding:12px 14px; border-radius:14px; background:var(--card); outline:none; margin:10px 0; }
  .item { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:16px; padding:10px 12px; margin-bottom:8px; }
  .item .e { font-size:26px; width:40px; text-align:center; }
  .item .t { flex:1; min-width:0; } .item .t b { display:block; word-break:break-word; } .item .t small { color:var(--muted); }
  .item.low { box-shadow:inset 4px 0 0 var(--low); } .item.low .t small { color:var(--low); font-weight:700; }
  .cnt { display:flex; align-items:center; gap:6px; }
  .cnt button { width:40px; height:40px; border-radius:12px; background:var(--bg); font-size:22px; font-weight:800; }
  .cnt b { min-width:40px; text-align:center; font-size:20px; font-variant-numeric:tabular-nums; }
  .del { color:var(--muted); font-size:13px; padding:4px; }
  .addf { background:var(--card); border-radius:16px; padding:12px; margin-top:12px; display:grid; grid-template-columns:44px 1fr 70px 70px; gap:6px; }
  .addf input { padding:10px; border-radius:10px; background:var(--bg); outline:none; min-width:0; }
  .addf input.emo { text-align:center; font-size:20px; padding:6px; }
  .addf button { grid-column:1/-1; padding:12px; border-radius:12px; background:var(--a); color:#fff; font-weight:900; }
  .addf small { grid-column:1/-1; color:var(--muted); font-size:12px; }
  .share { padding:9px 12px; border-radius:12px; background:var(--card); font-weight:800; font-size:13px; }
</style>
</head>
<body>
<div id="app">
  <header><h1>📦 <span id="ttl"></span></h1><button class="share" id="share"></button></header>
  <div class="alert" id="alert"></div>
  <input class="search" id="search">
  <div id="list"></div>
  <form class="addf" id="addf"><input class="emo" id="emo" maxlength="2" value="📦"><input id="name" maxlength="40" required><input id="qty" inputmode="numeric"><input id="min" inputmode="numeric"><small id="help"></small><button id="addBtn"></button></form>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Inventario', search:'Buscar…', name:'Producto', qty:'Cant.', min:'Mín.', help:'Mín. = avisarme cuando queden menos de esta cantidad', add:'＋ Añadir producto', low:n => `⚠️ ${n} producto${n > 1 ? 's' : ''} con poco stock`, lowOne:'¡quedan pocos!', minL:'mín.', share:'📤 Pedido', order:'Lista para reponer',
  samples:[['☕','Café en grano (kg)',4,5],['🥛','Leche (litros)',18,10],['🧁','Magdalenas',30,12],['🥤','Vasos para llevar',120,50],['🧻','Servilletas (paquetes)',3,4]] }
 : { title:'Stock', search:'Search…', name:'Product', qty:'Qty', min:'Min', help:'Min = warn me when there are fewer than this', add:'＋ Add product', low:n => `⚠️ ${n} product${n > 1 ? 's' : ''} running low`, lowOne:'running low!', minL:'min', share:'📤 Order', order:'To restock',
  samples:[['☕','Coffee beans (kg)',4,5],['🥛','Milk (litres)',18,10],['🧁','Muffins',30,12],['🥤','Takeaway cups',120,50],['🧻','Napkins (packs)',3,4]] };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
$('ttl').textContent = T.title; $('search').placeholder = T.search; $('name').placeholder = T.name; $('qty').placeholder = T.qty; $('min').placeholder = T.min; $('help').textContent = T.help; $('addBtn').textContent = T.add; $('share').textContent = T.share;
let items = [], saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(() => store.set('stock', items), 300); }
function render() {
  const q = $('search').value.trim().toLowerCase(), low = items.filter(i => i.q < i.min);
  $('alert').textContent = T.low(low.length); $('alert').style.display = low.length ? 'block' : 'none';
  $('list').innerHTML = '';
  items.filter(i => !q || i.n.toLowerCase().includes(q)).sort((a, b) => (b.q < b.min) - (a.q < a.min) || a.n.localeCompare(b.n)).forEach(i => {
    const el = document.createElement('div'); el.className = 'item' + (i.q < i.min ? ' low' : '');
    el.innerHTML = `<span class="e">${i.e}</span><div class="t"><b></b><small>${i.q < i.min ? T.lowOne : T.minL + ' ' + i.min}</small></div><div class="cnt"><button class="m">−</button><b>${i.q}</b><button class="p">+</button></div><button class="del">✕</button>`;
    el.querySelector('.t b').textContent = i.n;
    let hold;
    const change = d => { i.q = Math.max(0, i.q + d); save(); el.querySelector('.cnt b').textContent = i.q; const wasLow = el.classList.contains('low'); el.classList.toggle('low', i.q < i.min); if (!wasLow && i.q < i.min) try { if (window.Acornix) Acornix.vibrate([40, 40, 40]); } catch (e) {} };
    [['.m', -1], ['.p', 1]].forEach(([s, d]) => { const b = el.querySelector(s); b.onpointerdown = () => { change(d); hold = setTimeout(function r() { change(d * 5); hold = setTimeout(r, 160); }, 500); }; b.onpointerup = b.onpointerleave = () => { clearTimeout(hold); render(); }; });
    el.querySelector('.del').onclick = () => { items = items.filter(x => x !== i); save(); render(); };
    $('list').appendChild(el);
  });
}
$('search').oninput = render;
$('addf').onsubmit = e => { e.preventDefault(); const n = $('name').value.trim(); if (!n) return; items.push({ e: $('emo').value || '📦', n, q: parseInt($('qty').value) || 0, min: parseInt($('min').value) || 0 }); $('name').value = ''; $('qty').value = ''; $('min').value = ''; save(); render(); };
$('share').onclick = async () => { const low = items.filter(i => i.q < i.min); const text = `📦 ${T.order}:\n` + (low.length ? low.map(i => `• ${i.n}: ${i.q} → ${i.min * 2}`).join('\n') : '✓'); try { if (window.Acornix) await Acornix.share(text); else if (navigator.share) await navigator.share({ text }); else await navigator.clipboard.writeText(text); } catch (e) {} };
(async () => { items = await store.get('stock', null); if (!items) { items = T.samples.map(([e, n, q, min]) => ({ e, n, q, min })); store.set('stock', items); } render(); })();
</script>
</body>
</html>
