<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loan Calculator</title>
<style>
  :root { --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --p:#2563eb; --i:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  input, button, select { font:inherit; color:inherit; border:0; }
  #app { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { margin:0 0 12px; font-size:26px; }
  .card { background:var(--card); border-radius:20px; padding:16px; margin-bottom:12px; }
  .field { margin-bottom:14px; }
  .field .lbl { display:flex; justify-content:space-between; align-items:baseline; font-weight:700; color:var(--muted); font-size:14px; }
  .field .lbl input { width:130px; text-align:right; font-size:20px; font-weight:800; color:var(--ink); background:var(--bg); border-radius:10px; padding:6px 10px; outline:none; }
  .field input[type=range] { width:100%; accent-color:var(--p); margin-top:8px; }
  .tabs { display:flex; background:var(--bg); border-radius:12px; padding:3px; margin-bottom:14px; }
  .tabs button { flex:1; padding:9px; border-radius:10px; font-weight:800; font-size:14px; cursor:pointer; background:none; }
  .tabs button.on { background:var(--card); box-shadow:0 1px 3px #0001; }
  .result { text-align:center; padding:6px 0 10px; }
  .result small { color:var(--muted); font-weight:700; }
  .result .big { font-size:42px; font-weight:900; color:var(--p); font-variant-numeric:tabular-nums; }
  .split { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
  .split div { background:var(--bg); border-radius:14px; padding:10px 4px; }
  .split small { display:block; font-size:11px; color:var(--muted); font-weight:700; }
  .split b { font-variant-numeric:tabular-nums; font-size:15px; }
  .stack { display:flex; height:14px; border-radius:7px; overflow:hidden; margin-top:12px; }
  .legend { display:flex; gap:14px; justify-content:center; margin-top:8px; font-size:12px; color:var(--muted); font-weight:700; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  canvas { width:100%; height:160px; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th { text-align:right; color:var(--muted); font-size:11px; text-transform:uppercase; padding:6px 4px; }
  th:first-child, td:first-child { text-align:left; }
  td { text-align:right; padding:7px 4px; border-top:1px solid var(--line); }
  .cur { display:flex; justify-content:flex-end; gap:6px; align-items:center; color:var(--muted); font-size:13px; }
  .cur select { background:var(--card); padding:6px; border-radius:10px; }
</style>
</head>
<body>
<div id="app">
  <h1>🏦 <span id="ttl"></span></h1>
  <div class="card">
    <div class="tabs" id="tabs"></div>
    <div class="field"><div class="lbl"><span id="lAmt"></span><input id="amt" inputmode="decimal"></div><input type="range" id="amtR" min="1000" max="600000" step="1000"></div>
    <div class="field"><div class="lbl"><span id="lRate"></span><input id="rate" inputmode="decimal"></div><input type="range" id="rateR" min="0" max="15" step="0.05"></div>
    <div class="field"><div class="lbl"><span id="lYears"></span><input id="years" inputmode="numeric"></div><input type="range" id="yearsR" min="1" max="40" step="1"></div>
  </div>
  <div class="card"><div class="result"><small id="lPay"></small><div class="big" id="pay"></div></div>
    <div class="split"><div><small id="lPrin"></small><b id="prin"></b></div><div><small id="lInt"></small><b id="int"></b></div><div><small id="lTot"></small><b id="tot"></b></div></div>
    <div class="stack"><div id="sp" style="background:var(--p)"></div><div id="si" style="background:var(--i);flex:1"></div></div>
    <div class="legend"><span><i style="background:var(--p)"></i><span id="lgP"></span></span><span><i style="background:var(--i)"></i><span id="lgI"></span></span></div></div>
  <div class="card"><canvas id="chart"></canvas></div>
  <div class="card"><table><thead><tr><th id="hY"></th><th id="hP"></th><th id="hI"></th><th id="hB"></th></tr></thead><tbody id="tbody"></tbody></table></div>
  <div class="cur"><span id="lCur"></span><select id="cur"></select></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Calculadora de préstamos', tabs:['🏠 Hipoteca','🚗 Coche','💳 Personal'], amt:'Importe', rate:'Interés anual (%)', years:'Plazo (años)', pay:'Cuota mensual', prin:'Capital', int:'Intereses', tot:'Total a pagar', y:'Año', paid:'Capital', interest:'Intereses', bal:'Pendiente', cur:'Moneda' }
 : { title:'Loan Calculator', tabs:['🏠 Mortgage','🚗 Car','💳 Personal'], amt:'Amount', rate:'Annual interest (%)', years:'Term (years)', pay:'Monthly payment', prin:'Principal', int:'Interest', tot:'Total cost', y:'Year', paid:'Principal', interest:'Interest', bal:'Balance', cur:'Currency' };
const PRESETS = [[180000, 3.2, 25], [22000, 6.9, 6], [8000, 8.5, 4]];
const $ = id => document.getElementById(id);
const st = (() => { try { return JSON.parse(localStorage.getItem('loan')) || null; } catch (e) { return null; } })() || { tab: 0, v: PRESETS[0], cur: ES ? 'EUR' : 'USD' };
[['ttl', 'title'], ['lAmt', 'amt'], ['lRate', 'rate'], ['lYears', 'years'], ['lPay', 'pay'], ['lPrin', 'prin'], ['lInt', 'int'], ['lTot', 'tot'], ['lgP', 'prin'], ['lgI', 'int'], ['hY', 'y'], ['hP', 'paid'], ['hI', 'interest'], ['hB', 'bal'], ['lCur', 'cur']].forEach(([id, k]) => $(id).textContent = T[k]);
$('cur').innerHTML = ['EUR', 'USD', 'GBP', 'MXN', 'ARS', 'COP', 'CLP', 'BRL', 'CHF'].map(c => `<option>${c}</option>`).join(''); $('cur').value = st.cur;
const money = (v, d = 0) => new Intl.NumberFormat(undefined, { style: 'currency', currency: st.cur, maximumFractionDigits: d }).format(v);
T.tabs.forEach((t, i) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { st.tab = i; st.v = PRESETS[i].slice(); sync(); }; $('tabs').appendChild(b); });
const pairs = [['amt', 'amtR', 0], ['rate', 'rateR', 1], ['years', 'yearsR', 2]];
pairs.forEach(([a, r, i]) => {
  $(a).oninput = () => { const v = parseFloat($(a).value.replace(/[^\d.,]/g, '').replace(',', '.')); if (!isNaN(v)) { st.v[i] = v; $(r).value = v; calc(); } };
  $(r).oninput = () => { st.v[i] = +$(r).value; $(a).value = st.v[i]; calc(); };
});
$('cur').onchange = () => { st.cur = $('cur').value; calc(); };
function sync() { document.querySelectorAll('.tabs button').forEach((b, i) => b.classList.toggle('on', i === st.tab)); pairs.forEach(([a, r, i]) => { $(a).value = st.v[i]; $(r).value = st.v[i]; }); calc(); }
function calc() {
  const [P, rate, years] = st.v, n = Math.max(1, Math.round(years * 12)), r = rate / 100 / 12;
  const pay = r ? P * r / (1 - Math.pow(1 + r, -n)) : P / n, total = pay * n, interest = total - P;
  $('pay').textContent = money(pay, 2); $('prin').textContent = money(P); $('int').textContent = money(interest); $('tot').textContent = money(total);
  $('sp').style.flex = P / total; $('si').style.flex = interest / total;
  // Yearly amortisation.
  let bal = P; const rows = [], bals = [P];
  for (let y = 1; y <= Math.ceil(n / 12); y++) { let pp = 0, ii = 0; for (let m = 0; m < 12 && bal > .005; m++) { const i = bal * r, p = Math.min(bal, pay - i); ii += i; pp += p; bal -= p; } rows.push([y, pp, ii, Math.max(0, bal)]); bals.push(Math.max(0, bal)); }
  $('tbody').innerHTML = rows.map(([y, p, i, b]) => `<tr><td>${y}</td><td>${money(p)}</td><td>${money(i)}</td><td>${money(b)}</td></tr>`).join('');
  const c = $('chart'), d = devicePixelRatio || 1; c.width = c.clientWidth * d; c.height = c.clientHeight * d; const g = c.getContext('2d'), w = c.width, h = c.height;
  g.clearRect(0, 0, w, h);
  const bw = w / rows.length; rows.forEach(([y, p, i], k) => { const max = pay * 12, hp = p / max * (h - 10), hi = i / max * (h - 10); g.fillStyle = '#2563eb'; g.fillRect(k * bw + 1, h - hp, bw - 2, hp); g.fillStyle = '#f59e0b'; g.fillRect(k * bw + 1, h - hp - hi, bw - 2, hi); });
  try { localStorage.setItem('loan', JSON.stringify(st)); } catch (e) {}
}
addEventListener('resize', calc);
sync();
</script>
</body>
</html>
