<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Stop Motion</title>
<style>
  :root { --bg:#171310; --card:#2a231d; --ink:#fbf3e8; --muted:#a8998a; --a:#ff7a3d; --r:#ff3b3b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { position:fixed; inset:0; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px); gap:10px; }
  .top { display:flex; align-items:center; gap:8px; }
  .top h1 { margin:0; font-size:21px; flex:1; }
  .pill { padding:9px 13px; border-radius:12px; background:var(--card); font-weight:800; font-size:14px; }
  .pill.main { background:var(--a); color:#2a1205; }
  .pill:disabled { opacity:.4; }
  .cam { position:relative; width:100%; aspect-ratio:4/3; border-radius:16px; overflow:hidden; background:#000; flex:none; }
  .cam video, .cam canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cam #onion { opacity:.35; pointer-events:none; }
  .badge { position:absolute; top:10px; left:10px; padding:4px 10px; border-radius:10px; background:#000a; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; }
  .msg { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:24px; color:var(--muted); font-weight:700; line-height:1.5; background:#000; }
  .film { display:flex; gap:6px; overflow-x:auto; padding:6px; background:#0d0b09; border-radius:10px; min-height:66px; scrollbar-width:none; border-top:4px dotted #3a3029; border-bottom:4px dotted #3a3029; }
  .film::-webkit-scrollbar { display:none; }
  .film img { flex:none; height:54px; aspect-ratio:4/3; object-fit:cover; border-radius:4px; }
  .film img.cur { outline:3px solid var(--a); }
  .film .none { color:var(--muted); font-size:13px; font-weight:700; margin:auto; }
  .ctl { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:800; color:var(--muted); }
  .ctl input { flex:1; accent-color:var(--a); }
  .ctl b { color:var(--ink); min-width:48px; }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto; }
  .snap { width:78px; height:78px; border-radius:50%; background:var(--r); border:6px solid #fff; box-shadow:0 6px 24px #ff3b3b66; }
  .snap:active { transform:scale(.94); }
  .side { display:flex; flex-direction:column; gap:8px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🎬 <span id="ttl"></span></h1><button class="pill" id="flip">🔄</button><button class="pill main" id="export" disabled></button></div>
  <div class="cam"><video id="v" playsinline muted autoplay></video><canvas id="onion"></canvas><canvas id="play" hidden></canvas><div class="badge" id="badge"></div><div class="msg" id="msg"></div></div>
  <div class="film" id="film"></div>
  <div class="ctl"><span id="lFps"></span><input type="range" id="fps" min="2" max="15" value="8"><b id="fpsV"></b></div>
  <div class="ctl"><span id="lOnion"></span><input type="range" id="onionA" min="0" max="70" value="35"></div>
  <div class="bar"><div class="side"><button class="pill" id="undo" disabled>↩️</button><button class="pill" id="clear" disabled>🗑️</button></div><button class="snap" id="snap" aria-label="snap"></button><div class="side"><button class="pill" id="playB" disabled>▶️</button><button class="pill" id="dup" disabled>⧉</button></div></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Stop Motion', exp:'Guardar vídeo', fps:'Velocidad', onion:'Papel cebolla', frames:'fotogramas', empty:'Pon algo delante, haz una foto, muévelo un poquito y repite', start:'Permite el acceso a la cámara para empezar', denied:'No tengo acceso a la cámara. Dale permiso y vuelve a abrir la app.', saving:'Grabando el vídeo…', saved:'Vídeo guardado en esta app', clear:'Toca otra vez para borrar todo', noRec:'Este móvil no puede grabar el vídeo' }
 : { title:'Stop Motion', exp:'Save video', fps:'Speed', onion:'Onion skin', frames:'frames', empty:'Put something in front, snap, move it a little and repeat', start:'Allow camera access to start', denied:'No camera access. Grant permission and reopen the app.', saving:'Recording the video…', saved:'Video saved in this app', clear:'Tap again to delete everything', noRec:'This phone can\'t record the video' };
const $ = id => document.getElementById(id), v = $('v'), onion = $('onion'), play = $('play');
['ttl', 'export', 'lFps', 'lOnion'].forEach((id, i) => $(id).textContent = [T.title, T.exp, T.fps, T.onion][i]);
$('msg').textContent = T.start;
const W = 960, H = 720; onion.width = play.width = W; onion.height = play.height = H;
let frames = [], facing = 'environment', stream = null, playing = null, clearArm = 0;
async function start() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false }); v.srcObject = stream; $('msg').hidden = true; }
  catch (e) { $('msg').textContent = T.denied; $('msg').hidden = false; }
}
function grab() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const s = Math.min(v.videoWidth / W, v.videoHeight / H), sw = W * s, sh = H * s;
  g.drawImage(v, (v.videoWidth - sw) / 2, (v.videoHeight - sh) / 2, sw, sh, 0, 0, W, H); return c;
}
function ui() {
  const n = frames.length;
  $('badge').textContent = `${n} ${T.frames} · ${(n / +$('fps').value).toFixed(1)} s`;
  $('fpsV').textContent = $('fps').value + ' fps';
  ['undo', 'clear', 'dup'].forEach(id => $(id).disabled = !n); $('playB').disabled = n < 2; $('export').disabled = n < 2;
  const og = onion.getContext('2d'); og.clearRect(0, 0, W, H); if (n && !playing) og.drawImage(frames[n - 1].c, 0, 0);
  onion.style.opacity = +$('onionA').value / 100;
  $('film').innerHTML = n ? frames.map((f, i) => `<img src="${f.thumb}" class="${i === n - 1 ? 'cur' : ''}">`).join('') : `<span class="none">${T.empty}</span>`;
  $('film').scrollLeft = 1e6;
}
function add(c) { const t = document.createElement('canvas'); t.width = 120; t.height = 90; t.getContext('2d').drawImage(c, 0, 0, 120, 90); frames.push({ c, thumb: t.toDataURL('image/jpeg', .6) }); }
$('snap').onclick = () => { if (!stream || !v.videoWidth || playing) return; add(grab()); try { window.Acornix && Acornix.vibrate(12); } catch (e) {} ui(); };
$('undo').onclick = () => { frames.pop(); ui(); };
$('dup').onclick = () => { const f = frames[frames.length - 1]; if (f) { frames.push(f); ui(); } };
$('clear').onclick = () => { if (Date.now() - clearArm < 2500) { frames = []; clearArm = 0; stop(); ui(); } else { clearArm = Date.now(); try { Acornix.toast(T.clear); } catch (e) { $('badge').textContent = T.clear; } } };
$('fps').oninput = ui; $('onionA').oninput = ui;
$('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; start(); };
function stop() { clearInterval(playing); playing = null; play.hidden = true; $('playB').textContent = '▶️'; ui(); }
$('playB').onclick = () => {
  if (playing) return stop();
  let i = 0; const pg = play.getContext('2d'); play.hidden = false; $('playB').textContent = '⏹️';
  const tick = () => { pg.drawImage(frames[i % frames.length].c, 0, 0); i++; };
  tick(); playing = setInterval(tick, 1000 / +$('fps').value);
};
$('export').onclick = async () => {
  if (frames.length < 2) return;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  if (!c.captureStream || !window.MediaRecorder) { try { Acornix.toast(T.noRec); } catch (e) {} return; }
  $('export').disabled = true; $('export').textContent = T.saving;
  const fps = +$('fps').value, rec = new MediaRecorder(c.captureStream(30), { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm', videoBitsPerSecond: 4e6 }), parts = [];
  rec.ondataavailable = e => e.data.size && parts.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  g.drawImage(frames[0].c, 0, 0); rec.start();
  // Play the animation twice into the recording.
  for (let k = 0; k < frames.length * 2; k++) { g.drawImage(frames[k % frames.length].c, 0, 0); await new Promise(r => setTimeout(r, 1000 / fps)); }
  rec.stop(); await done;
  const blob = new Blob(parts, { type: 'video/webm' }), name = `stop-motion-${Date.now()}.webm`;
  const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  try { if (window.Acornix) { await Acornix.files.export(name, url); } else { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); } } catch (e) {}
  $('export').textContent = T.exp; ui();
};
ui(); start();
</script>
</body>
</html>
