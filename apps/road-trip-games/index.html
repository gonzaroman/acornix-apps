<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Road Trip Games</title>
<style>
  :root { --bg:#fff8e1; --card:#fff; --ink:#2d2a1e; --muted:#9a9071; --a:#f59f00; --b:#1c7ed6; --line:#f2e7c2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { margin:0 0 12px; font-size:24px; }
  .tabs { display:flex; gap:6px; background:#f6ecc8; padding:4px; border-radius:16px; margin-bottom:14px; } .tabs button { flex:1; padding:10px 2px; border-radius:12px; font-weight:800; font-size:13px; color:var(--muted); background:none; } .tabs button.on { background:#fff; color:var(--ink); box-shadow:0 1px 4px #0001; }
  .bingo { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .cell { aspect-ratio:1; background:var(--card); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--muted); padding:3px; text-align:center; line-height:1.1; box-shadow:0 2px 0 var(--line); position:relative; }
  .cell span { font-size:26px; margin-bottom:2px; } .cell.on { background:var(--a); color:#fff; transform:scale(.96); } .cell.on::after { content:'✓'; position:absolute; top:3px; right:6px; font-size:13px; }
  .cell.win { background:#2f9e44; }
  .bar { display:flex; gap:8px; margin-top:12px; } .bar button { flex:1; padding:13px; border-radius:14px; background:var(--ink); color:#fff; font-weight:900; } .bar button.alt { background:#fff; color:var(--ink); }
  .banner { text-align:center; font-size:26px; font-weight:900; color:#2f9e44; margin:10px 0 0; min-height:34px; }
  .letters { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; } .letters button { aspect-ratio:1; border-radius:12px; background:var(--card); font-size:22px; font-weight:900; box-shadow:0 2px 0 var(--line); } .letters button.done { background:var(--b); color:#fff; } .letters button.next { outline:3px solid var(--a); }
  .info { text-align:center; color:var(--muted); font-weight:700; margin:0 0 12px; line-height:1.45; }
  .spy { background:var(--card); border-radius:24px; padding:26px 18px; text-align:center; box-shadow:0 2px 0 var(--line); } .spy .e { font-size:76px; } .spy b { display:block; font-size:24px; margin-top:6px; } .spy p { color:var(--muted); font-weight:700; margin:6px 0 0; }
  .score { display:flex; gap:10px; margin-top:12px; } .team { flex:1; background:var(--card); border-radius:18px; padding:12px; text-align:center; box-shadow:0 2px 0 var(--line); } .team input { width:100%; border:0; text-align:center; font-weight:800; color:var(--muted); background:none; outline:none; font:inherit; } .team b { display:block; font-size:38px; } .team .r { display:flex; gap:6px; justify-content:center; } .team .r button { width:40px; height:36px; border-radius:10px; background:#f6ecc8; font-weight:900; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🚙 <span id="ttl"></span></h1>
  <div class="tabs" id="tabs"></div>
  <div id="pane"></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Juegos de coche', tabs:['🎯 Bingo', '🔤 Abecedario', '👀 Veo veo'], newCard:'🔄 Nuevo cartón', clear:'Borrar', bingo:'¡BINGO! 🎉', abcInfo:'Encontrad las letras en orden en carteles y matrículas. ¡Toca la letra cuando la veáis!', abcDone:'¡Abecedario completo! 🏆', reset:'Empezar de nuevo', spyInfo:'Quien lo vea primero, ¡punto para su equipo!', nextSpy:'🎲 Otra cosa', team:['Equipo 1', 'Equipo 2'],
  things:[['🐄', 'Vaca'], ['🚜', 'Tractor'], ['🚛', 'Camión'], ['🏍️', 'Moto'], ['🚌', 'Autobús'], ['🚲', 'Bici'], ['🐴', 'Caballo'], ['🐑', 'Oveja'], ['🌉', 'Puente'], ['⛪', 'Iglesia'], ['🏰', 'Castillo'], ['🌬️', 'Molino'], ['⛽', 'Gasolinera'], ['🚓', 'Policía'], ['🚑', 'Ambulancia'], ['🚧', 'Obras'], ['🛑', 'Stop'], ['🚦', 'Semáforo'], ['🔴', 'Coche rojo'], ['🟡', 'Coche amarillo'], ['🚐', 'Furgoneta'], ['🚂', 'Tren'], ['✈️', 'Avión'], ['🐕', 'Perro'], ['🌳', 'Árbol solo'], ['🏞️', 'Río'], ['⛰️', 'Montaña'], ['🚇', 'Túnel'], ['🐦', 'Pájaro'], ['🚗', 'Coche descapotable'], ['🧳', 'Baca con maletas'], ['🛻', 'Pickup']],
  spy:[['🔴', 'Algo rojo'], ['🔵', 'Algo azul'], ['🟢', 'Algo verde'], ['🔺', 'Una señal triangular'], ['🔢', 'Un número 7'], ['🐄', 'Un animal'], ['🏠', 'Una casa con tejado rojo'], ['☁️', 'Una nube con forma de algo'], ['🅿️', 'Un parking'], ['🍔', 'Un sitio para comer'], ['🚗', 'Un coche como el vuestro'], ['📏', 'Un cartel con km'], ['🌻', 'Flores'], ['🏳️', 'Una bandera'], ['🧍', 'Alguien saludando']] }
 : { title:'Road Trip Games', tabs:['🎯 Bingo', '🔤 Alphabet', '👀 I Spy'], newCard:'🔄 New card', clear:'Clear', bingo:'BINGO! 🎉', abcInfo:'Find the letters in order on signs and number plates. Tap the letter when you spot it!', abcDone:'Alphabet complete! 🏆', reset:'Start again', spyInfo:'Whoever spots it first scores for their team!', nextSpy:'🎲 Something else', team:['Team 1', 'Team 2'],
  things:[['🐄', 'Cow'], ['🚜', 'Tractor'], ['🚛', 'Lorry'], ['🏍️', 'Motorbike'], ['🚌', 'Bus'], ['🚲', 'Bike'], ['🐴', 'Horse'], ['🐑', 'Sheep'], ['🌉', 'Bridge'], ['⛪', 'Church'], ['🏰', 'Castle'], ['🌬️', 'Wind turbine'], ['⛽', 'Petrol station'], ['🚓', 'Police'], ['🚑', 'Ambulance'], ['🚧', 'Roadworks'], ['🛑', 'Stop sign'], ['🚦', 'Traffic light'], ['🔴', 'Red car'], ['🟡', 'Yellow car'], ['🚐', 'Van'], ['🚂', 'Train'], ['✈️', 'Plane'], ['🐕', 'Dog'], ['🌳', 'Lonely tree'], ['🏞️', 'River'], ['⛰️', 'Mountain'], ['🚇', 'Tunnel'], ['🐦', 'Bird'], ['🚗', 'Convertible'], ['🧳', 'Roof box'], ['🛻', 'Pickup']],
  spy:[['🔴', 'Something red'], ['🔵', 'Something blue'], ['🟢', 'Something green'], ['🔺', 'A triangle sign'], ['🔢', 'A number 7'], ['🐄', 'An animal'], ['🏠', 'A house with a red roof'], ['☁️', 'A cloud shaped like something'], ['🅿️', 'A car park'], ['🍔', 'A place to eat'], ['🚗', 'A car like yours'], ['📏', 'A distance sign'], ['🌻', 'Flowers'], ['🏳️', 'A flag'], ['🧍', 'Someone waving']] };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
$('ttl').textContent = T.title;
const ABC = (ES ? 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ' : 'ABCDEFGHIJKLMNOPQRSTUVWXYZ').split('');
let st = { tab: 0, card: [], on: [], abc: 0, spy: 0, score: [0, 0], names: T.team.slice() };
const save = () => store.set('road', st);
const buzz = p => { try { window.Acornix && Acornix.vibrate(p); } catch (e) {} };
function newCard() { const idx = T.things.map((_, i) => i).sort(() => Math.random() - .5).slice(0, 24); idx.splice(12, 0, -1); st.card = idx; st.on = [12]; save(); }
// Rows, columns and both diagonals.
const LINES = [...[0, 1, 2, 3, 4].map(r => [0, 1, 2, 3, 4].map(c => r * 5 + c)), ...[0, 1, 2, 3, 4].map(c => [0, 1, 2, 3, 4].map(r => r * 5 + c)), [0, 6, 12, 18, 24], [4, 8, 12, 16, 20]];
function render() {
  $('tabs').innerHTML = T.tabs.map((t, i) => `<button class="${i === st.tab ? 'on' : ''}" data-i="${i}">${t}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { st.tab = +b.dataset.i; save(); render(); });
  if (st.tab === 0) {
    if (st.card.length !== 25) newCard();
    const wins = LINES.filter(l => l.every(i => st.on.includes(i))), winCells = new Set(wins.flat());
    $('pane').innerHTML = `<div class="bingo">${st.card.map((t, i) => `<button class="cell ${st.on.includes(i) ? 'on' : ''} ${winCells.has(i) ? 'win' : ''}" data-i="${i}">${t < 0 ? '<span>⭐</span>FREE' : `<span>${T.things[t][0]}</span>${T.things[t][1]}`}</button>`).join('')}</div><div class="banner">${wins.length ? T.bingo : ''}</div><div class="bar"><button class="alt" id="clr">${T.clear}</button><button id="nc">${T.newCard}</button></div>`;
    $('pane').querySelectorAll('.cell').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (i === 12) return; const k = st.on.indexOf(i), before = LINES.filter(l => l.every(x => st.on.includes(x))).length; k >= 0 ? st.on.splice(k, 1) : st.on.push(i); save(); const after = LINES.filter(l => l.every(x => st.on.includes(x))).length; buzz(after > before ? [80, 60, 80, 60, 200] : 15); render(); });
    $('clr').onclick = () => { st.on = [12]; save(); render(); }; $('nc').onclick = () => { newCard(); render(); };
  } else if (st.tab === 1) {
    $('pane').innerHTML = `<p class="info">${st.abc >= ABC.length ? `<b style="color:#1c7ed6;font-size:22px">${T.abcDone}</b>` : T.abcInfo}</p><div class="letters">${ABC.map((l, i) => `<button class="${i < st.abc ? 'done' : i === st.abc ? 'next' : ''}" data-i="${i}">${l}</button>`).join('')}</div><div class="bar"><button class="alt" id="rs">${T.reset}</button></div>`;
    $('pane').querySelectorAll('.letters button').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (i === st.abc) { st.abc++; buzz(st.abc >= ABC.length ? [100, 50, 100, 50, 300] : 20); } else if (i === st.abc - 1) st.abc--; save(); render(); });
    $('rs').onclick = () => { st.abc = 0; save(); render(); };
  } else {
    const s = T.spy[st.spy % T.spy.length];
    $('pane').innerHTML = `<p class="info">${T.spyInfo}</p><div class="spy"><div class="e">${s[0]}</div><b>${s[1]}</b></div><div class="bar"><button id="ns">${T.nextSpy}</button></div><div class="score">${[0, 1].map(t => `<div class="team"><input value="${st.names[t].replace(/"/g, '')}" data-t="${t}" maxlength="14"><b>${st.score[t]}</b><div class="r"><button data-m="${t}">−</button><button data-p="${t}">＋</button></div></div>`).join('')}</div>`;
    $('ns').onclick = () => { st.spy = (st.spy + 1 + Math.floor(Math.random() * (T.spy.length - 1))) % T.spy.length; save(); render(); };
    $('pane').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { st.score[+b.dataset.p]++; save(); buzz(30); render(); });
    $('pane').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const t = +b.dataset.m; if (st.score[t] > 0) st.score[t]--; save(); render(); });
    $('pane').querySelectorAll('[data-t]').forEach(i => i.onchange = () => { st.names[+i.dataset.t] = i.value.trim() || T.team[+i.dataset.t]; save(); });
  }
}
(async () => { st = { ...st, ...(await store.get('road', {})) }; if (st.abc > ABC.length) st.abc = 0; render(); })();
</script>
</body>
</html>
