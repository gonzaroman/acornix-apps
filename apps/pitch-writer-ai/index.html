<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pitch Writer</title>
<style>
  :root { --bg:#0d0b14; --card:#1a1726; --line:#2c2840; --ink:#f1eeff; --muted:#9b94bf; --a:#f59e0b; --b:#ef4444; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, textarea, input { font:inherit; color:inherit; border:0; }
  button { cursor:pointer; background:none; }
  #app { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { margin:0; font-size:28px; }
  .sub { color:var(--muted); margin:4px 0 14px; line-height:1.4; }
  label { display:block; font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:12px 4px 6px; }
  textarea, input { width:100%; padding:13px; border-radius:16px; background:var(--card); border:1px solid var(--line); outline:none; }
  textarea { min-height:90px; resize:vertical; line-height:1.45; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:9px 13px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-weight:700; font-size:14px; }
  .chip.on { background:var(--a); color:#1a1000; border-color:var(--a); }
  .go { width:100%; margin-top:16px; padding:16px; border-radius:18px; background:linear-gradient(135deg,var(--a),var(--b)); color:#fff; font-weight:900; font-size:17px; }
  .go:disabled { opacity:.5; }
  .res { margin-top:16px; background:var(--card); border-radius:22px; padding:18px; border:1px solid var(--line); display:none; }
  .res.on { display:block; }
  .tag { font-size:22px; font-weight:900; font-style:italic; background:linear-gradient(90deg,#fde68a,#f59e0b,#ef4444); -webkit-background-clip:text; color:transparent; line-height:1.25; }
  .pitch { margin-top:12px; white-space:pre-wrap; line-height:1.6; font-size:16px; }
  .pts { margin:12px 0 0; padding-left:20px; color:#d9d4f5; line-height:1.6; }
  .meta { color:var(--muted); font-size:13px; font-weight:700; margin-top:10px; }
  .acts { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .acts button { flex:1; padding:12px 8px; border-radius:12px; background:#ffffff12; font-weight:800; font-size:14px; white-space:nowrap; }
  .err { color:#fca5a5; margin-top:10px; }
  #prompter { position:fixed; inset:0; background:#000; z-index:9; display:none; flex-direction:column; }
  #prompter.on { display:flex; }
  #prompter .bar { display:flex; justify-content:space-between; align-items:center; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; }
  #prompter .t { font-size:30px; font-weight:200; font-variant-numeric:tabular-nums; }
  #prompter .t.over { color:#f87171; }
  #prompter button { padding:10px 14px; border-radius:12px; background:#ffffff1f; font-weight:800; }
  #scroll { flex:1; overflow:hidden; position:relative; }
  #scroll div { position:absolute; left:0; right:0; padding:40vh 22px; font-size:34px; line-height:1.45; font-weight:600; text-align:center; }
  #scroll::before { content:''; position:absolute; left:0; right:0; top:38%; height:12%; background:#f59e0b14; border-top:1px solid #f59e0b55; border-bottom:1px solid #f59e0b55; z-index:2; pointer-events:none; }
</style>
</head>
<body>
<div id="app">
  <h1>🎤 <span id="ttl"></span></h1><p class="sub" id="sub"></p>
  <label id="lIdea"></label><textarea id="idea" maxlength="800"></textarea>
  <label id="lAud"></label><input id="aud" maxlength="80">
  <label id="lLen"></label><div class="chips" id="lens"></div>
  <label id="lStyle"></label><div class="chips" id="styles"></div>
  <button class="go" id="go"></button>
  <div class="err" id="err"></div>
  <div class="res" id="res"></div>
</div>
<div id="prompter"><div class="bar"><button id="pClose">✕</button><span class="t" id="pTime">0:00</span><button id="pPlay">▶</button></div><div id="scroll"><div id="pText"></div></div></div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Discurso de ascensor', sub:'Cuenta tu idea y tu IA la convierte en un pitch claro y memorable, listo para ensayar.', idea:'¿Qué haces o qué vendes?', ideaPh:'ej.: una app que conecta a abuelos con estudiantes que les ayudan con el móvil a cambio de una comida casera', aud:'¿Para quién?', audPh:'inversores, un cliente, un jurado, una entrevista…', len:'Duración', style:'Estilo', lens:[['30','30 s'],['60','1 min'],['120','2 min']], styles:['💼 Profesional','🔥 Inspirador','😄 Con humor','📖 Con historia'], go:'✨ Escribir pitch', writing:'Escribiendo…', words:'palabras', approx:'≈', copy:'📋 Copiar', copied:'✓', prompter:'🎬 Ensayar', listen:'🔊 Escuchar', again:'🔄 Otra versión', noAi:'Abre esta app en Acornix y conecta tu IA para escribir tu pitch.', failed:'No he podido escribirlo: ', lang:'Spanish', voice:'es-ES' }
 : { title:'Pitch Writer', sub:'Tell your idea and your AI turns it into a clear, memorable pitch you can rehearse.', idea:'What do you do or sell?', ideaPh:'e.g. an app that matches grandparents with students who help them with their phones in exchange for a home-cooked meal', aud:'Who is it for?', audPh:'investors, a client, a jury, a job interview…', len:'Length', style:'Style', lens:[['30','30 s'],['60','1 min'],['120','2 min']], styles:['💼 Professional','🔥 Inspiring','😄 Funny','📖 Story'], go:'✨ Write pitch', writing:'Writing…', words:'words', approx:'≈', copy:'📋 Copy', copied:'✓', prompter:'🎬 Rehearse', listen:'🔊 Listen', again:'🔄 Another version', noAi:'Open this app in Acornix and connect your AI to write your pitch.', failed:'I couldn\'t write it: ', lang:'English', voice:'en-GB' };
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const $ = id => document.getElementById(id);
[['ttl', 'title'], ['sub', 'sub'], ['lIdea', 'idea'], ['lAud', 'aud'], ['lLen', 'len'], ['lStyle', 'style'], ['go', 'go']].forEach(([i, k]) => $(i).textContent = T[k]);
$('idea').placeholder = T.ideaPh; $('aud').placeholder = T.audPh;
let len = 1, style = 0, last = store.get('pitch', null);
function chips(box, items, sel, on) { $(box).innerHTML = ''; items.forEach((t, i) => { const b = document.createElement('button'); b.className = 'chip' + (i === sel ? ' on' : ''); b.textContent = Array.isArray(t) ? t[1] : t; b.onclick = () => on(i); $(box).appendChild(b); }); }
function marks() { chips('lens', T.lens, len, i => { len = i; marks(); }); chips('styles', T.styles, style, i => { style = i; marks(); }); }
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
async function write(variant) {
  const idea = $('idea').value.trim(); if (!idea) return $('idea').focus();
  $('err').textContent = ''; if (!window.Acornix) { $('err').textContent = T.noAi; return; }
  $('go').disabled = true; $('go').textContent = T.writing;
  const secs = +T.lens[len][0];
  try {
    const r = await Acornix.askAI(`Write an elevator pitch. Idea: ${idea}\nAudience: ${$('aud').value.trim() || 'general'}\nLength: about ${secs} seconds spoken (${Math.round(secs * 2.4)} words)\nStyle: ${T.styles[style].replace(/^\S+\s/, '')}` + (variant && last ? `\nMake it clearly different from this one: ${last.pitch.slice(0, 400)}` : ''),
      { json: true, system: `You are a world-class pitch coach. Write in ${T.lang}. Hook in the first sentence, a concrete problem, the solution, why now or why you, and a clear ask at the end. Spoken, natural, no buzzwords. Reply only with JSON: {"tagline":"max 8 words","pitch":"the pitch, short paragraphs","points":["3 key points to remember"]}` });
    last = r; store.set('pitch', r); show(); try { Acornix.vibrate(20); } catch (e) {}
  } catch (e) { $('err').textContent = T.failed + (e && e.message || ''); }
  $('go').disabled = false; $('go').textContent = T.go;
}
function show() {
  if (!last) return; const words = last.pitch.trim().split(/\s+/).length;
  $('res').innerHTML = `<div class="tag">“${esc(last.tagline)}”</div><div class="pitch">${esc(last.pitch)}</div><ul class="pts">${(last.points || []).map(p => `<li>${esc(p)}</li>`).join('')}</ul><div class="meta">${words} ${T.words} · ${T.approx} ${Math.round(words / 2.4)} s</div>
    <div class="acts"><button id="rehearse">${T.prompter}</button><button id="listen">${T.listen}</button><button id="copy">${T.copy}</button><button id="again">${T.again}</button></div>`;
  $('res').classList.add('on');
  $('copy').onclick = async () => { try { await navigator.clipboard.writeText(last.tagline + '\n\n' + last.pitch); $('copy').textContent = T.copied; } catch (e) {} };
  $('listen').onclick = () => { try { if (window.Acornix) Acornix.speak(last.pitch, T.voice); else speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(last.pitch), { lang: T.voice })); } catch (e) {} };
  $('again').onclick = () => write(true);
  $('rehearse').onclick = openPrompter;
}
// Teleprompter: scrolls at speaking pace for the chosen length, with a timer.
let raf, t0, running = false, elapsed = 0;
function openPrompter() { $('pText').textContent = last.pitch; $('prompter').classList.add('on'); elapsed = 0; running = false; $('pPlay').textContent = '▶'; place(); }
function place() { const box = $('pText'), total = box.scrollHeight - $('scroll').clientHeight, dur = Math.max(20, last.pitch.split(/\s+/).length / 2.4) * 1000; box.style.transform = `translateY(${-Math.min(1, elapsed / dur) * total}px)`; const s = Math.floor(elapsed / 1000); $('pTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); $('pTime').classList.toggle('over', s > +T.lens[len][0]); }
function frame(t) { if (!running) return; elapsed += t - t0; t0 = t; place(); raf = requestAnimationFrame(frame); }
$('pPlay').onclick = () => { running = !running; $('pPlay').textContent = running ? '⏸' : '▶'; if (running) { t0 = performance.now(); raf = requestAnimationFrame(frame); } };
$('pClose').onclick = () => { running = false; cancelAnimationFrame(raf); $('prompter').classList.remove('on'); };
$('go').onclick = () => write(false);
marks(); show();
</script>
</body>
</html>
