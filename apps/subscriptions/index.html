<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Subscriptions</title>
<style>
  :root { --bg:#0f0f14; --card:#1a1a22; --line:#2a2a36; --ink:#f2f2f7; --muted:#8e8ea0; --a:#a78bfa; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, input, select { font:inherit; color:inherit; border:0; }
  button { cursor:pointer; background:none; }
  #app { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px); }
  h1 { margin:0 0 12px; font-size:26px; }
  .hero { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .hero div { background:var(--card); border-radius:18px; padding:12px; }
  .hero small { display:block; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .hero b { font-size:20px; font-variant-numeric:tabular-nums; }
  .hero .main { grid-column:1/-1; background:linear-gradient(135deg,#7c3aed,#db2777); }
  .hero .main b { font-size:34px; }
  .hero .main small { color:#f5e9ff; }
  h3 { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:18px 4px 8px; }
  .sub { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px; padding:12px; margin-bottom:8px; width:100%; text-align:left; }
  .logo { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-weight:900; font-size:18px; color:#fff; flex:none; }
  .sub .t { flex:1; min-width:0; } .sub .t b { display:block; } .sub .t small { color:var(--muted); }
  .sub .p { text-align:right; font-variant-numeric:tabular-nums; } .sub .p b { display:block; } .sub .p small { color:var(--muted); }
  .soon { color:#fbbf24 !important; font-weight:700; }
  .fab { position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom) + 18px); padding:16px 20px; border-radius:18px; background:var(--a); color:#1a0f33; font-weight:900; }
  #sheet { position:fixed; inset:0; background:#000a; display:none; align-items:flex-end; z-index:5; }
  #sheet.on { display:flex; }
  .form { width:100%; max-width:560px; margin:0 auto; background:var(--card); border-radius:24px 24px 0 0; padding:18px 16px calc(env(safe-area-inset-bottom) + 18px); display:flex; flex-direction:column; gap:10px; }
  .form input, .form select { padding:13px; border-radius:14px; background:#ffffff0d; outline:none; }
  .form select option { color:#000; }
  .quick { display:flex; gap:6px; flex-wrap:wrap; } .quick button { padding:7px 10px; border-radius:10px; background:#ffffff0d; font-size:13px; font-weight:700; }
  .two { display:flex; gap:8px; } .two > * { flex:1; min-width:0; }
  .row { display:flex; gap:10px; } .row button { flex:1; padding:14px; border-radius:14px; background:#ffffff14; font-weight:800; } .row .save { background:var(--a); color:#1a0f33; } .row .del { color:#f87171; }
  .tip { margin-top:14px; background:var(--card); border-radius:16px; padding:12px 14px; color:#d4d4e8; font-size:14px; line-height:1.45; }
</style>
</head>
<body>
<div id="app">
  <h1>🔁 <span id="ttl"></span></h1>
  <div class="hero"><div class="main"><small id="lMonth"></small><b id="month"></b></div><div><small id="lYear"></small><b id="year"></b></div><div><small id="lCount"></small><b id="count"></b></div><div><small id="lDay"></small><b id="day"></b></div></div>
  <h3 id="lList"></h3><div id="list"></div>
  <div class="tip" id="tip"></div>
</div>
<button class="fab" id="add"></button>
<div id="sheet"><form class="form" id="form"><div class="quick" id="quick"></div><input id="name" maxlength="30" required><div class="two"><input id="price" inputmode="decimal" required><select id="cycle"></select></div><div class="two"><input id="next" type="date" required><select id="cur"></select></div><div class="row"><button type="button" class="del" id="del"></button><button type="button" id="cancel"></button><button class="save" id="save"></button></div></form></div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Suscripciones', month:'Al mes', year:'Al año', count:'Activas', day:'Al día', list:'Próximos cobros', add:'＋ Añadir', name:'Nombre (Netflix, gimnasio…)', price:'Precio', cycles:[['1','Mensual'],['12','Anual'],['3','Trimestral'],['0.25','Semanal']], cancel:'Cancelar', save:'Guardar', del:'Borrar', today:'¡Hoy!', tomorrow:'Mañana', inDays:n => `en ${n} días`, tip:t => `💡 Si cancelas la más cara te ahorras ${t} al año.` }
 : { title:'Subscriptions', month:'Per month', year:'Per year', count:'Active', day:'Per day', list:'Upcoming payments', add:'＋ Add', name:'Name (Netflix, gym…)', price:'Price', cycles:[['1','Monthly'],['12','Yearly'],['3','Quarterly'],['0.25','Weekly']], cancel:'Cancel', save:'Save', del:'Delete', today:'Today!', tomorrow:'Tomorrow', inDays:n => `in ${n} days`, tip:t => `💡 Cancelling the most expensive one would save you ${t} a year.` };
const QUICK = [['Netflix', '#e50914'], ['Spotify', '#1db954'], ['YouTube', '#ff0000'], ['Disney+', '#113ccf'], ['iCloud', '#3693f3'], ['Gym', '#f59e0b'], ['Amazon', '#ff9900'], ['ChatGPT', '#10a37f']];
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
[['ttl', 'title'], ['lMonth', 'month'], ['lYear', 'year'], ['lCount', 'count'], ['lDay', 'day'], ['lList', 'list'], ['add', 'add'], ['cancel', 'cancel'], ['save', 'save'], ['del', 'del']].forEach(([i, k]) => $(i).textContent = T[k]);
$('name').placeholder = T.name; $('price').placeholder = T.price;
$('cycle').innerHTML = T.cycles.map(([v, n]) => `<option value="${v}">${n}</option>`).join('');
$('cur').innerHTML = ['EUR', 'USD', 'GBP', 'MXN', 'ARS', 'COP', 'CLP', 'BRL'].map(c => `<option>${c}</option>`).join('');
$('quick').innerHTML = QUICK.map(([n]) => `<button type="button">${n}</button>`).join(''); $('quick').querySelectorAll('button').forEach(b => b.onclick = () => { $('name').value = b.textContent; $('price').focus(); });
let subs = [], editing = null, cur = ES ? 'EUR' : 'USD';
const money = v => new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }).format(v);
const monthly = s => s.price / s.cycle;
function color(name) { const q = QUICK.find(([n]) => n.toLowerCase() === name.toLowerCase()); if (q) return q[1]; let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h},55%,45%)`; }
// Move each next-payment date forward past today, keeping its cycle.
function roll(s) { const d = new Date(s.next + 'T12:00'), t = new Date(); t.setHours(0, 0, 0, 0); while (d < t) { if (s.cycle < 1) d.setDate(d.getDate() + 7); else d.setMonth(d.getMonth() + s.cycle); } s.next = d.toISOString().slice(0, 10); }
function render() {
  subs.forEach(roll);
  const m = subs.reduce((a, s) => a + monthly(s), 0);
  $('month').textContent = money(m); $('year').textContent = money(m * 12); $('count').textContent = subs.length; $('day').textContent = money(m * 12 / 365);
  $('list').innerHTML = '';
  subs.slice().sort((a, b) => a.next.localeCompare(b.next)).forEach(s => {
    const days = Math.round((new Date(s.next + 'T12:00') - new Date().setHours(12, 0, 0, 0)) / 864e5);
    const b = document.createElement('button'); b.className = 'sub';
    b.innerHTML = `<span class="logo" style="background:${color(s.name)}">${s.name.trim()[0] ? s.name.trim()[0].toUpperCase() : '?'}</span><div class="t"><b></b><small class="${days <= 3 ? 'soon' : ''}">${days === 0 ? T.today : days === 1 ? T.tomorrow : T.inDays(days)} · ${new Date(s.next).toLocaleDateString([], { day: 'numeric', month: 'short' })}</small></div><div class="p"><b>${money(s.price)}</b><small>${T.cycles.find(c => +c[0] === s.cycle)[1]}</small></div>`;
    b.querySelector('b').textContent = s.name; b.onclick = () => openForm(s); $('list').appendChild(b);
  });
  const top = subs.slice().sort((a, b) => monthly(b) - monthly(a))[0];
  $('tip').textContent = top ? T.tip(money(monthly(top) * 12)) : ''; $('tip').style.display = top ? 'block' : 'none';
  store.set('subs', { subs, cur });
}
function openForm(s) {
  editing = s || null; $('form').reset(); $('cur').value = cur;
  if (s) { $('name').value = s.name; $('price').value = s.price; $('cycle').value = String(s.cycle); $('next').value = s.next; } else { const d = new Date(); d.setDate(d.getDate() + 7); $('next').value = d.toISOString().slice(0, 10); }
  $('del').style.display = s ? 'block' : 'none'; $('sheet').classList.add('on');
}
$('form').onsubmit = e => { e.preventDefault(); const price = parseFloat($('price').value.replace(',', '.')); if (!(price > 0)) return; cur = $('cur').value;
  const data = { name: $('name').value.trim(), price, cycle: +$('cycle').value, next: $('next').value };
  if (editing) Object.assign(editing, data); else subs.push(data); $('sheet').classList.remove('on'); render(); };
$('del').onclick = () => { subs = subs.filter(s => s !== editing); $('sheet').classList.remove('on'); render(); };
$('cancel').onclick = () => $('sheet').classList.remove('on');
$('sheet').onclick = e => { if (e.target.id === 'sheet') $('sheet').classList.remove('on'); };
$('add').onclick = () => openForm(null);
(async () => { const s = await store.get('subs', null); if (s) { subs = s.subs; cur = s.cur; } else { const d = n => { const x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); }; subs = [{ name: 'Netflix', price: 13.99, cycle: 1, next: d(4) }, { name: 'Spotify', price: 10.99, cycle: 1, next: d(12) }, { name: 'iCloud', price: 2.99, cycle: 1, next: d(1) }]; } render(); })();
</script>
</body>
</html>
