<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pixel Photo</title>
<style>
  :root { --bg:#0f1020; --card:#1c1e38; --ink:#eef0ff; --muted:#8a8fbf; --a:#7cf29c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Courier New",ui-monospace,monospace; }
  button, label.btn { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { position:fixed; inset:0; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px); gap:10px; }
  .top { display:flex; align-items:center; gap:8px; }
  .top h1 { margin:0; font-size:20px; flex:1; letter-spacing:1px; text-transform:uppercase; }
  .btn { padding:9px 12px; border-radius:4px; background:var(--card); font-weight:900; font-size:14px; display:inline-block; box-shadow:inset 0 -3px #0006; }
  .btn.main { background:var(--a); color:#0f1020; }
  input[type=file] { display:none; }
  .view { flex:1; min-height:0; display:grid; place-items:center; border-radius:6px; background:repeating-conic-gradient(#14152a 0 25%,#181a32 0 50%) 0 0/20px 20px; }
  .view canvas { max-width:100%; max-height:100%; image-rendering:pixelated; touch-action:none; }
  .empty { text-align:center; color:var(--muted); font-weight:700; padding:20px; line-height:1.6; }
  .empty .big { font-size:56px; }
  .pals { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  .pals::-webkit-scrollbar { display:none; }
  .pal { flex:none; padding:6px; border-radius:6px; background:var(--card); border:2px solid transparent; text-align:center; font-size:11px; font-weight:900; color:var(--muted); }
  .pal.on { border-color:var(--a); color:var(--ink); }
  .pal .sw { display:flex; height:14px; width:76px; margin-bottom:4px; border-radius:2px; overflow:hidden; }
  .pal .sw i { flex:1; }
  .ctl { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:900; color:var(--muted); }
  .ctl input[type=range] { flex:1; accent-color:var(--a); }
  .ctl b { color:var(--ink); min-width:30px; }
  .tog { padding:7px 11px; border-radius:4px; background:var(--card); font-size:13px; font-weight:900; color:var(--muted); }
  .tog.on { background:var(--a); color:#0f1020; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>👾 <span id="ttl"></span></h1><label class="btn"><input type="file" id="file" accept="image/*">🖼️</label><label class="btn"><input type="file" id="cam" accept="image/*" capture="environment">📸</label><button class="btn main" id="save"></button></div>
  <div class="view"><div class="empty" id="empty"><div class="big">🕹️</div></div><canvas id="out" hidden></canvas></div>
  <div class="pals" id="pals"></div>
  <div class="ctl"><span id="lPx"></span><input type="range" id="px" min="24" max="160" value="64"><b id="pxV"></b><button class="tog on" id="dith"></button></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Pixel Foto', save:'Guardar', empty:'Convierte cualquier foto en pixel art. Abre una 🖼️ o haz una 📸', px:'Píxeles', dith:'Tramado', saved:'Guardada en esta app', orig:'Original' }
 : { title:'Pixel Photo', save:'Save', empty:'Turn any photo into pixel art. Open one 🖼️ or take one 📸', px:'Pixels', dith:'Dither', saved:'Saved in this app', orig:'Original' };
const PALS = [
  [T.orig, null],
  ['Game Boy', ['#0f380f', '#306230', '#8bac0f', '#9bbc0f']],
  ['PICO-8', ['#000000', '#1d2b53', '#7e2553', '#008751', '#ab5236', '#5f574f', '#c2c3c7', '#fff1e8', '#ff004d', '#ffa300', '#ffec27', '#00e436', '#29adff', '#83769c', '#ff77a8', '#ffccaa']],
  ['NES', ['#000000', '#fcfcfc', '#bcbcbc', '#7c7c7c', '#a80020', '#f83800', '#fca044', '#f8b800', '#00a800', '#58d854', '#0058f8', '#3cbcfc', '#6844fc', '#d800cc', '#f878f8', '#ac7c00']],
  ['CGA', ['#000000', '#55ffff', '#ff55ff', '#ffffff']],
  ['1-bit', ['#000000', '#ffffff']],
  ['Sunset', ['#2d1b4e', '#5c2a6b', '#a63d6e', '#e0605e', '#f59d5e', '#fbd38a']],
  ['Ocean', ['#03113a', '#0b3d74', '#1f78a8', '#4cb3c9', '#a5e3e0', '#f2fbf7']],
].map(([n, c]) => [n, c && c.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]), c]);
const $ = id => document.getElementById(id), out = $('out');
['ttl', 'save', 'lPx', 'dith'].forEach((id, i) => $(id).textContent = [T.title, T.save, T.px, T.dith][i]);
$('empty').innerHTML += T.empty;
let img = null, pal = 1, dither = true;
// 4x4 Bayer matrix for ordered dithering.
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v / 16 - .5));
function nearest(p, r, g, b) { let best = 0, bd = 1e9; for (let i = 0; i < p.length; i++) { const c = p[i], d = (c[0] - r) ** 2 * .3 + (c[1] - g) ** 2 * .59 + (c[2] - b) ** 2 * .11; if (d < bd) { bd = d; best = i; } } return p[best]; }
function render() {
  if (!img) return;
  const cols = +$('px').value, rows = Math.max(1, Math.round(cols * img.height / img.width));
  $('pxV').textContent = cols;
  const small = document.createElement('canvas'); small.width = cols; small.height = rows;
  const sg = small.getContext('2d'); sg.imageSmoothingQuality = 'high'; sg.drawImage(img, 0, 0, cols, rows);
  const d = sg.getImageData(0, 0, cols, rows), a = d.data, P = PALS[pal][1];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = (y * cols + x) * 4, t = dither && P ? BAYER[(y % 4) * 4 + x % 4] * (P.length <= 4 ? 96 : 48) : 0;
    let r = a[i] + t, g = a[i + 1] + t, b = a[i + 2] + t;
    if (P) [r, g, b] = nearest(P, r, g, b); else { r = Math.round(r / 32) * 32; g = Math.round(g / 32) * 32; b = Math.round(b / 32) * 32; }
    a[i] = r; a[i + 1] = g; a[i + 2] = b; a[i + 3] = 255;
  }
  sg.putImageData(d, 0, 0);
  // Scale up with crisp pixels for both the preview and the saved file.
  const k = Math.max(1, Math.floor(1600 / Math.max(cols, rows)));
  out.width = cols * k; out.height = rows * k; const og = out.getContext('2d'); og.imageSmoothingEnabled = false; og.drawImage(small, 0, 0, out.width, out.height);
}
function pals() {
  $('pals').innerHTML = PALS.map(([n, , hex], i) => `<button class="pal ${i === pal ? 'on' : ''}" data-i="${i}"><div class="sw">${(hex || ['#e33', '#fb3', '#3c6', '#39f', '#a3f']).map(h => `<i style="background:${h}"></i>`).join('')}</div>${n}</button>`).join('');
  $('pals').querySelectorAll('.pal').forEach(b => b.onclick = () => { pal = +b.dataset.i; pals(); render(); });
}
function load(f) {
  if (!f) return; const im = new Image();
  im.onload = () => { const s = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); img = c; $('empty').hidden = true; out.hidden = false; render(); URL.revokeObjectURL(im.src); };
  im.src = URL.createObjectURL(f);
}
$('file').onchange = e => { load(e.target.files[0]); e.target.value = ''; };
$('cam').onchange = e => { load(e.target.files[0]); e.target.value = ''; };
$('px').oninput = render;
$('dith').onclick = () => { dither = !dither; $('dith').classList.toggle('on', dither); render(); };
$('save').onclick = async () => {
  if (!img) return; const url = out.toDataURL('image/png'), name = `pixel-${Date.now()}.png`;
  try { if (window.Acornix) { await Acornix.files.save(name, url); Acornix.toast(T.saved); } else { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); } } catch (e) {}
};
$('pxV').textContent = $('px').value; pals();
</script>
</body>
</html>
