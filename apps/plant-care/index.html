<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plant Care</title>
<style>
  :root { --bg:#f1f6ee; --card:#fff; --ink:#1f2d1c; --muted:#7c8b77; --a:#2f9e44; --w:#1c7ed6; --line:#e1eadc; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, label.btn { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 90px); }
  .top { display:flex; align-items:center; gap:10px; }
  h1 { margin:0; font-size:26px; flex:1; }
  .today { margin:6px 0 14px; color:var(--muted); font-weight:700; }
  .plant { display:flex; gap:12px; align-items:center; background:var(--card); border-radius:20px; padding:12px; margin-bottom:10px; box-shadow:0 2px 0 var(--line); }
  .plant .pic { width:58px; height:58px; border-radius:16px; background:#e6f2e1 center/cover; display:grid; place-items:center; font-size:30px; flex:none; }
  .plant .info { flex:1; min-width:0; }
  .plant b { display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .plant small { color:var(--muted); font-weight:600; font-size:13px; }
  .plant .due { font-weight:800; font-size:13px; margin-top:3px; }
  .due.late { color:#e03131; } .due.now { color:var(--w); } .due.ok { color:var(--a); }
  .meter { height:6px; border-radius:4px; background:#e6efe2; margin-top:6px; overflow:hidden; } .meter i { display:block; height:100%; border-radius:4px; background:var(--w); }
  .water { width:52px; height:52px; border-radius:16px; background:#e7f5ff; font-size:24px; flex:none; }
  .water.late { background:#fff0f0; animation:wig 1.2s infinite; }
  @keyframes wig { 0%,100% { transform:rotate(0); } 10% { transform:rotate(-8deg); } 20% { transform:rotate(8deg); } 30% { transform:rotate(0); } }
  .fab { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 18px); padding:15px 26px; border-radius:30px; background:var(--a); color:#fff; font-weight:900; font-size:16px; box-shadow:0 8px 24px #2f9e4455; }
  .empty { text-align:center; padding:50px 20px; color:var(--muted); font-weight:600; line-height:1.6; }
  .empty .big { font-size:64px; }
  .sheet { position:fixed; inset:0; background:#1f2d1c66; display:flex; align-items:flex-end; z-index:5; }
  .sheet .in { width:100%; max-height:90vh; overflow:auto; background:var(--bg); border-radius:24px 24px 0 0; padding:18px 16px calc(env(safe-area-inset-bottom) + 18px); }
  .sheet h3 { margin:0 0 12px; }
  .f { margin-bottom:12px; } .f label { display:block; font-size:12px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:0 0 6px 2px; }
  .f input { width:100%; padding:12px 14px; border-radius:14px; border:2px solid var(--line); background:#fff; font:inherit; outline:none; color:var(--ink); }
  .f input:focus { border-color:var(--a); }
  .emojis { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; } .emojis::-webkit-scrollbar { display:none; }
  .emojis button { flex:none; width:44px; height:44px; border-radius:12px; background:#fff; font-size:24px; border:2px solid var(--line); } .emojis button.on { border-color:var(--a); }
  .every { display:flex; align-items:center; gap:10px; font-weight:800; } .every input { flex:1; accent-color:var(--w); }
  .aibox { background:#fff; border-radius:16px; padding:12px; border:2px dashed #b2d8a8; margin-bottom:12px; }
  .aibox .btn { display:block; text-align:center; padding:12px; border-radius:12px; background:linear-gradient(135deg,#2f9e44,#1c7ed6); color:#fff; font-weight:900; }
  .aibox p { margin:8px 0 0; font-size:14px; line-height:1.45; } .aibox .err { color:#e03131; font-weight:700; }
  input[type=file] { display:none; }
  .acts { display:flex; gap:8px; margin-top:6px; } .acts button { flex:1; padding:14px; border-radius:16px; font-weight:900; } .acts .ok { background:var(--a); color:#fff; } .acts .del { background:#fff0f0; color:#e03131; flex:0 0 auto; padding:14px 18px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🪴 <span id="ttl"></span></h1></div>
  <div class="today" id="today"></div>
  <div id="list"></div>
</div>
<button class="fab" id="add"></button>
<div class="sheet" id="sheet" hidden><div class="in">
  <h3 id="sTitle"></h3>
  <div class="aibox"><label class="btn"><input type="file" id="photo" accept="image/*" capture="environment">📸 <span id="lAi"></span></label><div id="aiOut"></div></div>
  <div class="f"><label id="lName"></label><input id="name" maxlength="40"></div>
  <div class="f"><label id="lEmoji"></label><div class="emojis" id="emojis"></div></div>
  <div class="f"><label id="lEvery"></label><div class="every"><input type="range" id="every" min="1" max="30" value="7"><span id="everyV"></span></div></div>
  <div class="f"><label id="lSpot"></label><input id="spot" maxlength="60"></div>
  <div class="acts"><button class="del" id="del">🗑️</button><button class="ok" id="ok"></button></div>
</div></div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Mis plantas', add:'＋ Añadir planta', newP:'Nueva planta', edit:'Editar planta', ai:'Hacer foto e identificarla con IA', name:'Nombre', emoji:'Icono', every:'Regar cada', spot:'Dónde está / notas', ok:'Guardar', days:n => n === 1 ? 'cada día' : `cada ${n} días`, late:n => n === 1 ? '¡Le toca desde ayer!' : `¡Le toca desde hace ${n} días!`, now:'Toca regar hoy 💧', in:n => n === 1 ? 'Mañana' : `En ${n} días`, watered:'Regada ✓', allOk:'Todas tus plantas están bien 🌿', need:n => n === 1 ? '1 planta necesita agua hoy' : `${n} plantas necesitan agua hoy`, empty:'Añade tu primera planta y te recordaré cuándo regarla.', looking:'Mirando tu planta…', noAi:'Para identificar plantas abre la app en Acornix con tu IA conectada.', failed:'No he podido: ', lang:'Spanish', locale:'es' }
 : { title:'My Plants', add:'＋ Add plant', newP:'New plant', edit:'Edit plant', ai:'Snap and identify it with AI', name:'Name', emoji:'Icon', every:'Water every', spot:'Where it lives / notes', ok:'Save', days:n => n === 1 ? 'every day' : `every ${n} days`, late:n => n === 1 ? 'Thirsty since yesterday!' : `Thirsty for ${n} days!`, now:'Water today 💧', in:n => n === 1 ? 'Tomorrow' : `In ${n} days`, watered:'Watered ✓', allOk:'All your plants are happy 🌿', need:n => n === 1 ? '1 plant needs water today' : `${n} plants need water today`, empty:'Add your first plant and I\'ll remind you when to water it.', looking:'Looking at your plant…', noAi:'To identify plants, open this app in Acornix with your AI connected.', failed:'Couldn\'t do it: ', lang:'English', locale:'en' };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const EMOJI = ['🪴', '🌵', '🌿', '🌱', '🌸', '🌻', '🌷', '🍀', '🎋', '🌳', '🌺', '🍅'];
const $ = id => document.getElementById(id), DAY = 864e5;
['ttl', 'add', 'lAi', 'lName', 'lEmoji', 'lEvery', 'lSpot', 'ok'].forEach((id, i) => $(id).textContent = [T.title, T.add, T.ai, T.name, T.emoji, T.every, T.spot, T.ok][i]);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let plants = [], editing = null, draft = {};
const midnight = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dueIn = p => Math.round((midnight(p.last) + p.every * DAY - midnight(Date.now())) / DAY);
function render() {
  const sorted = plants.map((p, i) => ({ p, i, d: dueIn(p) })).sort((a, b) => a.d - b.d), need = sorted.filter(x => x.d <= 0).length;
  $('today').textContent = plants.length ? (need ? T.need(need) : T.allOk) : '';
  $('list').innerHTML = plants.length ? sorted.map(({ p, i, d }) => {
    const cls = d < 0 ? 'late' : d === 0 ? 'now' : 'ok', txt = d < 0 ? T.late(-d) : d === 0 ? T.now : T.in(d), left = Math.max(0, Math.min(1, d / p.every));
    return `<div class="plant"><div class="pic" data-e="${i}" style="${p.photo ? `background-image:url(${p.photo})` : ''}">${p.photo ? '' : p.emoji}</div><div class="info" data-e="${i}"><b>${esc(p.name)}</b><small>${T.days(p.every)}${p.spot ? ' · ' + esc(p.spot) : ''}</small><div class="due ${cls}">${txt}</div><div class="meter"><i style="width:${left * 100}%"></i></div></div><button class="water ${d < 0 ? 'late' : ''}" data-w="${i}">💧</button></div>`;
  }).join('') : `<div class="empty"><div class="big">🌱</div>${T.empty}</div>`;
  $('list').querySelectorAll('[data-w]').forEach(b => b.onclick = () => { plants[+b.dataset.w].last = Date.now(); save(); render(); try { Acornix.vibrate([20, 40, 20]); Acornix.toast(T.watered); } catch (e) {} });
  $('list').querySelectorAll('[data-e]').forEach(b => b.onclick = () => openSheet(+b.dataset.e));
}
const save = () => store.set('plants', plants);
function openSheet(i) {
  editing = i; const p = i == null ? { name: '', emoji: '🪴', every: 7, spot: '', last: Date.now() } : plants[i]; draft = { ...p };
  $('sTitle').textContent = i == null ? T.newP : T.edit; $('name').value = p.name; $('every').value = p.every; $('spot').value = p.spot || ''; $('aiOut').innerHTML = draft.care ? `<p>${esc(draft.care)}</p>` : '';
  $('del').hidden = i == null; emojis(); everyUI(); $('sheet').hidden = false;
}
function emojis() { $('emojis').innerHTML = EMOJI.map(e => `<button class="${e === draft.emoji ? 'on' : ''}">${e}</button>`).join(''); $('emojis').querySelectorAll('button').forEach(b => b.onclick = () => { draft.emoji = b.textContent; emojis(); }); }
const everyUI = () => $('everyV').textContent = T.days(+$('every').value);
$('every').oninput = everyUI;
$('add').onclick = () => openSheet(null);
$('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').hidden = true; };
$('ok').onclick = () => {
  const name = $('name').value.trim(); if (!name) { $('name').focus(); return; }
  const p = { ...draft, name, every: +$('every').value, spot: $('spot').value.trim() };
  if (editing == null) plants.push(p); else plants[editing] = p; save(); render(); $('sheet').hidden = true;
};
$('del').onclick = () => { if (editing != null) { plants.splice(editing, 1); save(); render(); } $('sheet').hidden = true; };
function shrink(file, max) { return new Promise(res => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8)); URL.revokeObjectURL(im.src); }; im.src = URL.createObjectURL(file); }); }
$('photo').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  draft.photo = await shrink(f, 200);
  if (!window.Acornix) { $('aiOut').innerHTML = `<p class="err">${T.noAi}</p>`; return; }
  $('aiOut').innerHTML = `<p>🔍 ${T.looking}</p>`;
  try {
    const r = await Acornix.askAI('Identify this plant and tell me how to care for it.', { images: [await shrink(f, 1024)], json: true,
      system: `You are a friendly botanist. Identify the plant in the photo (common name), estimate how often to water it indoors in days, and give short care advice. Answer in ${T.lang}. Reply only with JSON: {"name":"common name","emoji":"one of 🪴🌵🌿🌱🌸🌻🌷🍀🎋🌳🌺🍅","waterEveryDays":number,"light":"short","care":"two short sentences with the most useful tips","health":"one sentence about how it looks in the photo"}` });
    if (!r || !r.name) throw new Error('?');
    $('name').value = r.name; if (EMOJI.includes(r.emoji)) draft.emoji = r.emoji; const ev = Math.max(1, Math.min(30, Math.round(+r.waterEveryDays || 7))); $('every').value = ev; everyUI(); emojis();
    draft.care = [r.light && '☀️ ' + r.light, r.care, r.health && '🩺 ' + r.health].filter(Boolean).join(' ');
    $('aiOut').innerHTML = `<p><b>${esc(r.name)}</b></p><p>${esc(draft.care)}</p>`;
    try { Acornix.vibrate(20); } catch (er) {}
  } catch (er) { $('aiOut').innerHTML = `<p class="err">${T.failed}${esc(er.message || '')}</p>`; }
};
(async () => { plants = await store.get('plants', []); render(); })();
</script>
</body>
</html>
