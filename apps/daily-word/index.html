<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101321">
<title>Ritmo</title>
<style>
:root{color-scheme:dark;--bg:#101321;--panel:#1b2033;--muted:#969eb8;--ink:#f6f5ff;--green:#37c993;--yellow:#e8b94f;--gray:#444b62;--line:#353c55;--accent:#b8a0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:radial-gradient(ellipse at 15% 0%,#302647 0,transparent 45%),radial-gradient(ellipse at 100% 65%,#132d35 0,transparent 45%),var(--bg)}
button{font:inherit;cursor:pointer;border:0;color:inherit;touch-action:manipulation}
button:disabled{cursor:default;opacity:.5}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{height:100%;height:100dvh;max-width:480px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:52px}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:31px;height:33px;display:grid;grid-template-columns:repeat(2,1fr);gap:3px;transform:rotate(-7deg)}
.logo i{background:var(--green);border-radius:4px}.logo i:nth-child(2){background:var(--yellow)}.logo i:nth-child(3){background:#9b83ee}
h1{font-size:25px;letter-spacing:3px;margin:0;font-weight:900}
.tools{display:flex;gap:3px}
.icon{background:transparent;border-radius:12px;min-width:42px;height:44px;display:grid;place-items:center;color:#c5cae0}
.icon svg{height:21px;width:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.daily{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 2px 0;flex-shrink:0}
.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:10px;font-weight:800;color:var(--accent)}
#dateLabel{font-size:13px;color:#bfc5da;margin-top:4px}
.streak{border:1px solid #ffffff13;border-radius:16px;background:#ffffff05;padding:8px 12px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800}
.streak small{font-size:10px;font-weight:500;color:var(--muted);display:block}
.status{min-height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:#bcc4db;margin-top:8px}
.status .dot{width:6px;height:6px;border-radius:100%;background:var(--green);box-shadow:0 0 10px #37c99360}
.board-wrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:7px 0 12px}
.board{height:100%;max-height:384px;aspect-ratio:5/6;width:auto;max-width:85vw;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:6px}
.tile{border:1.5px solid var(--line);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5.8vw,29px);font-weight:800;line-height:1;background:#191e30b3;backface-visibility:hidden;min-width:0;min-height:0;text-transform:uppercase;box-shadow:0 3px 0 #070a121a}
.tile.filled{border-color:#8c80b4;background:#27283e}
.tile.green{background:var(--green);border-color:var(--green);color:#082e26}
.tile.yellow{background:var(--yellow);border-color:var(--yellow);color:#3a2c0e}
.tile.gray{background:var(--gray);border-color:var(--gray);color:white}
.tile.pop{animation:pop .15s ease-out}
.tile.flip{animation:flip .52s ease-in-out}
.tile.jump{animation:jump .5s ease}
.board.shake{animation:shake .35s ease}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes jump{35%{transform:translateY(-11px)}65%{transform:translateY(2px)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.keyboard{display:flex;flex-direction:column;gap:6px;flex-shrink:0;user-select:none;touch-action:manipulation;padding-top:2px}
.key-row{display:flex;justify-content:center;gap:5px}
.key{height:47px;min-width:0;flex:1;max-width:44px;border-radius:9px;background:#30374f;font-size:14px;font-weight:750;box-shadow:0 3px 0 #080b1480;transition:background .18s,transform .08s;display:flex;align-items:center;justify-content:center;padding:0}
.key:active{transform:translateY(2px);box-shadow:none}
.key.wide{flex:1.55;max-width:65px;font-size:10px}
.key.green{background:var(--green);color:#082e26}.key.yellow{background:var(--yellow);color:#3a2c0e}.key.gray{background:#222839;color:#737d96;box-shadow:0 3px 0 #080b1430}
.bottom{height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;color:#77829d;font-size:10px}
.link{padding:6px 2px;background:none;color:#b8a0ff;font-size:11px}
#toast{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;padding:13px 18px;border-radius:14px;background:#f1eefc;color:#21233a;box-shadow:0 12px 35px #0005;font-size:13px;font-weight:700;text-align:center;max-width:90vw;width:max-content;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;z-index:20;background:#080b16bb;backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 17px calc(env(safe-area-inset-bottom,0px) + 16px)}
.overlay.open{display:flex}
.sheet{position:relative;background:linear-gradient(145deg,#262a43,#181e30);border:1px solid #ffffff16;border-radius:26px;padding:25px 23px;max-width:420px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 30px 90px #0007;animation:enter .23s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.close{position:absolute;right:10px;top:10px;font-size:26px;font-weight:300}
.sheet h2{font-size:25px;margin:5px 35px 7px 0;letter-spacing:-.5px}
.sheet p{color:#b7c0d9;line-height:1.6;font-size:13px;margin:9px 0}
.badge{color:var(--green);font-size:11px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0}
.metric{text-align:center}.metric b{display:block;font-size:26px;letter-spacing:-1px}.metric span{display:block;font-size:10px;color:#a6b0ca;line-height:1.4;margin-top:4px}
.section-title{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:20px 0 12px;color:#c7cce0}
.dist{display:flex;flex-direction:column;gap:6px}
.dist-row{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;height:22px}.dist-row>span{width:9px}
.track{flex:1;height:100%;background:#ffffff05;border-radius:5px;overflow:hidden}
.bar{background:#515974;height:100%;min-width:24px;border-radius:5px;text-align:right;padding:3px 7px}
.bar.today{background:var(--green);color:#0d3026}
.primary,.secondary{width:100%;min-height:48px;border-radius:14px;font-weight:800;font-size:14px;margin-top:10px;padding:12px}
.primary{background:linear-gradient(100deg,#c6aeff,#a995f5);color:#251c43;box-shadow:0 5px 20px #a995f523}
.secondary{background:#ffffff09;border:1px solid #ffffff13;color:#d7dcf1}
.next{text-align:center;margin-top:17px;color:#8994b1;font-size:11px}.next b{display:block;color:#d7dbed;letter-spacing:2px;font-size:20px;margin:5px}
.example{display:flex;gap:5px;margin:15px 0 8px}.example span{width:40px;height:42px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:#444b62}.example .g{background:var(--green);color:#082e26}.example .y{background:var(--yellow);color:#3a2c0e}
.legend{display:flex;gap:10px;align-items:center;margin:13px 0;font-size:13px;color:#c1c9dd}.swatch{height:22px;width:22px;flex-shrink:0;border-radius:6px}
.setting{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff0d;padding:15px 0;gap:12px;font-size:14px}
.segment{display:flex;gap:4px;background:#111629;border-radius:10px;padding:4px}.segment button{padding:9px 11px;border-radius:7px;background:transparent;font-size:12px}.segment button.active{background:#a995f5;color:#201934;font-weight:800}
.toggle{background:#414962;border-radius:25px;width:50px;height:29px;padding:4px}.toggle::after{content:"";display:block;width:21px;height:21px;border-radius:100%;background:white;transition:transform .2s}.toggle.on{background:var(--green)}.toggle.on::after{transform:translateX(21px)}
.fine{font-size:11px!important;color:#8994b1!important}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetto{position:absolute;top:-20px;width:8px;height:13px;border-radius:2px;animation:fall 2.1s ease-in forwards}
@keyframes fall{to{transform:translate(var(--drift),105vh) rotate(700deg);opacity:.2}}
@media(max-height:640px){.daily{margin-top:2px}.status{margin-top:3px;min-height:23px}.key{height:42px}.bottom{height:24px}header{height:45px}.board{gap:5px}.tile{border-radius:8px}.app{padding-top:calc(env(safe-area-inset-top,0px) + 3px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>

}
function input(ch){
if(!loaded||busy||modalType)return;
if(utcDay()!==day){newDay();return;}
if(game().finished){showStats();return;}
if(ch==='↵'){submit();return;}
if(ch==='⌫'){if(draft){draft=draft.slice(0,-1);vibrate(7);renderBoard();}return;}
ch=normalizeWord(ch);if(draft.length>=5||!(lang==='es'?/^[a-zñ]$/:/^[a-z]$/).test(ch))return;
draft+=ch;sound('tap');vibrate(7);renderBoard();
let tile=$('board').children[game().guesses.length*5+draft.length-1];tile?.classList.add('pop');
}
function invalid(key){toast(t(key));sound('error');vibrate([20,35,20]);$('board').classList.remove('shake');void $('board').offsetWidth;$('board').classList.add('shake');}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function submit(){
if(draft.length!==5){invalid('short');return;}
let g=game();
if(!SETS[lang].has(draft)){invalid('unknown');return;}
if(g.guesses.includes(draft)){invalid('already');return;}
busy=true;const row=g.guesses.length,guess=draft;
g.guesses.push(guess);g.won=guess===g.answer;g.finished=g.won||g.guesses.length===6;
state.games[lang+':'+day]=g;draft='';persist();
let colors=score(guess,g.answer),tiles=[...$('board').children].slice(row*5,row*5+5);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
await Promise.all(tiles.map(async(tile,i)=>{await sleep(reduced?0:i*115);tile.classList.remove('pop');tile.classList.add('flip');await sleep(reduced?0:255);tile.className='tile flip '+colors[i];sound('flip',i);if(colors[i]==='green')vibrate(10);await sleep(reduced?0:270);tile.classList.remove('flip');}));
render();
if(g.finished){
if(g.won){sound('win');vibrate([30,65,30,65,75]);tiles=[...$('board').children].slice(row*5,row*5+5);tiles.forEach((tile,i)=>setTimeout(()=>tile.classList.add('jump'),i*65));confetti();toast(t(g.guesses.length<=2?'brilliant':g.guesses.length<=4?'great':'nice'));}
await sleep(reduced?150:1000);busy=false;showStats();
}else busy=false;
if(externalPending){externalPending=false;reload();}
}
function confetti(){
if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
const container=$('confetti');container.innerHTML='';
for(let i=0;i<46;i++){let e=document.createElement('i');e.className='confetto';e.style.left=Math.random()*100+'%';e.style.background=['#37c993','#e8b94f','#b8a0ff','#f6f5ff'][i%4];e.style.animationDelay=Math.random()*.4+'s';e.style.setProperty('--drift',(Math.random()-.5)*200+'px');container.appendChild(e);}
setTimeout(()=>container.innerHTML='',3000);
}
function openModal(type,html){
focusBefore=document.activeElement;modalType=type;$('modalContent').innerHTML=html;$('overlay').classList.add('open');$('closeModal').focus();
}
function closeModal(){modalType='';$('overlay').classList.remove('open');focusBefore?.focus?.();}
function showHelp(){
openModal('help',`<div class="badge">${t('daily')}</div><h2 id="modalTitle">${t('how')}</h2><p>${t('helpIntro')}</p><div class="example" aria-hidden="true"><span class="g">R</span><span class="y">I</span><span>T</span><span>M</span><span>O</span></div><div class="legend"><i class="swatch" style="background:var(--green)"></i>${t('correct')}</div><div class="legend"><i class="swatch" style="background:var(--yellow)"></i>${t('present')}</div><div class="legend"><i class="swatch" style="background:var(--gray)"></i>${t('absent')}</div><p>${t('helpEnd')}</p><p class="fine">${t('accents')}</p><button class="primary" id="playBtn">${t('go')}</button>`);
$('playBtn').onclick=closeModal;
}
function showStats(){
let s=stats(),g=game(),finished=g.finished;
let title=finished?(g.won?t(g.guesses.length<=2?'brilliant':g.guesses.length<=4?'great':'nice'):t('lose')):t('yourStats');
let max=Math.max(1,...s.dist);
openModal('stats',`<div class="badge">${finished?(g.won?'✦ '+t('complete'):t('daily')):t('brand')}</div><h2 id="modalTitle">${title}</h2><p>${finished?(g.won?t('winSub'):t('answer',{word:g.answer.toUpperCase()})):t('noGames')}</p>
<div class="metrics">${[[s.played,'played'],[s.rate+'%','winRate'],[s.current,'currentStreak'],[s.best,'bestStreak']].map(([v,k])=>`<div class="metric"><b>${v}</b><span>${t(k)}</span></div>`).join('')}</div>
<div class="section-title">${t('distribution')}</div><div class="dist">${s.dist.map((n,i)=>`<div class="dist-row"><span>${i+1}</span><div class="track"><div class="bar ${g.won&&g.guesses.length===i+1?'today':''}" style="width:${Math.max(9,n/max*100)}%">${n}</div></div></div>`).join('')}</div>
${finished?`<button class="primary" id="shareCardBtn">${t('shareCard')}</button><button class="secondary" id="shareTextBtn">${t('shareText')}</button>`:''}
<div class="next">${t('next')}<b class="countdown"></b><span>${t('utc')}</span></div>`);
tickCountdown();
if(finished){$('shareCardBtn').onclick=shareCard;$('shareTextBtn').onclick=shareGrid;}
}
function showSettings(){
openModal('settings',`<div class="badge">${t('brand')}</div><h2 id="modalTitle">${t('settings')}</h2>
<div class="setting"><span>${t('language')}</span><div class="segment"><button id="langEs" class="${lang==='es'?'active':''}">${t('spanish')}</button><button id="langEn" class="${lang==='en'?'active':''}">${t('english')}</button></div></div>
<div class="setting"><span>${t('sound')}</span><button class="toggle ${state.settings.sound?'on':''}" id="soundToggle" role="switch" aria-checked="${state.settings.sound}" aria-label="${t('sound')}"></button></div>
<div class="setting"><span>${t('haptics')}</span><button class="toggle ${state.settings.haptics?'on':''}" id="hapticToggle" role="switch" aria-checked="${state.settings.haptics}" aria-label="${t('haptics')}"></button></div>
<p class="fine">${t('settingsNote')}</p>`);
$('langEs').onclick=()=>changeLanguage('es');$('langEn').onclick=()=>changeLanguage('en');
$('soundToggle').onclick=()=>{state.settings.sound=!state.settings.sound;persist();showSettings();sound('tap');};
$('hapticToggle').onclick=()=>{state.settings.haptics=!state.settings.haptics;persist();showSettings();vibrate();};
}
function changeLanguage(l){if(lang===l)return;lang=l;state.settings.lang=l;draft='';persist();render();showSettings();}
function resultText(){
let g=game();
return `${t('brand')} · ${day} · ${lang.toUpperCase()}\n${g.won?g.guesses.length:'X'}/6\n\n`+g.guesses.map(w=>score(w,g.answer).map(c=>({green:'🟩',yellow:'🟨',gray:'⬛'}[c])).join('')).join('\n')+`\n\n${t('made')}`;
}
async function shareGrid(){
const text=resultText();
try{
if(window.Acornix?.files?.share){await Acornix.files.share('ritmo-'+day+'.txt',text);}
else if(navigator.share){await navigator.share({title:t('shareTitle'),text});}
else showCopy(text);
}catch(e){if(e?.name!=='AbortError'){toast(t('shareError'));showCopy(text);}}
}
function showCopy(text){
openModal('copy',`<h2 id="modalTitle">${t('shareText')}</h2><p>${t('shareUnavailable')}</p><textarea id="gridText" readonly style="resize:none;width:100%;height:225px;border:1px solid #515974;border-radius:12px;padding:14px;background:#111629;color:#f6f5ff;font:14px system-ui"></textarea><button class="primary" id="copyBtn">${t('copy')}</button>`);
$('gridText').value=text;
$('copyBtn').onclick=async()=>{try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);else{$('gridText').select();$('gridText').setSelectionRange(0,text.length);if(!document.execCommand('copy'))throw Error();}toast(t('copied'));}catch(e){$('gridText').focus();$('gridText').select();}};
}
function roundRect(ctx,x,y,w,h,r,fill){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function drawCard(){
const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;let ctx=canvas.getContext('2d'),g=game(),s=stats();
let bg=ctx.createLinearGradient(0,0,1080,1350);bg.addColorStop(0,'#302647');bg.addColorStop(.5,'#151b2d');bg.addColorStop(1,'#153c3b');ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1350);
ctx.save();ctx.globalAlpha=.13;ctx.strokeStyle='#cbb9ff';ctx.lineWidth=1;
for(let i=-1100;i<2200;i+=65){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+1350,1350);ctx.stroke();}ctx.restore();
roundRect(ctx,68,60,944,1230,44,'#121728d9');
ctx.textAlign='center';ctx.fillStyle='#b8a0ff';ctx.font='700 20px system-ui';ctx.fillText(t('cardTag'),540,123);
const x=350,y=163,z=24;
roundRect(ctx,x,y,z,z,5,'#37c993');roundRect(ctx,x+30,y,z,z,5,'#e8b94f');roundRect(ctx,x,y+30,z,z,5,'#b8a0ff');roundRect(ctx,x+30,y+30,z,z,5,'#37c993');
ctx.textAlign='left';ctx.fillStyle='#f6f5ff';ctx.font='900 69px system-ui';ctx.fillText(t('brand'),430,217);
ctx.textAlign='center';ctx.fillStyle='#adb6cf';ctx.font='500 23px system-ui';ctx.fillText(day+'  ·  '+lang.toUpperCase(),540,265);
ctx.fillStyle='#f6f5ff';ctx.font='800 43px system-ui';ctx.fillText(g.won?t('cardWin'):t('cardLose'),540,338);
const size=77,gap=13,startX=(1080-(5*size+4*gap))/2,startY=385;
for(let r=0;r<6;r++){let colors=g.guesses[r]?score(g.guesses[r],g.answer):null;for(let c=0;c<5;c++){let fill=colors?({green:'#37c993',yellow:'#e8b94f',gray:'#444b62'}[colors[c]]):'#252c43';roundRect(ctx,startX+c*(size+gap),startY+r*(size+gap),size,size,14,fill);if(!colors){ctx.fillStyle='#5b6580';ctx.beginPath();ctx.arc(startX+c*(size+gap)+size/2,startY+r*(size+gap)+size/2,3,0,Math.PI*2);ctx.fill();}}}
ctx.fillStyle='#f6f5ff';ctx.font='900 56px system-ui';ctx.fillText((g.won?g.guesses.length:'X')+'/6',360,1027);ctx.fillText(String(s.current),720,1027);
ctx.fillStyle='#a5b0cd';ctx.font='700 18px system-ui';ctx.fillText(t('cardTries'),360,1065);ctx.fillText(t('cardStreak'),720,1065);
ctx.strokeStyle='#ffffff18';ctx.beginPath();ctx.moveTo(540,980);ctx.lineTo(540,1075);ctx.stroke();
ctx.fillStyle='#c1b0ef';ctx.font='500 23px system-ui';ctx.fillText(t('footer'),540,1156);
ctx.fillStyle='#8091ac';ctx.font='500 20px system-ui';ctx.fillText(t('made'),540,1233);
return canvas;
}
async function shareCard(){
let btn=$('shareCardBtn');if(!btn)return;btn.disabled=true;btn.textContent=t('sharing');
try{
const canvas=drawCard();
if(window.Acornix?.files?.share){await Acornix.files.share('result.png',canvas.toDataURL('image/png'));}
else {
let blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error()),'image/png')),file=new File([blob],'result.png',{type:'image/png'});
if(navigator.share&&navigator.canShare?.({files:[file]}))await navigator.share({title:t('shareTitle'),text:resultText(),files:[file]});
else if(navigator.share)await navigator.share({title:t('shareTitle'),text:resultText()});
else{
let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='result.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);showCopy(resultText());
}
}
}catch(e){if(e?.name!=='AbortError')toast(t('shareError'));}
finally{if(btn.isConnected){btn.disabled=false;btn.textContent=t('shareCard');}}
}
function tickCountdown(){
let now=Date.now(),seconds=Math.ceil((Math.floor(now/86400000)*86400000+86400000-now)/1000),str=[Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(n=>String(n).padStart(2,'0')).join(':');
document.querySelectorAll('.countdown').forEach(el=>el.textContent=str);
}
function newDay(){if(busy)return;day=utcDay();draft='';closeModal();render();toast(t('newDay'));}
async function reload(){
if(busy||pendingWrites){externalPending=true;return;}
try{const saved=await storage.get();if(saved&&saved.games&&saved.settings){state={settings:{lang:L,sound:true,haptics:true,...saved.settings},games:saved.games};lang=state.settings.lang==='es'?'es':'en';draft='';day=utcDay();render();if(modalType==='stats')showStats();if(modalType==='settings')showSettings();if(modalType==='help')showHelp();}}catch(e){toast(t('loadError'));}
}
async function init(){
try{const saved=await storage.get();if(saved?.games&&saved?.settings){state={settings:{lang:L,sound:true,haptics:true,...saved.settings},games:saved.games};lang=state.settings.lang==='es'?'es':'en';}day=utcDay();loaded=true;render();}
catch(e){day=utcDay();render();openModal('error',`<h2 id="modalTitle">${t('loadError')}</h2><button class="primary" id="retryLoad">${t('retry')}</button>`);$('retryLoad').onclick=()=>{closeModal();init();};}
}
$('helpBtn').onclick=()=>{if(!busy&&loaded)showHelp();};$('statsBtn').onclick=()=>{if(!busy&&loaded)showStats();};$('settingsBtn').onclick=()=>{if(!busy&&loaded)showSettings();};
$('bottomAction').onclick=()=>{if(!busy&&loaded)(game().finished?showStats:showHelp)();};
$('closeModal').onclick=()=>{if(modalType!=='error')closeModal();};
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay')&&modalType!=='error')closeModal();});
document.addEventListener('keydown',e=>{
if(modalType){
if(e.key==='Escape'&&modalType!=='error'){e.preventDefault();closeModal();}
if(e.key==='Tab'){const items=[...$('overlay').querySelectorAll('button,textarea,[tabindex="0"]')].filter(el=>!el.disabled);let first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
return;
}
if(e.ctrlKey||e.metaKey||e.altKey)return;
if(e.key==='Enter'){e.preventDefault();input('↵');}
else if(e.key==='Backspace'){e.preventDefault();input('⌫');}
else if(/^[a-zA-ZñÑáéíóúÁÉÍÓÚ]$/.test(e.key)){e.preventDefault();input(e.key);}
});
window.addEventListener('acornixdata',reload);
window.addEventListener('storage',e=>{if(e.key===DBKEY)reload();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(utcDay()!==day)newDay();else reload();}});
setInterval(()=>{tickCountdown();if(loaded&&utcDay()!==day&&!busy)newDay();if(externalPending&&!busy&&!pendingWrites){externalPending=false;reload();}},1000);
init();
</script>
</body>
</html>
