    if (e.dying) { e.dying -= dt * .9; e.g.rotation.x = -(1 - e.dying) * 1.5; e.g.position.y = -(1 - e.dying) * .5; if (e.dying <= 0) e.gone = true; continue; }
    e.t += dt;
    if (e.g.position.z < -6) { e.g.position.z += e.k.speed * dt * (1 + wave * .03); e.g.position.x += Math.sin(e.t * .7) * dt * .4; e.legs[0].rotation.x = Math.sin(e.t * 9) * .6; e.legs[1].rotation.x = -Math.sin(e.t * 9) * .6; e.g.position.y = Math.abs(Math.sin(e.t * 9)) * .08; }
    else { e.atWall = true; e.g.rotation.x = Math.sin(e.t * 6) * .25; wallHp -= e.k.dmg * dt * .35; if (Math.random() < dt * 2) { tone(70, .1, 'square', .04); shakeT = .25; } }
    e.hpBar.lookAt(camera.position);
  }
  enemies.filter(e => e.gone).forEach(e => scene.remove(e.g));
  enemies = enemies.filter(e => !e.gone);
  sparks.forEach(s => { s.position.addScaledVector(s.userData.v, dt); s.userData.v.y -= 18 * dt; s.userData.life -= dt * 1.5; s.scale.setScalar(Math.max(.01, s.userData.life)); });
  sparks = sparks.filter(s => { if (s.userData.life <= 0) { scene.remove(s); return false; } return true; });
  hud();
  if (state === 'play') {
    if (wallHp <= 0) return gameOver();
    if (!queue.length && !enemies.some(e => !e.dying)) waveCleared();
  }
}
let shakeT = 0;
function placeCamera(t) {
  const portrait = innerWidth < innerHeight;
  shakeT = Math.max(0, shakeT - .016);
  camera.position.set((Math.random() - .5) * shakeT, 9.5 + (Math.random() - .5) * shakeT, 3.5);
  camera.lookAt(0, portrait ? 1 : 2.5, -40);
  bow.position.set(0, 8.1, 2.1); bow.rotation.x = -.12; bow.scale.setScalar(.62);
}
function waveCleared() { state = 'shop'; buzz([30, 40, 60]); tone(660, .15); setTimeout(() => tone(880, .25), 150); setTimeout(shop, 900); banner(T.cleared, 1200); }
function shop() {
  const items = Object.entries(T.ups).map(([key, [e, name, desc]]) => {
    const level = key === 'repair' ? 0 : key === 'multi' ? up.multi - 1 : up[key] - (key === 'dmg' ? 1 : 0);
    const maxed = (key === 'multi' && up.multi >= 4) || (key === 'fire' && up.fire >= 3) || (key === 'rate' && up.rate >= 5) || (key === 'repair' && wallHp >= 100);
    const cost = COSTS[key](level);
    return `<button class="up" data-k="${key}" data-c="${cost}" ${maxed || gold < cost ? 'disabled' : ''}><span class="e">${e}</span><div><b>${name}</b><small>${desc}</small></div><span class="cost">${maxed ? T.max : '🪙 ' + cost}</span></button>`;
  }).join('');
  showPanel(`<h1>${T.cleared}</h1><p>${T.shop}</p><div class="gold">🪙 ${gold}</div><div class="ups">${items}</div><button class="go" id="go">${T.next} ➜</button>`, startWave);
  document.querySelectorAll('.up').forEach(b => b.onclick = e => {
    e.stopPropagation(); const k = b.dataset.k, c = +b.dataset.c; if (gold < c) return; gold -= c;
    if (k === 'repair') wallHp = Math.min(100, wallHp + 35); else if (k === 'multi') up.multi++; else up[k]++;
    tone(990, .12); hud(); shop();
  });
}
async function gameOver() {
  state = 'over'; buzz([100, 60, 300]); tone(60, .8, 'sawtooth', .07);
  if (wave > best) { best = wave; await store.set('best', best); }
  showPanel(`<h1>🏰 ${T.over}</h1><p>${T.reached} <b>${wave}</b> · ⚔️ ${kills}</p><p>${T.best}: ${T.wave} ${best}</p><button class="go" id="go">${T.again}</button>`, newGame);
}
function newGame() {
  enemies.forEach(e => scene.remove(e.g)); enemies = []; bolts.forEach(b => scene.remove(b.mesh)); bolts = []; queue = [];
  wave = 0; gold = 0; wallHp = 100; kills = 0; up = { dmg: 1, rate: 0, multi: 1, fire: 0 }; startWave();
}
function showPanel(html, action) { $('card').innerHTML = html; $('panel').classList.remove('hide'); $('go').onclick = e => { e.stopPropagation(); action(); }; }
function hidePanel() { $('panel').classList.add('hide'); }
addEventListener('pointerdown', e => { if (e.target.closest('.panel')) return; shoot(e.clientX, e.clientY); });
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 70 : 55; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
let last = performance.now();
function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (state !== 'menu') update(dt); placeCamera(t); renderer.render(scene, camera); requestAnimationFrame(loop); }
(async () => {
  best = await store.get('best', 0); resize(); hud();
  showPanel(`<h1>🏰 ${T.title}</h1><p>${T.intro}</p>${best ? `<p>${T.best}: ${T.wave} ${best}</p>` : ''}<button class="go" id="go">${T.start}</button>`, newGame);
  requestAnimationFrame(loop);
})();
</script>
