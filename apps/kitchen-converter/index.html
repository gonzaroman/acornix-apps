<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kitchen Converter</title>
<style>
  :root { --bg:#f3f8f4; --card:#fff; --ink:#1d2b22; --muted:#7a8b80; --a:#2b8a3e; --line:#dfeae2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  h1 { margin:0 0 14px; font-size:26px; }
  .tabs { display:flex; gap:6px; background:#e3eee6; padding:4px; border-radius:16px; margin-bottom:14px; }
  .tabs button { flex:1; padding:10px 4px; border-radius:12px; font-weight:800; font-size:13px; color:var(--muted); background:none; } .tabs button.on { background:#fff; color:var(--ink); box-shadow:0 1px 4px #0001; }
  .card { background:var(--card); border-radius:22px; padding:16px; box-shadow:0 2px 0 var(--line); }
  .ings { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; margin-bottom:14px; } .ings::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:8px 12px; border-radius:20px; background:#f1f6f2; font-weight:800; font-size:13px; } .chip.on { background:var(--ink); color:#fff; }
  .big { display:flex; gap:10px; align-items:center; }
  .big input { flex:1; min-width:0; font-size:40px; font-weight:900; border:0; border-bottom:3px solid var(--line); outline:none; padding:4px 0; background:none; color:var(--ink); font-variant-numeric:tabular-nums; }
  .big input:focus { border-color:var(--a); }
  .big select { padding:12px; border-radius:14px; border:2px solid var(--line); background:#fff; font:inherit; font-weight:800; color:var(--ink); }
  .res { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
  .res div { background:#f1f6f2; border-radius:14px; padding:12px; } .res b { display:block; font-size:22px; font-variant-numeric:tabular-nums; } .res span { color:var(--muted); font-weight:700; font-size:13px; }
  .res div.hl { background:var(--a); color:#fff; } .res div.hl span { color:#d3f9d8; }
  .oven { display:grid; gap:8px; }
  .ov { display:grid; grid-template-columns:1fr 1fr 1fr 1.6fr; gap:6px; align-items:center; padding:9px 10px; border-radius:12px; background:#f1f6f2; font-weight:800; font-variant-numeric:tabular-nums; font-size:14px; }
  .ov.head { background:none; color:var(--muted); font-size:12px; } .ov small { color:var(--muted); font-weight:700; }
  .heat { height:8px; border-radius:4px; }
  .note { color:var(--muted); font-size:13px; margin-top:12px; line-height:1.45; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🥄 <span id="ttl"></span></h1>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="pane"></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Conversor de cocina', tabs:['⚖️ Ingredientes', '🧪 Volumen', '🔥 Horno'], note:'Las tazas son de 240 ml. Medidas a ras, sin apretar la harina.', ovenNote:'Con horno de aire (ventilador), baja unos 20 °C.', gas:'Gas', heat:['Muy bajo', 'Bajo', 'Moderado', 'Medio', 'Alto', 'Muy alto'], units:{ g:'gramos', oz:'onzas', cup:'tazas', tbsp:'cucharadas', tsp:'cucharaditas', ml:'ml', lb:'libras', floz:'fl oz', l:'litros' },
  ing:[['Harina', 120], ['Azúcar', 200], ['Azúcar glas', 120], ['Mantequilla', 227], ['Arroz', 185], ['Avena', 90], ['Cacao', 85], ['Leche', 245], ['Agua', 240], ['Aceite', 218], ['Miel', 340], ['Almendra molida', 96]] }
 : { title:'Kitchen Converter', tabs:['⚖️ Ingredients', '🧪 Volume', '🔥 Oven'], note:'Cups are 240 ml. Spoon flour in and level it, don\'t pack it.', ovenNote:'For a fan oven, go about 20 °C lower.', gas:'Gas', heat:['Very low', 'Low', 'Moderate', 'Medium', 'Hot', 'Very hot'], units:{ g:'grams', oz:'ounces', cup:'cups', tbsp:'tbsp', tsp:'tsp', ml:'ml', lb:'pounds', floz:'fl oz', l:'litres' },
  ing:[['Flour', 120], ['Sugar', 200], ['Icing sugar', 120], ['Butter', 227], ['Rice', 185], ['Oats', 90], ['Cocoa', 85], ['Milk', 245], ['Water', 240], ['Oil', 218], ['Honey', 340], ['Ground almonds', 96]] };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
$('ttl').textContent = T.title;
// Volumes in ml, weights in g.
const VOL = { cup: 240, tbsp: 15, tsp: 5, ml: 1, floz: 29.5735, l: 1000 }, WT = { g: 1, oz: 28.3495, lb: 453.592 };
let st = { tab: 0, ing: 0, a: 1, au: 'cup', v: 250, vu: 'ml' };
const save = () => store.set('st', st);
const nf = x => { const r = x >= 100 ? Math.round(x) : x >= 10 ? Math.round(x * 10) / 10 : Math.round(x * 100) / 100; return r.toLocaleString(ES ? 'es' : 'en'); };
function tabs() { $('tabs').innerHTML = T.tabs.map((t, i) => `<button class="${i === st.tab ? 'on' : ''}" data-i="${i}">${t}</button>`).join(''); $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { st.tab = +b.dataset.i; save(); tabs(); pane(); }); }
function pane() {
  if (st.tab === 0) {
    const units = ['cup', 'tbsp', 'tsp', 'g', 'oz', 'ml'];
    $('pane').innerHTML = `<div class="ings">${T.ing.map(([n], i) => `<button class="chip ${i === st.ing ? 'on' : ''}" data-i="${i}">${n}</button>`).join('')}</div>
      <div class="big"><input id="a" type="number" inputmode="decimal" value="${st.a}"><select id="au">${units.map(u => `<option value="${u}" ${u === st.au ? 'selected' : ''}>${T.units[u]}</option>`).join('')}</select></div><div class="res" id="res"></div><div class="note">${T.note}</div>`;
    $('pane').querySelectorAll('.chip').forEach(b => b.onclick = () => { st.ing = +b.dataset.i; save(); pane(); });
    const calc = () => {
      st.a = +$('a').value || 0; st.au = $('au').value; save(); const gPerCup = T.ing[st.ing][1];
      // Everything goes through grams, using this ingredient's weight per cup.
      const grams = WT[st.au] ? st.a * WT[st.au] : st.a * VOL[st.au] / 240 * gPerCup, ml = grams / gPerCup * 240;
      $('res').innerHTML = [['g', grams], ['oz', grams / WT.oz], ['cup', ml / 240], ['tbsp', ml / 15], ['tsp', ml / 5], ['ml', ml]].filter(([u]) => u !== st.au).map(([u, v], i) => `<div class="${i === 0 ? 'hl' : ''}"><b>${nf(v)}</b><span>${T.units[u]}</span></div>`).join('');
    };
    $('a').oninput = calc; $('au').onchange = calc; calc();
  } else if (st.tab === 1) {
    const units = Object.keys(VOL);
    $('pane').innerHTML = `<div class="big"><input id="v" type="number" inputmode="decimal" value="${st.v}"><select id="vu">${units.map(u => `<option value="${u}" ${u === st.vu ? 'selected' : ''}>${T.units[u]}</option>`).join('')}</select></div><div class="res" id="res"></div>`;
    const calc = () => { st.v = +$('v').value || 0; st.vu = $('vu').value; save(); const ml = st.v * VOL[st.vu]; $('res').innerHTML = units.filter(u => u !== st.vu).map((u, i) => `<div class="${i === 0 ? 'hl' : ''}"><b>${nf(ml / VOL[u])}</b><span>${T.units[u]}</span></div>`).join(''); };
    $('v').oninput = calc; $('vu').onchange = calc; calc();
  } else {
    const rows = [[120, 250, '½', 0], [140, 275, 1, 1], [150, 300, 2, 1], [160, 325, 3, 2], [180, 350, 4, 2], [190, 375, 5, 3], [200, 400, 6, 3], [220, 425, 7, 4], [230, 450, 8, 4], [240, 475, 9, 5]];
    $('pane').innerHTML = `<div class="oven"><div class="ov head"><span>°C</span><span>°F</span><span>${T.gas}</span><span></span></div>${rows.map(([c, f, g, h]) => `<div class="ov"><span>${c}°</span><span>${f}°</span><span>${g}</span><span><div class="heat" style="width:${30 + h * 14}%;background:hsl(${45 - h * 9} 95% ${60 - h * 4}%)"></div><small>${T.heat[h]}</small></span></div>`).join('')}</div><div class="note">${T.ovenNote}</div>`;
  }
}
(async () => { st = { ...st, ...(await store.get('st', {})) }; tabs(); pane(); })();
</script>
</body>
</html>
