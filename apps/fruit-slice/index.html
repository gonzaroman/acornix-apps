<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101525">
<title>JUICY</title>
<style>
:root{color-scheme:dark;--bg:#101525;--panel:#1b2237;--muted:#9da8c2;--cream:#fff4dd;--lime:#d4ff75;--orange:#ffac64;--pink:#ff769e;--line:#ffffff12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--cream);overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:3px solid var(--lime);outline-offset:4px}
#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.screen{position:absolute;inset:0;z-index:2}
.hidden{display:none!important}
#home{overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 22px);background:linear-gradient(180deg,#10152508,#10152522 35%,#101525ed 67%);scrollbar-width:none}
.wrap{max-width:460px;margin:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wordmark{font-size:24px;font-weight:950;letter-spacing:-1.5px;font-style:italic}
.wordmark b{color:var(--lime)}
.controls{display:flex;gap:8px}
.iconbtn{width:43px;height:43px;border-radius:15px;background:#ffffff0a;border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.iconbtn.off{opacity:.45}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{height:clamp(185px,29vh,270px);position:relative;padding-top:27px;pointer-events:none}
.eyebrow{color:var(--lime);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:2.5px}
h1{font-size:clamp(40px,11vw,58px);font-weight:900;line-height:.98;letter-spacing:-2.8px;margin:11px 0}
h1 span{color:var(--orange)}
.hero p{font-size:12px;line-height:1.5;color:#c4cadd;max-width:175px;margin-top:13px}
.hero .swipehint{position:absolute;right:1px;bottom:14px;color:#b4c6d6;font-size:11px;transform:rotate(-10deg)}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:19px}
.stat{text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat strong{display:block;font-size:22px;letter-spacing:-.7px}
.stat small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.mode-tabs{display:flex;background:#080d1b99;border:1px solid var(--line);padding:5px;border-radius:18px;gap:4px}
.mode-tabs button{flex:1;border-radius:13px;background:transparent;padding:11px;font-size:13px;font-weight:800;color:var(--muted)}
.mode-tabs button.selected{background:#303950;color:var(--cream);box-shadow:0 3px 12px #0003}
.mode-desc{color:var(--muted);font-size:12px;text-align:center;min-height:34px;padding:10px 0 9px}
.primary{width:100%;padding:17px 18px;background:var(--lime);color:#172210;border-radius:19px;font-weight:900;font-size:16px;box-shadow:0 7px 30px #c7ff6418;display:flex;align-items:center;justify-content:center;gap:12px}
.primary .arrow{font-size:21px}
.secondary{background:#ffffff0a;border:1px solid #ffffff16;border-radius:17px;padding:14px;font-weight:750;width:100%;font-size:14px}
#resumeHome{margin-bottom:10px;color:var(--lime);padding:12px}
.daily{margin-top:17px;width:100%;background:linear-gradient(115deg,#342b40,#272b40);border:1px solid #ffb57525;border-radius:21px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center}
.daily-icon{width:46px;height:46px;flex-shrink:0;border-radius:15px;display:grid;place-items:center;font-size:25px;background:#ffb57517}
.daily-content{flex:1;min-width:0}
.daily-top{display:flex;justify-content:space-between;gap:4px;font-size:13px;font-weight:800;align-items:center}
.pill{font-size:9px;background:#ffb5751c;color:#ffc78e;border-radius:6px;padding:4px 6px;white-space:nowrap}
.daily-sub{font-size:11px;color:#b8b6ca;margin-top:5px;line-height:1.4}
.track{height:4px;background:#ffffff12;border-radius:5px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--pink));border-radius:5px}
.bottom-note{font-size:10px;text-align:center;color:#78849f;margin:17px 0 0;line-height:1.5}
#hud{pointer-events:none;padding:calc(env(safe-area-inset-top) + 16px) 21px 0}
.hud-top{display:flex;align-items:flex-start;justify-content:space-between}
.score-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:800}
#score{font-size:48px;font-weight:950;line-height:1.1;letter-spacing:-2px}
.hud-right{display:flex;align-items:center;gap:16px}
#lives{color:var(--pink);font-size:20px;letter-spacing:3px;white-space:nowrap}
#pauseBtn{pointer-events:auto}
.hud-bottom{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:#b4bfd4;align-items:center}
#time{background:#ffffff09;padding:7px 11px;border-radius:10px;font-variant-numeric:tabular-nums;font-weight:800;color:var(--cream);font-size:13px}
#time.urgent{color:var(--pink);animation:pulse .6s infinite alternate}
#instruction{position:absolute;top:29%;left:20px;right:20px;text-align:center;color:#d0d9e9;pointer-events:none;font-size:15px;animation:hint 2s infinite}
#dailyHUD{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 19px);left:24px;right:24px;font-size:11px;color:#d9d6c9;text-align:center}
#dailyHUD .track{max-width:260px;margin:8px auto 0}
.modal{display:flex;align-items:center;justify-content:center;background:#0b1021c9;backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 20px) 23px calc(env(safe-area-inset-bottom) + 20px);overflow-y:auto}
.card{width:100%;max-width:390px;background:linear-gradient(150deg,#252c43,#181e31);border:1px solid #ffffff13;border-radius:30px;padding:27px 23px;text-align:center;box-shadow:0 25px 90px #0005;animation:appear .35s cubic-bezier(.16,1,.3,1)}
.card .medal{width:76px;height:76px;border-radius:26px;background:#d4ff7513;margin:0 auto 17px;display:grid;place-items:center;font-size:38px;transform:rotate(-8deg);border:1px solid #d4ff7522}
.card h2{font-size:29px;letter-spacing:-1px;margin:7px 0 9px;line-height:1.1}
.card p{font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 20px}
.result-score{font-size:83px;letter-spacing:-5px;font-weight:950;line-height:1.1;color:var(--lime);margin:8px 0}
#recordBadge{display:inline-block;color:var(--orange);font-size:11px;font-weight:800;padding:6px 12px;border-radius:20px;background:#ffac6411}
.result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;margin:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0}
.result-grid b{font-size:21px;display:block}
.result-grid small{font-size:10px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.textbtn{background:none;color:var(--muted);font-size:12px;padding:15px 10px 0}
#toast{position:fixed;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom) + 25px);margin:auto;max-width:410px;z-index:20;background:#f1f3fb;color:#172035;border-radius:16px;padding:14px 18px;text-align:center;font-size:13px;box-shadow:0 8px 40px #0006;transition:opacity .2s;pointer-events:none;opacity:0}
#toast.show{opacity:1}
@keyframes appear{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pulse{to{opacity:.45}}
@keyframes hint{50%{opacity:.4;transform:translateY(4px)}}
@media(max-height:720px){#home{padding-top:calc(env(safe-area-inset-top) + 12px)}.hero{height:180px;padding-top:15px}h1{font-size:43px}.summary{padding:12px 0;margin-bottom:13px}.daily{margin-top:12px;padding:13px}.bottom-note{margin-top:11px}.card{padding:20px}.card .medal{width:58px;height:58px;font-size:30px;margin-bottom:10px}.result-score{font-size:69px}.result-grid{margin:17px 0}}
@media(prefers-reduced-motion:reduce){.card,#instruction,#time.urgent{animation:none}button{transition:none}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<section id="home" class="screen">
 <div class="wrap">
  <header class="topbar">
   <div class="wordmark" id="brand"></div>
   <div class="controls">
    <button class="iconbtn" id="soundBtn"></button>
    <button class="iconbtn" id="hapticBtn"></button>
   </div>
  </header>
  <div class="hero">
   <div class="eyebrow" data-t="eyebrow"></div>
   <h1 id="heroTitle"></h1>
   <p data-t="tagline"></p>
   <div class="swipehint" data-t="swipeHint"></div>
  </div>
  <div class="summary">
   <div class="stat"><strong id="bestHome">0</strong><small data-t="personalBest"></small></div>
   <div class="stat"><strong id="streakHome">0</strong><small data-t="dayStreak"></small></div>
   <div class="stat"><strong id="totalHome">0</strong><small data-t="fruitSliced"></small></div>
  </div>
  <div class="mode-tabs">
   <button id="arcadeTab" class="selected" data-t="arcade"></button>
   <button id="zenTab" data-t="zen"></button>
  </div>
  <div class="mode-desc" id="modeDesc"></div>
  <button id="resumeHome" class="secondary hidden" data-t="resumeSaved"></button>
  <button id="playBtn" class="primary"><span data-t="play"></span><span class="arrow">↗</span></button>
  <button class="daily" id="dailyBtn">
   <div class="daily-icon">☀</div>
   <div class="daily-content">
    <div class="daily-top"><span data-t="daily"></span><span class="pill" id="dailyPill"></span></div>
    <div class="daily-sub" id="dailySub"></div>
    <div class="track"><i id="dailyProgress"></i></div>
   </div>
   <span>↗</span>
  </button>
  <p class="bottom-note" data-t="homeNote"></p>
 </div>
</section>
<section id="hud" class="screen hidden">
 <div class="hud-top">
  <div><div class="score-label" data-t="score"></div><div id="score">0</div></div>
  <div class="hud-right"><div id="lives"></div><button class="iconbtn" id="pauseBtn" aria-label="Pause">Ⅱ</button></div>
 </div>
 <div class="hud-bottom"><span id="modeHUD"></span><span id="time"></span></div>
 <div id="instruction"></div>
 <div id="dailyHUD" class="hidden"><span id="dailyHUDText"></span><div class="track"><i id="dailyHUDProgress"></i></div></div>
</section>
<section id="pauseScreen" class="screen modal hidden">
 <div class="card">
  <div class="medal">Ⅱ</div>
  <div class="eyebrow" data-t="takeBreath"></div>
  <h2 data-t="paused"></h2>
  <p data-t="pauseText"></p>
  <button id="continueBtn" class="primary" data-t="continue"></button>
  <button id="saveHomeBtn" class="secondary" style="margin-top:10px" data-t="saveHome"></button>
  <button id="endBtn" class="textbtn" data-t="endRun"></button>
 </div>
</section>
<section id="resultScreen" class="screen modal hidden">
 <div class="card">
  <div class="medal" id="resultIcon">✦</div>
  <div class="eyebrow" id="resultEyebrow"></div>
  <h2 id="resultTitle"></h2>
  <div class="result-score" id="resultScore">0</div>
  <div id="recordBadge"></div>
  <div class="result-grid">
   <div><b id="resultFruit">0</b><small data-t="fruits"></small></div>
   <div><b id="resultCombo">0×</b><small data-t="bestCombo"></small></div>
   <div><b id="resultStreak">0</b><small data-t="dayStreak"></small></div>
  </div>
  <p id="resultNote"></p>
  <button id="againBtn" class="primary" data-t="again"></button>
  <div class="actions">
   <button id="shareBtn" class="secondary" data-t="share"></button>
   <button id="homeBtn" class="secondary" data-t="home"></button>
  </div>
 </div>
</section>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const T={
 en:{
 name:'JUICY',eyebrow:'A little slice of happiness',hero:'Stay sharp.<br><span>Go juicy.</span>',tagline:'Big swipes. Sweet combos.<br>One more round?',swipeHint:'slice your way ↗',
 personalBest:'BEST SCORE',dayStreak:'DAY STREAK',fruitSliced:'FRUITS SLICED',arcade:'Arcade',zen:'Zen',daily:'Daily challenge',
 arcadeDesc:'3 lives · avoid bombs · 60 seconds',zenDesc:'No bombs. No lives. Just 60 seconds of flow.',

 dailyNew:'TODAY',dailyDone:'COMPLETE ✓',dailyGoal:'Reach {n} points · same challenge all day',dailyBest:'Today: {s} / {n} points',dailyLive:'Daily goal · {s} / {n}',dailySuccess:'Daily challenge complete!',dailyTry:'So close to a sweeter score.',dailyNote:'A fresh challenge arrives tomorrow. Your streak grows one day at a time.',

 replaced:'Your saved round is ready to resume.',pausedAuto:'Round paused',livesLabel:'{n} lives',zenLabel:'Endless good vibes',dailyRules:'3 lives · no bombs · reach {n} points',bombHint:'Avoid the bombs!',miss:'MISS',goal:'GOAL REACHED',record:'PERSONAL BEST',ready:'Ready to slice?'

 loading:'Preparando la fruta…',footer:'Made with Acornix',shareTag:'¿Puedes superar mis cortes?',shareStats:'{f} frutas   ·   combo máximo {c}×',shareStreak:'Racha de {n} días',dailyExpired:'La ronda diaria de ayer ha terminado. Ya tienes un reto nuevo.',

 }
};
const L=((window.Acornix&&Acornix.language)||navigator.language||'en').toLowerCase().startsWith('es')?'es':'en';
const t=(k,v={})=>Object.entries(v).reduce((s,[a,b])=>s.replaceAll('{'+a+'}',b),T[L][k]||k);
const $=id=>document.getElementById(id);
document.documentElement.lang=L;
document.title=t('name');
document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
$('brand').innerHTML=t('name')+'<b>®</b>';
$('heroTitle').innerHTML=t('hero');
$('tagline').innerHTML=t('tagline');
$('pauseBtn').setAttribute('aria-label',t('pause'));

const soundIcon='<svg viewBox="0 0 24 24"><path d="M11 4 5 9H2v6h3l6 5z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>';
const hapticIcon='<svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="m4 7-2 3 2 4-2 3m18-10 2 3-2 4 2 3M11 18h2"/></svg>';
$('soundBtn').innerHTML=soundIcon;$('hapticBtn').innerHTML=hapticIcon;
const canvas=$('stage'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1,view='home',mode='arcade',run=null,result=null,loaded=false;
let fruits=[],pieces=[],particles=[],splats=[],floaters=[],trail=[],ripples=[];
let lastFrame=performance.now(),clock=0,shake=0,flash=0,comboAt=-10,chain=0,pointer=null,lastPoint=null;
let saveTick=0,audio=null,toastTimer;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const db=window.Acornix&&Acornix.db;
const defaultState=()=>({v:1,bests:{arcade:0,zen:0,daily:0},total:0,played:0,streak:0,lastDay:'',daily:{day:'',score:0,complete:false},settings:{sound:true,haptic:true},active:null,lastResult:null});
let state=defaultState();
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayNumber(s){return Math.floor(Date.parse(s+'T12:00:00Z')/86400000)}
function hash(s){let n=2166136261;for(let c of s)n=Math.imul(n^c.charCodeAt(0),16777619);return n>>>0}
function dailyTarget(){return 450+(hash(dayKey())%5)*25}
function ensureDaily(){if(state.daily.day!==dayKey())state.daily={day:dayKey(),score:0,complete:false}}
function streakNow(){return state.lastDay&&dayNumber(dayKey())-dayNumber(state.lastDay)<=1?state.streak:0}
let pendingSave=null,saving=false;
function persist(){
 pendingSave=JSON.stringify(state);
 if(!saving)flushSave();
}
async function flushSave(){
 saving=true;
 while(pendingSave){
  let json=pendingSave;pendingSave=null;
  try{if(db)await db.set('juicy-state',JSON.parse(json));else localStorage.setItem('juicy-state',json)}
  catch(e){toast(t('saveError'))}
 }
 saving=false;
}
async function load(initial=false){
 try{
  let saved=db?await db.get('juicy-state'):JSON.parse(localStorage.getItem('juicy-state')||'null');
  if(saved){
   const base=defaultState();
   const active=run&&['playing','paused'].includes(view)?snapshot():null;
   state={...base,...saved,bests:{...base.bests,...saved.bests},settings:{...base.settings,...saved.settings}};
   if(active)state.active=active;
  }
 }catch(e){toast(t('saveError'))}
 ensureDaily();loaded=true;renderHome();renderSettings();
 if(initial&&state.lastResult)result=state.lastResult;
}
window.addEventListener('acornixdata',()=>load());
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3200)}
function renderSettings(){
 for(const [id,key,on,off] of [['soundBtn','sound','soundOn','soundOff'],['hapticBtn','haptic','hapticOn','hapticOff']]){
  $(id).classList.toggle('off',!state.settings[key]);
  $(id).setAttribute('aria-label',t(state.settings[key]?on:off));
  $(id).setAttribute('aria-pressed',String(state.settings[key]));
 }
}
function renderHome(){
 ensureDaily();
 $('bestHome').textContent=state.bests[mode]||0;
 $('streakHome').textContent=streakNow();
 $('totalHome').textContent=Number(state.total||0).toLocaleString(L);
 $('arcadeTab').classList.toggle('selected',mode==='arcade');
 $('zenTab').classList.toggle('selected',mode==='zen');
 $('arcadeTab').setAttribute('aria-pressed',String(mode==='arcade'));
 $('zenTab').setAttribute('aria-pressed',String(mode==='zen'));
 $('modeDesc').textContent=t(mode==='zen'?'zenDesc':'arcadeDesc');
 $('resumeHome').classList.toggle('hidden',!state.active);
 $('dailyPill').textContent=t(state.daily.complete?'dailyDone':'dailyNew');
 $('dailySub').textContent=state.daily.score?t('dailyBest',{s:state.daily.score,n:dailyTarget()}):t('dailyGoal',{n:dailyTarget()});
 $('dailyProgress').style.width=Math.min(100,state.daily.score/dailyTarget()*100)+'%';
}
function screens(next){
 view=next;

function distanceToSegment(px,py,ax,ay,bx,by){
 const dx=bx-ax,dy=by-ay;

}

 for(const f of hits){
  if(view!=='playing')break;
  if(f.bomb){
   f.dead=true;shake=22;flash=.8;buzz(180);
   burst(f.x,f.y,'#ffc27a',45);
   finish('bomb');break;

 if(view==='playing'&&run){
  run.elapsed+=dt;run.spawnIn-=dt;saveTick+=dt;
  if(run.elapsed>=60){finish('time');return}
  if(run.spawnIn<=0)spawnWave();
  const gravity=H*1.15;
  for(const f of fruits){
   f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=gravity*dt;f.angle+=f.spin*dt;
   if((f.x<f.r*.6&&f.vx<0)||(f.x>W-f.r*.6&&f.vx>0))f.vx*=-.7;
   if(f.vy>0&&f.y>H+f.r+30){
    f.dead=true;
    if(!f.bomb&&run.mode!=='zen'){
     run.lives--;sound('miss');buzz(35);
     floaters.push({x:Math.max(55,Math.min(W-55,f.x)),y:H-90,text:'−1 ♥',color:'#ff769e',life:1,size:24});
     if(run.lives<=0){finish('lives');return}
     saveRun();
    }
   }
  }
  fruits=fruits.filter(f=>!f.dead);
  updateHUD();
  if(saveTick>1){saveTick=0;saveRun()}
 }
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=650*dt;p.vx*=Math.pow(.3,dt);p.life-=dt}
 particles=particles.filter(p=>p.life>0);
 for(const p of pieces){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=H*.9*dt;p.angle+=p.spin*dt;p.life-=dt}
 pieces=pieces.filter(p=>p.life>0&&p.y<H+100);
 for(const p of splats)p.life-=dt;
 splats=splats.filter(p=>p.life>0).slice(-18);
 for(const p of floaters){p.y-=dt*(p.combo?15:55);p.life-=dt}
 floaters=floaters.filter(p=>p.life>0);
 for(const p of ripples){p.r+=dt*140;p.life-=dt}

  ctx.rotate(-p.cutAngle);
  drawFruit(ctx,{...p,x:0,y:0,angle:0},true);
  ctx.strokeStyle='#fff2';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-p.r*Math.cos(p.cutAngle),-p.r*Math.sin(p.cutAngle));ctx.lineTo(p.r*Math.cos(p.cutAngle),p.r*Math.sin(p.cutAngle));ctx.stroke();ctx.restore();
 }
 for(const f of fruits)if(!f.dead)drawFruit(ctx,f);
 for(const p of particles){
  ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*.7,Math.atan2(p.vy,p.vx),0,7);ctx.fill();
 }
 ctx.globalAlpha=1;
 for(const r of ripples){ctx.strokeStyle=r.color;ctx.lineWidth=2;ctx.globalAlpha=r.life*2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke()}
 ctx.globalAlpha=1;
 if(trail.length>1){
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=1;i<trail.length;i++){
   const p=trail[i],a=trail[i-1],alpha=Math.max(0,1-(clock-p.t)/.2);
   ctx.globalAlpha=alpha;ctx.strokeStyle='#83f8ff';ctx.shadowColor='#5de4ff';ctx.shadowBlur=17;ctx.lineWidth=3+alpha*7;
   ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.stroke();
   ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=1+alpha*2;ctx.stroke();
  }
  const p=trail[trail.length-1];ctx.globalAlpha=Math.max(0,1-(clock-p.t)/.2);ctx.fillStyle='#fff';ctx.shadowBlur=22;ctx.shadowColor='#80eaff';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();ctx.shadowBlur=0;
 }
 ctx.globalAlpha=1;
 for(const p of floaters){
  ctx.globalAlpha=Math.min(1,p.life*3);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 '+p.size+'px system-ui';ctx.fillStyle=p.color;ctx.shadowColor='#111827';ctx.shadowBlur=10;ctx.fillText(p.text,p.x,p.y);ctx.shadowBlur=0;
 }
 ctx.globalAlpha=1;ctx.restore();
 if(flash>0){ctx.fillStyle='rgba(255,180,119,'+flash*.5+')';ctx.fillRect(0,0,W,H)}
}
function loop(now){
 const dt=Math.min(.04,Math.max(0,(now-lastFrame)/1000));lastFrame=now;update(dt);draw();requestAnimationFrame(loop);
}
$('soundBtn').onclick=()=>{state.settings.sound=!state.settings.sound;renderSettings();initAudio();if(state.settings.sound)tone(660,.12);persist();toast(t(state.settings.sound?'soundOn':'soundOff'))};
$('hapticBtn').onclick=()=>{state.settings.haptic=!state.settings.haptic;renderSettings();buzz(25);persist();toast(t(state.settings.haptic?'hapticOn':'hapticOff'))};
$('arcadeTab').onclick=()=>{mode='arcade';renderHome()};
$('zenTab').onclick=()=>{mode='zen';renderHome()};
$('playBtn').onclick=()=>{if(state.active)start(null,true);else start(mode)};
$('dailyBtn').onclick=()=>{
 if(state.active){start(null,true);toast(t('replaced'));return}
 start('daily');
};
$('resumeHome').onclick=()=>start(null,true);
$('pauseBtn').onclick=pause;
$('continueBtn').onclick=resume;
$('saveHomeBtn').onclick=()=>{saveRun();run=null;fruits=[];resetEffects();screens('home');renderHome()};
$('endBtn').onclick=()=>finish('stop');
$('againBtn').onclick=()=>start(result?result.mode:mode);
$('homeBtn').onclick=()=>{fruits=[];resetEffects();screens('home');renderHome()};
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fitText(c,text,width,start,weight=800){
 let size=start;c.font=weight+' '+size+'px system-ui';
 while(c.measureText(text).width>width&&size>12){size--;c.font=weight+' '+size+'px system-ui'}
}
async function shareResult(){
 if(!result)return;
 const btn=$('shareBtn');btn.disabled=true;btn.textContent=t('sharing');
 try{
  const r=result,c=document.createElement('canvas');c.width=1080;c.height=1350;
  const q=c.getContext('2d'),g=q.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#252b49');g.addColorStop(.65,'#121a2f');g.addColorStop(1,'#101525');q.fillStyle=g;q.fillRect(0,0,1080,1350);
  q.fillStyle='#ffffff0b';for(let x=28;x<1080;x+=48)for(let y=28;y<1350;y+=48){q.beginPath();q.arc(x,y,1.4,0,7);q.fill()}
  const glow=q.createRadialGradient(800,450,10,800,450,620);glow.addColorStop(0,'#ff789222');glow.addColorStop(1,'#ff789200');q.fillStyle=glow;q.fillRect(0,0,1080,1350);
  q.strokeStyle='#ffffff18';q.lineWidth=2;roundRect(q,38,38,1004,1274,54);q.stroke();
  q.textAlign='left';q.fillStyle='#fff4dd';q.font='italic 950 76px system-ui';q.fillText(t('name'),88,156);
  q.fillStyle='#d4ff75';q.font='800 21px system-ui';q.fillText('✦',346,138);
  drawFruit(q,{x:919,y:165,r:80,angle:-.4,kind:1});
  drawFruit(q,{x:122,y:436,r:69,angle:.45,kind:2});
  drawFruit(q,{x:934,y:785,r:95,angle:-.3,kind:0});
  q.save();q.strokeStyle='#b9faff';q.shadowColor='#7de9ff';q.shadowBlur=24;q.lineWidth=5;q.lineCap='round';q.beginPath();q.moveTo(819,848);q.quadraticCurveTo(1036,668,925,567);q.stroke();q.restore();
  q.textAlign='center';q.fillStyle='#ffbc8a';fitText(q,t('shareTag'),860,43);q.fillText(t('shareTag'),540,303);
  q.fillStyle='#aab6d0';q.font='750 24px system-ui';q.fillText(t(r.mode).toUpperCase()+'  /  '+r.day,540,370);
  q.fillStyle='#d4ff75';fitText(q,String(r.score),820,235,950);q.fillText(String(r.score),540,624);
  q.fillStyle='#e2e7f4';q.font='800 26px system-ui';q.fillText(t('points').toUpperCase(),540,682);
  if(r.record||r.dailySuccess){
   q.fillStyle='#ffbb8515';roundRect(q,235,728,610,61,22);q.fill();
   q.fillStyle='#ffbc8a';fitText(q,t(r.record?'newRecord':'dailyRecord'),560,26);q.fillText(t(r.record?'newRecord':'dailyRecord'),540,768);
  }
  q.fillStyle='#ffffff08';roundRect(q,128,861,824,174,34);q.fill();
  q.fillStyle='#fff4dd';fitText(q,t('shareStats',{f:r.sliced,c:r.maxCombo}),750,32);q.fillText(t('shareStats',{f:r.sliced,c:r.maxCombo}),540,925);
  q.fillStyle='#ffbd8a';q.font='750 27px system-ui';q.fillText('✦ '+t('shareStreak',{n:r.streak}),540,985);
  q.fillStyle='#b0bfd6';fitText(q,t('eyebrow'),850,27,600);q.fillText(t('eyebrow'),540,1135);
  q.strokeStyle='#ffffff15';q.beginPath();q.moveTo(350,1195);q.lineTo(730,1195);q.stroke();
  q.fillStyle='#8492ae';q.font='600 24px system-ui';q.fillText(t('footer'),540,1252);
  const data=c.toDataURL('image/png');
  if(window.Acornix&&Acornix.files&&Acornix.files.share){
   await Acornix.files.share('result.png',data);
  }else{
   const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));
   const file=new File([blob],'result.png',{type:'image/png'});
   if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:t('name')});
   else{
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='result.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast(t('downloaded'));
   }
  }
 }catch(e){if(e.name!=='AbortError')toast(t('shareError'))}
 finally{btn.disabled=false;btn.textContent=t('share')}
}
$('shareBtn').onclick=shareResult;
load(true);
renderHome();renderSettings();requestAnimationFrame(loop);
</script>
