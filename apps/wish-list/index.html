<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f8f6f2">
<title>Mis deseos</title>
<style>
:root{--bg:#f8f6f2;--ink:#252437;--muted:#85828f;--purple:#7560db;--line:#e9e5ef;--white:#fff;--green:#26856b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}
button{border:0;cursor:pointer}button:disabled{opacity:.55;cursor:wait}svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,a:focus-visible{outline:3px solid #b8a8ff;outline-offset:3px}
.top{max-width:700px;margin:auto;padding:calc(27px + env(safe-area-inset-top)) 22px 0}
.brandrow{display:flex;align-items:center;justify-content:space-between}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--purple);text-transform:uppercase}
h1{font-size:33px;letter-spacing:-1.4px;margin:5px 0 6px;line-height:1.2}
.sub{color:var(--muted);font-size:14px;margin:0}
.currency{display:flex;align-items:center;background:white;border:1px solid var(--line);border-radius:15px;padding:0 8px;height:43px}
.currency select{border:0;background:transparent;color:var(--ink);font-weight:700;max-width:80px;font-size:13px;outline:none}
.summary{position:relative;overflow:hidden;background:#302a49;color:white;border-radius:25px;margin-top:25px;padding:23px 24px;min-height:145px;box-shadow:0 10px 25px #302a4914}
.summary:after{content:"";width:165px;height:165px;border:1px solid #ffffff15;position:absolute;right:-45px;top:-35px;border-radius:50%;box-shadow:0 0 0 25px #ffffff05,0 0 0 50px #ffffff04;pointer-events:none}
.summarylabel{font-size:12px;color:#d0c9e5;display:flex;align-items:center;gap:7px}
.summarylabel svg{width:16px;height:16px;color:#c5b5ff}
.amount{font-size:36px;line-height:1.3;font-weight:700;letter-spacing:-1.2px;margin:5px 0 8px;overflow-wrap:anywhere;position:relative;z-index:1}
.summaryfoot{font-size:12px;color:#c8c0de;display:flex;align-items:center;gap:7px}.dot{height:6px;width:6px;background:#c3edac;border-radius:50%}
main{max-width:700px;margin:auto;padding:24px 22px calc(110px + env(safe-area-inset-bottom))}
.tools{display:flex;gap:10px;margin-bottom:18px}
.search{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;flex:1;min-width:0;padding:0 13px;height:47px}
.search svg{width:19px;color:#a09aaa;flex-shrink:0}
.search input{width:100%;min-width:0;border:0;background:transparent;outline:none;font-size:14px;color:var(--ink)}
.sort{background:white;border:1px solid var(--line);border-radius:15px;position:relative;display:flex;align-items:center;justify-content:center;width:47px;flex-shrink:0;color:var(--purple)}
.sort select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 15px}
.sectionhead h2{font-size:18px;letter-spacing:-.5px;margin:0}
.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{min-width:0;background:white;border:1px solid #eeebf1;border-radius:21px;overflow:hidden;animation:appear .3s ease;position:relative}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.photo{width:100%;aspect-ratio:1.05;position:relative;background:#eee8fa;display:block;border:0;padding:0;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{height:100%;display:flex;align-items:center;justify-content:center;background:var(--tint,#eee8fa);color:var(--tone,#a394ca)}
.placeholder svg{height:55px;width:55px;stroke-width:1.1;transform:rotate(-8deg)}
.check{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:#ffffffed;color:#a7a1b2;box-shadow:0 2px 10px #0000000a;display:flex;align-items:center;justify-content:center}
.check svg{width:18px;height:18px}
.check.done{background:var(--green);color:white}
.cardbody{padding:12px 12px 11px}
.titlebutton{padding:0;background:none;text-align:left;display:block;width:100%;font-weight:650;color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardbottom{display:flex;align-items:center;justify-content:space-between;gap:3px;margin-top:8px}
.price{font-size:15px;font-weight:750;color:var(--purple);overflow-wrap:anywhere;min-width:0}
.shoplink{height:30px;width:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#8c849e;background:#f5f2fa;border-radius:10px;text-decoration:none}
.shoplink svg{width:16px;height:16px}
.empty{grid-column:1/-1;text-align:center;padding:30px 15px 35px}
.emptyart{width:96px;height:96px;border-radius:31px;background:#ece5fa;color:var(--purple);margin:0 auto 18px;display:grid;place-items:center;transform:rotate(-6deg)}
.emptyart svg{width:44px;height:44px}
.empty h3{font-size:20px;margin:0 0 9px;letter-spacing:-.6px}
.empty p{font-size:14px;color:var(--muted);line-height:1.65;max-width:270px;margin:0 auto 20px}
.primary{color:white;background:var(--purple);border-radius:15px;min-height:50px;font-weight:700;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.primary svg{width:20px}
.bottomwrap{position:fixed;bottom:0;left:0;right:0;padding:10px 22px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%);z-index:10;pointer-events:none}
.bottom{max-width:656px;margin:auto;background:white;border:1px solid var(--line);box-shadow:0 6px 35px #302a4910;border-radius:23px;display:flex;align-items:center;padding:8px;gap:4px;pointer-events:auto}
.nav{flex:1;background:transparent;border-radius:15px;color:#9891a3;display:flex;align-items:center;justify-content:center;gap:7px;min-height:49px;font-size:12px;font-weight:650}
.nav svg{width:20px;height:20px}.nav.active{background:#f0ebfc;color:var(--purple)}
.add{height:49px;width:51px;border-radius:16px;flex-shrink:0;background:var(--purple);color:white;display:grid;place-items:center;margin-left:4px}
.overlay{position:fixed;inset:0;background:#211b3c70;backdrop-filter:blur(5px);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:600px;background:var(--bg);border-radius:28px 28px 0 0;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;padding:10px 23px calc(24px + env(safe-area-inset-bottom));animation:slide .24s ease}
@keyframes slide{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{width:37px;height:4px;border-radius:4px;background:#dad5e2;margin:0 auto 15px}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.sheethead h2{margin:0;font-size:23px;letter-spacing:-.8px}
.iconbutton{width:40px;height:40px;border-radius:50%;background:#ede9f1;display:grid;place-items:center;color:#756d84}
.photoeditor{display:flex;gap:17px;align-items:center;margin-bottom:21px}
.pickphoto{position:relative;width:94px;height:94px;flex-shrink:0;background:#eae3f8;border-radius:21px;color:var(--purple);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.pickphoto img{width:100%;height:100%;object-fit:cover}.pickphoto svg{width:30px;height:30px}
.phototext button{background:none;padding:5px 0;color:var(--purple);font-size:14px;font-weight:700;text-align:left;display:block;min-height:35px}
.phototext small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.phototext .removephoto{color:#b36373;font-size:12px;font-weight:500}
.field{display:block;margin-bottom:16px;font-size:12px;font-weight:700;color:#686174}
.field span{display:block;margin-bottom:8px}.optional{font-weight:400;color:#a39bab}
.field input{width:100%;height:52px;border:1px solid #e0dce8;border-radius:14px;background:#fff;padding:0 15px;color:var(--ink);font-size:16px;outline:none}
.field input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #7560db12}
.field input::placeholder{color:#b2abbc}
.formerror{font-size:13px;color:#b5455f;margin:0 0 12px;line-height:1.5}
.save{width:100%;margin-top:5px}
.delete{width:100%;min-height:45px;background:transparent;color:#be6575;font-size:13px;margin-top:8px}
.confirmbox{background:#fbecef;padding:14px;border-radius:14px;margin-top:15px;font-size:13px;color:#9a3b50}
.confirmbuttons{display:flex;gap:10px;margin-top:12px}.confirmbuttons button{flex:1;min-height:40px;border-radius:10px;background:white;color:#995269;font-weight:650}.confirmbuttons .danger{background:#b94e68;color:white}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:#302a49;color:white;padding:13px 19px;border-radius:14px;font-size:13px;max-width:90%;width:max-content;z-index:60;pointer-events:none;box-shadow:0 5px 20px #0002}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:550px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.sheet{border-radius:28px;margin-bottom:20px;max-height:90dvh}.overlay{align-items:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true">
<symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
<symbol id="bag" viewBox="0 0 24 24"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
<symbol id="sort" viewBox="0 0 24 24"><path d="M8 4v16m-4-4 4 4 4-4M16 4h4m-4 5h3m-3 5h2"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6L10 14"/><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="camera" viewBox="0 0 24 24"><path d="M8 5 10 3h4l2 2h4v15H4V5h4Z"/><circle cx="12" cy="12" r="4"/></symbol>
</svg>
<header class="top">
<div class="brandrow"><div><div class="eyebrow">Un capricho, un plan</div><h1>Mis deseos<span style="color:#a99bd9">.</span></h1></div>
<label class="currency" title="Moneda de tu lista"><select id="currency" aria-label="Moneda"><option value="EUR">EUR €</option><option value="USD">USD $</option><option value="MXN">MXN $</option><option value="ARS">ARS $</option><option value="COP">COP $</option><option value="CLP">CLP $</option><option value="PEN">PEN S/</option><option value="GBP">GBP £</option></select></label></div>
<p class="sub">Eso que te hace un poquito de ilusión.</p>
<section class="summary" aria-label="Resumen de tus deseos">
<div class="summarylabel"><svg><use href="#heart"/></svg> El valor de tus deseos</div>
<div class="amount" id="total">—</div>
<div class="summaryfoot"><span class="dot"></span><span id="summaryText">Preparando tu lista…</span></div>
</section>
</header>
<main>
<div class="tools"><label class="search"><svg><use href="#search"/></svg><input id="search" type="search" placeholder="Buscar un deseo…" aria-label="Buscar un deseo"></label>
<label class="sort" title="Ordenar"><svg><use href="#sort"/></svg><select id="sort" aria-label="Ordenar deseos"><option value="recent">Más recientes</option><option value="low">Menor precio</option><option value="high">Mayor precio</option><option value="name">Nombre: A–Z</option></select></label></div>
<div class="sectionhead"><h2 id="sectionTitle">Tu lista de deseos</h2><span class="count" id="count"></span></div>
<div class="grid" id="grid" aria-live="polite"></div>
</main>
<div class="bottomwrap"><nav class="bottom" aria-label="Lista de deseos">
<button class="nav active" id="pendingTab"><svg><use href="#heart"/></svg>Deseos</button>
<button class="nav" id="boughtTab"><svg><use href="#bag"/></svg>Comprados</button>
<button class="add" id="add" aria-label="Añadir un deseo"><svg><use href="#plus"/></svg></button>
</nav></div>
<div class="overlay" id="editor" hidden>
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
<div class="handle"></div>
<div class="sheethead"><h2 id="editorTitle">Un nuevo deseo</h2><button class="iconbutton" id="close" aria-label="Cerrar"><svg><use href="#close"/></svg></button></div>
<form id="form" novalidate>
<div class="photoeditor">
<button type="button" class="pickphoto" id="pickphoto" aria-label="Elegir foto de la galería"><svg><use href="#camera"/></svg></button>
<div class="phototext"><button type="button" id="choosephoto">Añadir una foto</button><small>De tu galería, para soñarlo mejor.</small><button type="button" id="removephoto" class="removephoto" hidden>Quitar foto</button></div>
<input type="file" id="file" accept="image/*" hidden>
</div>
<label class="field"><span>¿Qué te gustaría comprar?</span><input id="name" maxlength="100" placeholder="Ej. Esos auriculares…" autocomplete="off" required></label>
<label class="field"><span id="priceLabel">Precio · EUR</span><input id="price" inputmode="decimal" placeholder="0,00" maxlength="16" required></label>
<label class="field"><span>Enlace de la tienda <b class="optional">· opcional</b></span><input id="url" type="url" inputmode="url" placeholder="https://…" autocomplete="off"></label>
<p class="formerror" id="error" role="status"></p>
<button class="primary save" id="save" type="submit"><svg><use href="#plus"/></svg><span>Añadir a mis deseos</span></button>
<button type="button" class="delete" id="delete" hidden>Eliminar este deseo</button>
<div class="confirmbox" id="confirmbox" hidden>¿Quieres eliminar este deseo? No se podrá recuperar.<div class="confirmbuttons"><button type="button" id="canceldelete">Conservar</button><button type="button" id="confirmdelete" class="danger">Sí, eliminar</button></div></div>
</form>
</section>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const KEY='misDeseos.v1';
const native=!!window.Acornix;
let state={items:[],currency:'EUR',sort:'recent'},view='pending',editId=null,draftPhoto='',draftFile=null,busy=false,ready=false,toastTimer,previousFocus;
let saveChain=Promise.resolve();
const db=native?Acornix.db:{
 async get(k){const v=localStorage.getItem(k);return v?JSON.parse(v):null},
 async set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};
const icon=name=>'<svg aria-hidden="true"><use href="#'+name+'"/></svg>';
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3300)}
function persist(){
 const snapshot=JSON.parse(JSON.stringify(state));
 const job=saveChain.catch(()=>{}).then(()=>db.set(KEY,snapshot));
 saveChain=job;return job;
}
async function load(){
 try{
 const stored=await db.get(KEY);
 if(stored&&Array.isArray(stored.items))state={items:stored.items,currency:stored.currency||'EUR',sort:stored.sort||'recent'};
 $('currency').value=state.currency;$('sort').value=state.sort;
 ready=true;render();
 }catch(e){ready=true;render();toast('No se pudo cargar la lista. Inténtalo de nuevo.')}
}
function money(n){try{return new Intl.NumberFormat('es-ES',{style:'currency',currency:state.currency,maximumFractionDigits:2}).format(n)}catch(e){return n.toFixed(2)+' '+state.currency}}
function render(){
 const pending=state.items.filter(i=>!i.bought);
 $('total').textContent=money(pending.reduce((s,i)=>s+Number(i.price||0),0));
 $('summaryText').textContent=pending.length===0?'Un espacio para tus próximas ilusiones':pending.length+' '+(pending.length===1?'deseo pendiente de hacer realidad':'deseos pendientes de hacer realidad');
 $('pendingTab').classList.toggle('active',view==='pending');
 $('boughtTab').classList.toggle('active',view==='bought');
 $('pendingTab').setAttribute('aria-current',view==='pending'?'page':'false');
 $('boughtTab').setAttribute('aria-current',view==='bought'?'page':'false');
 $('sectionTitle').textContent=view==='pending'?'Tu lista de deseos':'Deseos cumplidos';
 const query=$('search').value.trim().toLocaleLowerCase('es');
 let items=state.items.filter(i=>Boolean(i.bought)===(view==='bought')&&i.name.toLocaleLowerCase('es').includes(query));
 items.sort((a,b)=>state.sort==='low'?a.price-b.price:state.sort==='high'?b.price-a.price:state.sort==='name'?a.name.localeCompare(b.name,'es'):b.created-a.created);
 $('count').textContent=items.length+' '+(items.length===1?'artículo':'artículos');
 const grid=$('grid');grid.replaceChildren();
 if(!items.length){
 const empty=document.createElement('div');empty.className='empty';
 empty.innerHTML='<div class="emptyart">'+icon(query?'search':view==='pending'?'heart':'bag')+'</div><h3></h3><p></p>';
 empty.querySelector('h3').textContent=query?'No encontramos ese deseo':view==='pending'?'Todo empieza con un deseo':'Pequeñas alegrías, cumplidas';
 empty.querySelector('p').textContent=query?'Prueba con otro nombre o borra la búsqueda.':view==='pending'?'Guarda lo que te encanta, añade su precio y tenlo todo en un solo lugar.':'Marca un deseo como comprado y aparecerá aquí. ¡Qué bien se siente!';
 if(!query&&view==='pending'){const b=document.createElement('button');b.className='primary';b.innerHTML=icon('plus')+'Mi primer deseo';b.onclick=()=>openEditor();empty.append(b)}
 grid.append(empty);return;
 }
 const colors=[['#eee7fa','#aa96ca'],['#f9e7df','#cc9b87'],['#e2eeea','#83aa9b'],['#e5ebf7','#91a6c9']];
 for(const item of items){
 const card=document.createElement('article');card.className='card';
 const photo=document.createElement('button');photo.className='photo';photo.setAttribute('aria-label','Editar '+item.name);
 const shade=colors[(item.created||0)%colors.length];photo.style.setProperty('--tint',shade[0]);photo.style.setProperty('--tone',shade[1]);
 if(item.photo){const img=document.createElement('img');img.src=item.photo;img.alt=item.name;img.loading='lazy';photo.append(img);img.onerror=()=>{photo.innerHTML='<div class="placeholder">'+icon('bag')+'</div>'}}
 else photo.innerHTML='<div class="placeholder">'+icon('bag')+'</div>';
 photo.onclick=()=>openEditor(item.id);card.append(photo);
 const check=document.createElement('button');check.className='check'+(item.bought?' done':'');check.innerHTML=icon('check');check.setAttribute('aria-label',item.bought?'Volver a deseos':'Marcar como comprado');check.setAttribute('aria-pressed',String(!!item.bought));check.onclick=()=>toggle(item.id);card.append(check);
 const body=document.createElement('div');body.className='cardbody';
 const title=document.createElement('button');title.className='titlebutton';title.textContent=item.name;title.onclick=()=>openEditor(item.id);body.append(title);
 const bottom=document.createElement('div');bottom.className='cardbottom';
 const price=document.createElement('span');price.className='price';price.textContent=money(item.price);bottom.append(price);
 if(item.url){const a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.className='shoplink';a.setAttribute('aria-label','Ver '+item.name+' en la tienda');a.innerHTML=icon('link');bottom.append(a)}
 else{const b=document.createElement('button');b.className='shoplink';b.setAttribute('aria-label','Editar '+item.name);b.innerHTML=icon('plus');b.onclick=()=>openEditor(item.id);bottom.append(b)}
 body.append(bottom);card.append(body);grid.append(card);
 }
}
async function toggle(id){
 if(busy)return;const item=state.items.find(i=>i.id===id);if(!item)return;
 busy=true;item.bought=!item.bought;render();
 try{await persist();toast(item.bought?'¡Un deseo hecho realidad!':'De vuelta en tu lista de deseos')}
 catch(e){item.bought=!item.bought;render();toast('No se pudo guardar el cambio. Inténtalo de nuevo.')}
 finally{busy=false}
}
function showPhoto(){
 const p=$('pickphoto');p.replaceChildren();
 if(draftPhoto){const img=document.createElement('img');img.src=draftPhoto;img.alt='Foto del deseo';p.append(img)}
 else p.innerHTML=icon('camera');
 $('choosephoto').textContent=draftPhoto?'Cambiar foto':'Añadir una foto';
 $('removephoto').hidden=!draftPhoto;
}
function openEditor(id){
 if(!ready||busy)return;
 previousFocus=document.activeElement;editId=id||null;
 const item=state.items.find(i=>i.id===id);
 $('form').reset();$('error').textContent='';$('confirmbox').hidden=true;$('delete').hidden=!item;
 $('editorTitle').textContent=item?'Editar deseo':'Un nuevo deseo';
 $('save').innerHTML=icon(item?'check':'plus')+'<span>'+(item?'Guardar cambios':'Añadir a mis deseos')+'</span>';
 $('priceLabel').textContent='Precio · '+state.currency;
 $('name').value=item?item.name:'';$('price').value=item?String(item.price).replace('.',','):'';$('url').value=item?item.url:'';
 draftPhoto=item?item.photo||'':'';draftFile=null;showPhoto();
 $('editor').hidden=false;document.body.style.overflow='hidden';$('close').focus();
}
function closeEditor(){
 if(busy)return;
 $('editor').hidden=true;document.body.style.overflow='';draftFile=null;
 if(previousFocus&&previousFocus.isConnected)previousFocus.focus();
}
function setBusy(value){busy=value;for(const el of $('form').querySelectorAll('button,input'))el.disabled=value;$('close').disabled=value}
async function compress(file){
 const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data});
 const scale=Math.min(1,1000/Math.max(img.width,img.height));
 const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
 const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
 return canvas.toDataURL('image/jpeg',.82);
}
$('file').onchange=async()=>{
 const file=$('file').files[0];if(!file)return;
 setBusy(true);$('error').textContent='Preparando tu foto…';
 try{draftFile=await compress(file);draftPhoto=draftFile;showPhoto();$('error').textContent=''}
 catch(e){$('error').textContent='No pudimos abrir esa foto. Prueba con otra imagen.'}
 finally{setBusy(false);$('file').value=''}
};
$('pickphoto').onclick=$('choosephoto').onclick=()=>$('file').click();
$('removephoto').onclick=()=>{draftPhoto='';draftFile=null;showPhoto()};
$('form').onsubmit=async e=>{
 e.preventDefault();if(busy)return;
 const name=$('name').value.trim();
 const raw=$('price').value.trim().replace(/\s/g,'').replace(',','.');
 const price=Number(raw);
 let url=$('url').value.trim();
 if(!name){$('error').textContent='Ponle un nombre a tu deseo.';$('name').focus();return}
 if(!raw||!Number.isFinite(price)||price<0||price>99999999999||!/^\d+(\.\d{1,2})?$/.test(raw)){$('error').textContent='Escribe un precio válido, con un máximo de dos decimales.';$('price').focus();return}
 if(url){
 try{if(!/^https?:\/\//i.test(url))url='https://'+url;const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol)||!parsed.hostname.includes('.'))throw Error();url=parsed.href}
 catch(err){$('error').textContent='Revisa el enlace de la tienda. Por ejemplo: https://tienda.es';$('url').focus();return}
 }
 setBusy(true);$('error').textContent='Guardando tu deseo…';
 const before=state.items.slice();let newFile=null;
 try{
 let photo=draftPhoto;
 if(draftFile&&native&&Acornix.files){newFile=await Acornix.files.save('deseo-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg',draftFile);photo=newFile.url}
 const old=state.items.find(i=>i.id===editId);
 const item={id:editId||(Date.now().toString(36)+Math.random().toString(36).slice(2)),name,price:Math.round(price*100)/100,url,photo,photoFile:newFile?newFile.name:(!draftFile&&photo&&old?old.photoFile||'':''),bought:old?old.bought:false,created:old?old.created:Date.now()};
 state.items=old?state.items.map(i=>i.id===editId?item:i):[item,...state.items];
 await persist();
 if(old&&old.photoFile&&old.photoFile!==item.photoFile&&native&&Acornix.files)Acornix.files.remove(old.photoFile).catch(()=>{});
 setBusy(false);closeEditor();render();toast(old?'Deseo actualizado':'Un nuevo deseo en tu lista');
 }catch(err){
 state.items=before;
 if(newFile&&native&&Acornix.files)Acornix.files.remove(newFile.name).catch(()=>{});
 $('error').textContent='No se pudo guardar. Comprueba el espacio disponible e inténtalo de nuevo.';setBusy(false);
 }
};
$('delete').onclick=()=>{$('confirmbox').hidden=false;$('confirmdelete').focus()};
$('canceldelete').onclick=()=>{$('confirmbox').hidden=true};
$('confirmdelete').onclick=async()=>{
 if(busy)return;setBusy(true);
 const before=state.items.slice(),item=state.items.find(i=>i.id===editId);
 state.items=state.items.filter(i=>i.id!==editId);
 try{await persist();if(item&&item.photoFile&&native&&Acornix.files)Acornix.files.remove(item.photoFile).catch(()=>{});setBusy(false);closeEditor();render();toast('Deseo eliminado')}
 catch(e){state.items=before;setBusy(false);$('error').textContent='No se pudo eliminar. Inténtalo de nuevo.'}
};
$('close').onclick=closeEditor;
$('editor').onclick=e=>{if(e.target===$('editor'))closeEditor()};
document.addEventListener('keydown',e=>{
 if($('editor').hidden)return;
 if(e.key==='Escape')closeEditor();
 if(e.key==='Tab'){
 const focusable=[...$('editor').querySelectorAll('button,input')].filter(el=>!el.disabled&&!el.hidden&&el.getClientRects().length);
 const first=focusable[0],last=focusable[focusable.length-1];
 if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
 }
});
$('add').onclick=()=>openEditor();
$('pendingTab').onclick=()=>{view='pending';render()};
$('boughtTab').onclick=()=>{view='bought';render()};
$('search').oninput=render;
$('currency').onchange=async()=>{
 const old=state.currency;state.currency=$('currency').value;render();
 try{await persist();toast('Moneda actualizada. Los importes no se convierten.')}
 catch(e){state.currency=old;$('currency').value=old;render();toast('No se pudo guardar la moneda')}
};
$('sort').onchange=async()=>{state.sort=$('sort').value;render();try{await persist()}catch(e){toast('No se pudo guardar el orden')}};
window.addEventListener('acornixdata',async()=>{await saveChain.catch(()=>{});if(!busy)load()});
load();
})();
</script>
