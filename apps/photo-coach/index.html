<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo Coach</title>
<style>
  :root { --bg:#f3f1ec; --card:#fff; --ink:#1f1d1a; --muted:#7f786d; --a:#2f6fed; --line:#e7e2d8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, label.btn { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  h1 { margin:0 0 4px; font-size:26px; }
  .sub { color:var(--muted); font-weight:600; margin-bottom:16px; font-size:15px; }
  .btns { display:flex; gap:10px; }
  .btn { flex:1; text-align:center; padding:15px; border-radius:16px; background:var(--a); color:#fff; font-weight:900; display:block; }
  .btn.alt { background:var(--card); color:var(--ink); border:2px solid var(--line); }
  input[type=file] { display:none; }
  .err { color:#c92a2a; font-weight:700; margin:12px 0; }
  .card { background:var(--card); border-radius:20px; padding:16px; margin-top:16px; box-shadow:0 2px 0 var(--line); }
  .photo { width:100%; border-radius:14px; display:block; }
  .head { display:flex; align-items:center; gap:14px; margin:14px 0 6px; }
  .score { width:74px; height:74px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:28px; font-weight:900; color:#fff; }
  .head h2 { margin:0; font-size:20px; }
  .head p { margin:4px 0 0; color:var(--muted); font-size:14px; line-height:1.4; }
  .bars { display:grid; gap:9px; margin:14px 0; }
  .bar { display:grid; grid-template-columns:96px 1fr 26px; gap:10px; align-items:center; font-size:13px; font-weight:800; }
  .bar .tr { height:10px; border-radius:6px; background:#eee9df; overflow:hidden; }
  .bar .tr i { display:block; height:100%; border-radius:6px; }
  .bar b { text-align:right; font-variant-numeric:tabular-nums; }
  h3 { margin:16px 0 8px; font-size:15px; }
  ul { margin:0; padding-left:0; list-style:none; display:grid; gap:8px; }
  li { padding:10px 12px; border-radius:12px; background:#f7f5f0; font-size:14px; line-height:1.45; }
  li.good::before { content:'✅ '; } li.tip::before { content:'💡 '; }
  .loading { text-align:center; padding:30px 10px; color:var(--muted); font-weight:800; }
  .loading .spin { font-size:42px; display:inline-block; animation:sp 1.4s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .hist { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .hist button { position:relative; padding:0; border-radius:12px; overflow:hidden; aspect-ratio:1; background:#ddd; }
  .hist img { width:100%; height:100%; object-fit:cover; display:block; }
  .hist span { position:absolute; right:4px; bottom:4px; padding:1px 6px; border-radius:8px; color:#fff; font-size:12px; font-weight:900; }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; font-weight:600; line-height:1.5; }
  .empty .big { font-size:54px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎓 <span id="ttl"></span></h1>
  <div class="sub" id="sub"></div>
  <div class="btns"><label class="btn"><input type="file" id="cam" accept="image/*" capture="environment">📸 <span id="lCam"></span></label><label class="btn alt"><input type="file" id="file" accept="image/*">🖼️ <span id="lGal"></span></label></div>
  <div class="err" id="err"></div>
  <div id="main"></div>
  <h3 id="lHist"></h3>
  <div class="hist" id="hist"></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Profe de Fotos', sub:'Tu IA te da nota y te enseña a mejorar cada foto', cam:'Hacer foto', gal:'Galería', hist:'Tus fotos', looking:'Mirando tu foto con lupa', noAi:'Abre esta app dentro de Acornix y conecta tu IA para usarla.', failed:'No he podido analizarla: ', good:'Lo que funciona', tips:'Para la próxima', empty:'Haz una foto y te digo qué tal está la composición, la luz y el color, con trucos para mejorarla.', cats:['Composición', 'Luz', 'Color', 'Nitidez', 'Historia'], lang:'Spanish' }
 : { title:'Photo Coach', sub:'Your AI scores each photo and teaches you how to improve it', cam:'Take photo', gal:'Gallery', hist:'Your photos', looking:'Taking a close look at your photo', noAi:'Open this app inside Acornix and connect your AI to use it.', failed:'I couldn\'t analyse it: ', good:'What works', tips:'Next time', empty:'Take a photo and I\'ll tell you how the composition, light and color work, with tricks to make it better.', cats:['Composition', 'Light', 'Color', 'Focus', 'Story'], lang:'English' };
const KEYS = ['composition', 'light', 'color', 'focus', 'story'];
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
['ttl', 'sub', 'lCam', 'lGal', 'lHist'].forEach((id, i) => $(id).textContent = [T.title, T.sub, T.cam, T.gal, T.hist][i]);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const hue = n => n >= 8 ? '#2b9348' : n >= 6 ? '#e09f3e' : '#d62828';
let hist = [];
function shrink(file, max, q) { return new Promise(res => { const img = new Image(); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); URL.revokeObjectURL(img.src); }; img.onerror = () => res(null); img.src = URL.createObjectURL(file); }); }
function show(r) {
  if (!r) { $('main').innerHTML = `<div class="empty"><div class="big">📷</div>${T.empty}</div>`; return; }
  $('main').innerHTML = `<div class="card"><img class="photo" src="${r.img}"><div class="head"><div class="score" style="background:${hue(r.score)}">${r.score}</div><div><h2>${esc(r.title)}</h2><p>${esc(r.summary)}</p></div></div>
    <div class="bars">${KEYS.map((k, i) => { const v = Math.max(0, Math.min(10, +r.scores[k] || 0)); return `<div class="bar"><span>${T.cats[i]}</span><div class="tr"><i style="width:${v * 10}%;background:${hue(v)}"></i></div><b>${v}</b></div>`; }).join('')}</div>
    <h3>${T.good}</h3><ul>${(r.good || []).map(g => `<li class="good">${esc(g)}</li>`).join('')}</ul>
    <h3>${T.tips}</h3><ul>${(r.tips || []).map(g => `<li class="tip">${esc(g)}</li>`).join('')}</ul></div>`;
}
function histUI() {
  $('lHist').hidden = !hist.length;
  $('hist').innerHTML = hist.map((h, i) => `<button data-i="${i}"><img src="${h.thumb}"><span style="background:${hue(h.score)}">${h.score}</span></button>`).join('');
  $('hist').querySelectorAll('button').forEach(b => b.onclick = () => { show(hist[+b.dataset.i]); scrollTo({ top: 0, behavior: 'smooth' }); });
}
async function analyse(file) {
  $('err').textContent = '';
  if (!window.Acornix) { $('err').textContent = T.noAi; return; }
  const img = await shrink(file, 1280, .85);
  $('main').innerHTML = `<div class="card loading"><div class="spin">🔍</div><div>${T.looking}…</div></div>`;
  try {
    const r = await Acornix.askAI('Review this photo as a friendly photography teacher.', {
      images: [img], json: true,
      system: `You are a kind but honest photography coach for beginners using a phone. Look at the photo and judge it fairly. Answer in ${T.lang}. Reply only with JSON: {"title":"a short poetic title for the photo","summary":"one sentence overall impression","score":overall 1-10,"scores":{"composition":1-10,"light":1-10,"color":1-10,"focus":1-10,"story":1-10},"good":["2 specific things that work"],"tips":["3 specific, practical tips to take a better version of THIS photo with a phone, naming concrete actions like the rule of thirds, getting lower, tapping to expose, waiting for golden hour"]}.`
    });
    if (!r || !r.scores) throw new Error('?');
    const rec = { t: Date.now(), img, thumb: await shrink(file, 240, .7), title: r.title, summary: r.summary, score: Math.max(1, Math.min(10, Math.round(+r.score || 0))), scores: r.scores, good: r.good, tips: r.tips };
    show(rec);
    // Keep the full photo only for the last few, to keep the database small.
    hist.unshift(rec); hist = hist.slice(0, 24).map((h, i) => i < 6 ? h : { ...h, img: h.thumb });
    store.set('history', hist); histUI();
    try { Acornix.vibrate(20); } catch (e) {}
  } catch (e) { show(hist[0]); $('err').textContent = T.failed + (e.message || ''); }
}
$('cam').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) analyse(f); };
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) analyse(f); };
(async () => { hist = await store.get('history', []); show(hist[0]); histUI(); })();
</script>
</body>
</html>
