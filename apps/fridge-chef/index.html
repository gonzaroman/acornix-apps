<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fridge Chef</title>
<style>
  :root { --bg:#f2fbf9; --card:#fff; --ink:#12302b; --muted:#6c8e88; --a:#0ca678; --line:#d7efe9; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, label.btn { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { max-width:600px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  h1 { margin:0 0 4px; font-size:26px; } .sub { color:var(--muted); font-weight:600; margin-bottom:14px; }
  .snap { display:block; text-align:center; padding:18px; border-radius:20px; background:var(--a); color:#fff; font-weight:900; font-size:17px; box-shadow:0 8px 22px #0ca67844; }
  input[type=file] { display:none; }
  .or { text-align:center; color:var(--muted); font-weight:700; font-size:13px; margin:10px 0; }
  .ings { display:flex; flex-wrap:wrap; gap:7px; background:var(--card); border-radius:18px; padding:12px; min-height:56px; border:2px solid var(--line); }
  .ing { padding:7px 8px 7px 12px; border-radius:20px; background:#e6f7f2; font-weight:800; font-size:14px; display:inline-flex; gap:4px; align-items:center; } .ing button { background:none; opacity:.5; padding:0 3px; }
  .ings input { flex:1; min-width:120px; border:0; outline:none; font:inherit; padding:7px 4px; background:none; color:var(--ink); }
  .lbl { font-size:12px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:14px 2px 8px; }
  .row { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; } .row::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:8px 12px; border-radius:20px; background:var(--card); border:2px solid var(--line); font-weight:800; font-size:13px; } .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .go { width:100%; margin-top:16px; padding:16px; border-radius:18px; background:var(--ink); color:#fff; font-weight:900; font-size:17px; } .go:disabled { opacity:.45; }
  .err { color:#c92a2a; font-weight:700; margin:10px 2px; font-size:14px; }
  .loading { text-align:center; padding:30px; color:var(--muted); font-weight:800; } .loading span { font-size:42px; display:inline-block; animation:st 1s infinite; } @keyframes st { 50% { transform:translateY(-8px) rotate(10deg); } }
  .rec { background:var(--card); border-radius:20px; margin-top:12px; overflow:hidden; box-shadow:0 2px 0 var(--line); }
  .rec .h { display:flex; gap:12px; align-items:center; padding:14px; cursor:pointer; } .rec .e { font-size:36px; } .rec .h div { flex:1; } .rec b { font-size:17px; display:block; } .rec small { color:var(--muted); font-weight:700; }
  .rec .miss { display:inline-block; margin-top:4px; font-size:12px; font-weight:800; color:#e8590c; }
  .rec .body { padding:0 16px 16px; display:none; } .rec.open .body { display:block; }
  .rec h4 { margin:10px 0 6px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .rec ul, .rec ol { margin:0; padding-left:20px; line-height:1.55; } .rec li { margin-bottom:4px; }
  .rec .have { color:var(--a); font-weight:700; }
  .save { margin-top:10px; padding:9px 13px; border-radius:12px; background:#e6f7f2; font-weight:800; font-size:13px; }
  h3 { margin:24px 2px 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>👨‍🍳 <span id="ttl"></span></h1>
  <div class="sub" id="sub"></div>
  <label class="snap"><input type="file" id="cam" accept="image/*" capture="environment">📸 <span id="lSnap"></span></label>
  <div class="or" id="or"></div>
  <div class="ings" id="ings"></div>
  <div class="lbl" id="lTime"></div><div class="row" id="time"></div>
  <div class="lbl" id="lMood"></div><div class="row" id="mood"></div>
  <button class="go" id="go"></button>
  <div class="err" id="err"></div>
  <div id="out"></div>
  <h3 id="lSaved" hidden></h3><div id="saved"></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Chef de nevera', sub:'Haz una foto de tu nevera y te digo qué cocinar con lo que tienes', snap:'Foto de la nevera', or:'o escribe lo que tienes', add:'Añade un ingrediente…', time:'Tiempo', times:['⚡ 15 min', '⏱ 30 min', '🍲 Sin prisa'], mood:'Me apetece', moods:['😋 Lo que sea', '🥗 Ligero', '🍝 Reconfortante', '🌶️ Picante', '🌱 Vegetariano', '👶 Para niños'], go:'✨ ¿Qué cocino?', looking:'Mirando tu nevera…', cooking:'Pensando recetas…', noAi:'Abre esta app dentro de Acornix y conecta tu IA para usarla.', failed:'No he podido: ', have:'Tienes', need:'Te falta', steps:'Pasos', min:'min', missing:n => n ? `Te faltan ${n}` : '¡Lo tienes todo!', save:'⭐ Guardar receta', saved:'Recetas guardadas', del:'✕ Quitar', lang:'Spanish (Spain)' }
 : { title:'Fridge Chef', sub:'Snap your fridge and I\'ll tell you what to cook with what you have', snap:'Photo of my fridge', or:'or type what you have', add:'Add an ingredient…', time:'Time', times:['⚡ 15 min', '⏱ 30 min', '🍲 No rush'], mood:'In the mood for', moods:['😋 Anything', '🥗 Light', '🍝 Comfort', '🌶️ Spicy', '🌱 Veggie', '👶 Kid-friendly'], go:'✨ What can I cook?', looking:'Looking in your fridge…', cooking:'Thinking of recipes…', noAi:'Open this app inside Acornix and connect your AI to use it.', failed:'Couldn\'t do it: ', have:'You have', need:'You need', steps:'Steps', min:'min', missing:n => n ? `Missing ${n}` : 'You have everything!', save:'⭐ Save recipe', saved:'Saved recipes', del:'✕ Remove', lang:'English' };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
['ttl', 'sub', 'lSnap', 'or', 'lTime', 'lMood', 'go', 'lSaved'].forEach((id, i) => $(id).textContent = [T.title, T.sub, T.snap, T.or, T.time, T.mood, T.go, T.saved][i]);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let ings = [], time = 1, mood = 0, recs = [], saved = [];
function ingUI() {
  $('ings').innerHTML = ings.map((x, i) => `<span class="ing">${esc(x)}<button data-i="${i}">✕</button></span>`).join('') + `<input id="ni" placeholder="${T.add}" maxlength="30">`;
  $('ings').querySelectorAll('button').forEach(b => b.onclick = () => { ings.splice(+b.dataset.i, 1); store.set('ings', ings); ingUI(); });
  $('ni').onkeydown = e => { if ((e.key === 'Enter' || e.key === ',') && $('ni').value.trim()) { e.preventDefault(); ings.push($('ni').value.trim().replace(/,$/, '')); store.set('ings', ings); ingUI(); $('ni').focus(); } };
  $('ni').onblur = () => { if ($('ni').value.trim()) { ings.push($('ni').value.trim()); store.set('ings', ings); ingUI(); } };
  $('go').disabled = !ings.length;
}
function chips(id, list, get, set) { $(id).innerHTML = list.map((x, i) => `<button class="chip ${i === get() ? 'on' : ''}" data-i="${i}">${x}</button>`).join(''); $(id).querySelectorAll('.chip').forEach(b => b.onclick = () => { set(+b.dataset.i); chips(id, list, get, set); }); }
function card(r, i, list) {
  return `<div class="rec" data-l="${list}" data-i="${i}"><div class="h"><div class="e">${esc(r.emoji || '🍽️')}</div><div><b>${esc(r.name)}</b><small>⏱ ${esc(r.minutes)} ${T.min} · ${esc(r.why || '')}</small><br><span class="miss" style="${r.missing && r.missing.length ? '' : 'color:#0ca678'}">${T.missing((r.missing || []).length)}</span></div></div>
    <div class="body"><h4>${T.have}</h4><ul>${(r.uses || []).map(x => `<li class="have">${esc(x)}</li>`).join('')}</ul>${r.missing && r.missing.length ? `<h4>${T.need}</h4><ul>${r.missing.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}<h4>${T.steps}</h4><ol>${(r.steps || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol><button class="save">${list === 's' ? T.del : T.save}</button></div></div>`;
}
function render() {
  $('out').innerHTML = recs.map((r, i) => card(r, i, 'r')).join('');
  $('saved').innerHTML = saved.map((r, i) => card(r, i, 's')).join(''); $('lSaved').hidden = !saved.length;
  document.querySelectorAll('.rec .h').forEach(h => h.onclick = () => h.parentElement.classList.toggle('open'));
  document.querySelectorAll('.rec .save').forEach(b => b.onclick = () => { const c = b.closest('.rec'), i = +c.dataset.i; if (c.dataset.l === 's') saved.splice(i, 1); else saved.unshift(recs[i]); store.set('saved', saved.slice(0, 40)); render(); try { window.Acornix && Acornix.vibrate(10); } catch (e) {} });
}
function shrink(file, max) { return new Promise(res => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .85)); URL.revokeObjectURL(im.src); }; im.src = URL.createObjectURL(file); }); }
$('cam').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return; $('err').textContent = '';
  if (!window.Acornix) { $('err').textContent = T.noAi; return; }
  $('out').innerHTML = `<div class="loading"><span>🔍</span><div>${T.looking}</div></div>`;
  try {
    const r = await Acornix.askAI('List the food ingredients you can see.', { images: [await shrink(f, 1280)], json: true, system: `List the food ingredients visible in this photo of a fridge, pantry or table, as short generic names in ${T.lang} (e.g. "eggs", "spinach"), without brands. Reply only with JSON: {"ingredients":[""]}` });
    const got = (r && r.ingredients || []).map(String).filter(Boolean); if (!got.length) throw new Error('?');
    ings = [...new Set([...ings, ...got])]; store.set('ings', ings); ingUI(); $('out').innerHTML = ''; cook();
  } catch (er) { $('out').innerHTML = ''; $('err').textContent = T.failed + (er.message || ''); }
};
async function cook() {
  $('err').textContent = ''; if (!ings.length) return;
  if (!window.Acornix) { $('err').textContent = T.noAi; return; }
  $('go').disabled = true; $('out').innerHTML = `<div class="loading"><span>🍳</span><div>${T.cooking}</div></div>`;
  try {
    const r = await Acornix.askAI(`I have: ${ings.join(', ')}. Time: ${T.times[time]}. Mood: ${T.moods[mood]}.`, { json: true, system: `You are a resourceful home chef. Suggest 3 different recipes that use mostly the ingredients I have, assuming basic staples (salt, oil, pepper, water). Keep missing ingredients to a minimum. Clear numbered steps. Write in ${T.lang}. Reply only with JSON: {"recipes":[{"emoji":"","name":"","minutes":number,"why":"few words","uses":["ingredient I have with amount"],"missing":["item"],"steps":[""]}]}` });
    recs = (r && r.recipes || []).slice(0, 4); if (!recs.length) throw new Error('?'); render(); const first = document.querySelector('#out .rec'); if (first) first.classList.add('open');
    try { Acornix.vibrate(20); } catch (e) {}
  } catch (e) { $('out').innerHTML = ''; $('err').textContent = T.failed + (e.message || ''); }
  $('go').disabled = !ings.length;
}
$('go').onclick = cook;
(async () => { ings = await store.get('ings', []); saved = await store.get('saved', []); ingUI(); chips('time', T.times, () => time, v => time = v); chips('mood', T.moods, () => mood, v => mood = v); render(); })();
</script>
</body>
</html>
