<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Outfit Advisor</title>
<style>
  :root { --bg:#faf7f5; --card:#fff; --ink:#1c1917; --muted:#8a817c; --a:#7c3aed; --line:#ece6e1; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, label.btn { font:inherit; color:inherit; border:0; cursor:pointer; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  h1 { margin:0 0 4px; font-size:26px; } .sub { color:var(--muted); font-weight:600; margin-bottom:14px; }
  .lbl { font-size:12px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:4px 2px 8px; }
  .row { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; margin-bottom:14px; } .row::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:8px 12px; border-radius:20px; background:var(--card); border:2px solid var(--line); font-weight:800; font-size:14px; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .btns { display:flex; gap:10px; }
  .btn { flex:1; text-align:center; padding:15px; border-radius:16px; background:var(--a); color:#fff; font-weight:900; display:block; }
  .btn.alt { background:var(--card); color:var(--ink); border:2px solid var(--line); }
  input[type=file] { display:none; }
  .err { color:#c92a2a; font-weight:700; margin:12px 2px; }
  .card { background:var(--card); border-radius:22px; overflow:hidden; margin-top:16px; box-shadow:0 2px 0 var(--line); }
  .card .ph { position:relative; } .card .ph img { width:100%; max-height:58vh; object-fit:cover; display:block; }
  .card .score { position:absolute; right:12px; bottom:12px; padding:8px 14px; border-radius:16px; background:#000b; color:#fff; font-weight:900; font-size:22px; backdrop-filter:blur(6px); }
  .card .body { padding:16px; }
  .card h2 { margin:0 0 6px; font-size:20px; } .card .verdict { color:#57534e; line-height:1.45; margin:0 0 12px; }
  .card h3 { margin:14px 0 8px; font-size:15px; }
  ul { margin:0; padding:0; list-style:none; display:grid; gap:7px; } li { padding:10px 12px; border-radius:12px; background:#f6f3f0; font-size:14px; line-height:1.4; }
  .pal { display:flex; gap:8px; } .pal div { flex:1; text-align:center; font-size:11px; font-weight:800; color:var(--muted); } .pal i { display:block; height:40px; border-radius:12px; margin-bottom:4px; border:1px solid #0001; }
  .loading { text-align:center; padding:40px 10px; color:var(--muted); font-weight:800; } .loading span { font-size:40px; display:inline-block; animation:sw 1.4s ease-in-out infinite; }
  @keyframes sw { 0%,100% { transform:rotate(-12deg); } 50% { transform:rotate(12deg); } }
  .hist { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
  .hist button { position:relative; aspect-ratio:3/4; border-radius:12px; overflow:hidden; padding:0; background:#ddd; }
  .hist img { width:100%; height:100%; object-fit:cover; display:block; } .hist span { position:absolute; left:4px; bottom:4px; padding:1px 7px; border-radius:8px; background:#000a; color:#fff; font-size:12px; font-weight:900; }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; font-weight:600; line-height:1.5; } .empty .big { font-size:56px; }
  .tip { color:var(--muted); font-size:12px; text-align:center; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>👗 <span id="ttl"></span></h1>
  <div class="sub" id="sub"></div>
  <div class="lbl" id="lFor"></div><div class="row" id="occ"></div>
  <div class="btns"><label class="btn"><input type="file" id="cam" accept="image/*" capture="user">🤳 <span id="lCam"></span></label><label class="btn alt"><input type="file" id="file" accept="image/*">🖼️ <span id="lGal"></span></label></div>
  <div class="err" id="err"></div>
  <div id="main"></div>
  <h3 id="lHist" style="margin:22px 2px 0"></h3><div class="hist" id="hist"></div>
  <div class="tip" id="tip"></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Asesor de estilo', sub:'Hazte una foto con tu ropa y tu IA te da una opinión sincera (y amable)', for:'¿Para qué es?', occ:['☀️ Día a día', '💼 Trabajo', '🍷 Cita', '🎉 Fiesta', '💍 Boda', '🏃 Deporte', '✈️ Viaje', '🎓 Entrevista'], cam:'Foto', gal:'Galería', looking:'Mirando tu look', noAi:'Abre esta app dentro de Acornix y conecta tu IA para usarla.', failed:'No he podido: ', works:'Lo que funciona', try:'Prueba a…', colors:'Colores que te van con esto', hist:'Tus looks', empty:'Elige la ocasión y hazte una foto de cuerpo entero frente a un espejo.', tip:'Las fotos solo se guardan en tu móvil.', lang:'Spanish (Spain)' }
 : { title:'Outfit Advisor', sub:'Snap your outfit and your AI gives you an honest (and kind) opinion', for:'What is it for?', occ:['☀️ Everyday', '💼 Work', '🍷 Date', '🎉 Party', '💍 Wedding', '🏃 Sport', '✈️ Travel', '🎓 Interview'], cam:'Photo', gal:'Gallery', looking:'Looking at your outfit', noAi:'Open this app inside Acornix and connect your AI to use it.', failed:'Couldn\'t do it: ', works:'What works', try:'Try…', colors:'Colours that go with it', hist:'Your looks', empty:'Pick the occasion and take a full-length photo in front of a mirror.', tip:'Photos are only kept on your phone.', lang:'English' };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
['ttl', 'sub', 'lFor', 'lCam', 'lGal', 'lHist', 'tip'].forEach((id, i) => $(id).textContent = [T.title, T.sub, T.for, T.cam, T.gal, T.hist, T.tip][i]);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let occ = 0, hist = [];
function occUI() { $('occ').innerHTML = T.occ.map((o, i) => `<button class="chip ${i === occ ? 'on' : ''}" data-i="${i}">${o}</button>`).join(''); $('occ').querySelectorAll('.chip').forEach(b => b.onclick = () => { occ = +b.dataset.i; occUI(); }); }
function shrink(file, max, q) { return new Promise(res => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); URL.revokeObjectURL(im.src); }; im.onerror = () => res(null); im.src = URL.createObjectURL(file); }); }
function show(r) {
  if (!r) { $('main').innerHTML = `<div class="empty"><div class="big">🪞</div>${T.empty}</div>`; return; }
  $('main').innerHTML = `<div class="card"><div class="ph"><img src="${r.img}"><div class="score">${r.score}/10</div></div><div class="body"><h2>${esc(r.title)}</h2><p class="verdict">${esc(r.verdict)}</p>
    <h3>✅ ${T.works}</h3><ul>${(r.good || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <h3>💡 ${T.try}</h3><ul>${(r.tips || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    ${r.colors && r.colors.length ? `<h3>🎨 ${T.colors}</h3><div class="pal">${r.colors.filter(c => /^#[0-9a-f]{6}$/i.test(c.hex)).slice(0, 5).map(c => `<div><i style="background:${c.hex}"></i>${esc(c.name)}</div>`).join('')}</div>` : ''}</div></div>`;
}
function histUI() {
  $('lHist').hidden = !hist.length;
  $('hist').innerHTML = hist.map((h, i) => `<button data-i="${i}"><img src="${h.thumb}"><span>${h.score}</span></button>`).join('');
  $('hist').querySelectorAll('button').forEach(b => b.onclick = () => { show(hist[+b.dataset.i]); scrollTo({ top: 0, behavior: 'smooth' }); });
}
async function analyse(f) {
  $('err').textContent = '';
  if (!window.Acornix) { $('err').textContent = T.noAi; return; }
  const img = await shrink(f, 1100, .85);
  $('main').innerHTML = `<div class="card loading"><span>👗</span><div>${T.looking}…</div></div>`;
  try {
    const r = await Acornix.askAI(`Give me feedback on this outfit for: ${T.occ[occ]}.`, { images: [img], json: true,
      system: `You are a warm, honest personal stylist. Comment only on the clothes, colours, fit and accessories for the occasion, never on the person's body, weight or looks. Be specific to what you see and encouraging. Answer in ${T.lang}. Reply only with JSON: {"title":"a short catchy name for the look","score":1-10 for the occasion,"verdict":"one or two sentences","good":["2 specific things that work"],"tips":["3 practical tweaks using common items, like swapping shoes, adding a belt, rolling sleeves"],"colors":[{"hex":"#rrggbb","name":"colour name"}]} with 4 colours that would pair well with this outfit.` });
    if (!r || !r.verdict) throw new Error('?');
    const rec = { t: Date.now(), img, thumb: await shrink(f, 240, .7), occ, title: r.title, score: Math.max(1, Math.min(10, Math.round(+r.score || 0))), verdict: r.verdict, good: r.good, tips: r.tips, colors: r.colors || [] };
    show(rec); hist.unshift(rec); hist = hist.slice(0, 24).map((h, i) => i < 6 ? h : { ...h, img: h.thumb }); store.set('looks', hist); histUI();
    try { Acornix.vibrate(20); } catch (e) {}
  } catch (e) { show(hist[0]); $('err').textContent = T.failed + (e.message || ''); }
}
$('cam').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) analyse(f); };
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) analyse(f); };
(async () => { hist = await store.get('looks', []); occUI(); show(hist[0]); histUI(); })();
</script>
</body>
</html>
