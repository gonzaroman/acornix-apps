<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tasks</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1d2033; --muted:#8a8fa8; --line:#e8eaf3; --a:#5b5bf5; --hi:#ef4444; --md:#f59e0b; --lo:#10b981; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, input, select { font:inherit; color:inherit; border:0; }
  button { cursor:pointer; background:none; }
  #app { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 100px); }
  header h1 { margin:0; font-size:30px; letter-spacing:-.5px; }
  header p { margin:2px 0 12px; color:var(--muted); font-weight:600; }
  .lists { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
  .lists::-webkit-scrollbar { display:none; }
  .lst { flex:none; padding:8px 14px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-weight:700; font-size:14px; }
  .lst.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .lst small { opacity:.6; margin-left:4px; }
  .progress { height:8px; background:var(--line); border-radius:4px; margin:10px 0 16px; overflow:hidden; }
  .progress i { display:block; height:100%; background:linear-gradient(90deg,var(--a),#a855f7); transition:width .4s; }
  .group h3 { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:16px 4px 8px; }
  .task { display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:16px; background:var(--card); margin-bottom:8px; box-shadow:0 1px 0 var(--line); border-left:4px solid transparent; }
  .task.p3 { border-left-color:var(--hi); } .task.p2 { border-left-color:var(--md); } .task.p1 { border-left-color:var(--lo); }
  .check { width:26px; height:26px; border-radius:50%; border:2px solid #c9cce0; flex:none; display:grid; place-items:center; color:#fff; font-size:14px; transition:.2s; }
  .task.done .check { background:var(--a); border-color:var(--a); }
  .task .txt { flex:1; min-width:0; }
  .task .txt b { display:block; font-weight:600; word-break:break-word; }
  .task.done .txt b { text-decoration:line-through; color:var(--muted); }
  .task .due { font-size:12px; color:var(--muted); font-weight:600; }
  .task .due.late { color:var(--hi); }
  .task .del { color:#c3c6d8; font-size:18px; padding:4px; }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }
  .composer { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 12px calc(env(safe-area-inset-bottom) + 10px); }
  .composer form { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
  .composer .row { display:flex; gap:8px; align-items:center; }
  .composer input[type=text] { flex:1; padding:13px 14px; border-radius:14px; background:var(--bg); outline:none; }
  .composer .add { width:48px; height:48px; border-radius:14px; background:var(--a); color:#fff; font-size:24px; }
  .opts { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .pri { padding:6px 10px; border-radius:999px; background:var(--bg); font-size:13px; font-weight:700; }
  .pri.on { color:#fff; }
  .pri.on[data-p="3"] { background:var(--hi); } .pri.on[data-p="2"] { background:var(--md); } .pri.on[data-p="1"] { background:var(--lo); }
  .opts input[type=date] { padding:5px 8px; border-radius:10px; background:var(--bg); font-size:13px; }
  .opts select { padding:6px 8px; border-radius:10px; background:var(--bg); font-size:13px; }
</style>
</head>
<body>
<div id="app">
  <header><h1 id="ttl"></h1><p id="sub"></p></header>
  <div class="lists" id="lists"></div>
  <div class="progress"><i id="prog" style="width:0"></i></div>
  <div id="groups"></div>
</div>
<div class="composer"><form id="form"><div class="row"><input type="text" id="text" maxlength="120" autocomplete="off"><button class="add">+</button></div>
  <div class="opts"><button type="button" class="pri" data-p="3">🔴</button><button type="button" class="pri" data-p="2">🟠</button><button type="button" class="pri" data-p="1">🟢</button><input type="date" id="due"><select id="listSel"></select></div></form></div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Tareas', add:'Añadir una tarea…', today:'Hoy', overdue:'Atrasadas', upcoming:'Próximas', someday:'Sin fecha', done:'Hechas', all:'Todas', lists:['📥 Personal','💼 Trabajo','🛒 Compras'], empty:'Nada pendiente. ¡Disfruta! ✨', left:n => n === 1 ? 'Te queda 1 tarea' : `Te quedan ${n} tareas`, allDone:'¡Todo hecho! 🎉', tomorrow:'Mañana' }
 : { title:'Tasks', add:'Add a task…', today:'Today', overdue:'Overdue', upcoming:'Upcoming', someday:'No date', done:'Done', all:'All', lists:['📥 Personal','💼 Work','🛒 Shopping'], empty:'Nothing to do. Enjoy! ✨', left:n => n === 1 ? '1 task left' : `${n} tasks left`, allDone:'All done! 🎉', tomorrow:'Tomorrow' };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
$('ttl').textContent = T.title; $('text').placeholder = T.add;
let tasks = [], list = -1, pri = 2;
const day = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
const today = () => day(Date.now());
function save() { store.set('tasks', tasks); }
function fmtDue(d) { const t = day(d), n = today(); if (t === n) return T.today; if (t === n + 864e5) return T.tomorrow; return new Date(d).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }); }
function render() {
  $('lists').innerHTML = '';
  [[-1, T.all], ...T.lists.map((l, i) => [i, l])].forEach(([i, name]) => {
    const n = tasks.filter(t => !t.done && (i < 0 || t.list === i)).length;
    const b = document.createElement('button'); b.className = 'lst' + (i === list ? ' on' : ''); b.innerHTML = `${name}<small>${n || ''}</small>`;
    b.onclick = () => { list = i; render(); }; $('lists').appendChild(b);
  });
  $('listSel').innerHTML = T.lists.map((l, i) => `<option value="${i}">${l}</option>`).join(''); $('listSel').value = Math.max(0, list);
  document.querySelectorAll('.pri').forEach(b => b.classList.toggle('on', +b.dataset.p === pri));
  const mine = tasks.filter(t => list < 0 || t.list === list), open = mine.filter(t => !t.done);
  $('sub').textContent = open.length ? T.left(open.length) : mine.length ? T.allDone : '';
  $('prog').style.width = mine.length ? (mine.length - open.length) / mine.length * 100 + '%' : '0';
  const n = today(), groups = [
    [T.overdue, open.filter(t => t.due && day(t.due) < n)], [T.today, open.filter(t => t.due && day(t.due) === n)],
    [T.upcoming, open.filter(t => t.due && day(t.due) > n)], [T.someday, open.filter(t => !t.due)], [T.done, mine.filter(t => t.done).slice(0, 30)]];
  const box = $('groups'); box.innerHTML = '';
  if (!mine.length) { box.innerHTML = `<div class="empty">${T.empty}</div>`; return; }
  groups.forEach(([name, items]) => {
    if (!items.length) return;
    items.sort((a, b) => (b.pri - a.pri) || ((a.due || 9e15) - (b.due || 9e15)));
    const g = document.createElement('div'); g.className = 'group'; g.innerHTML = `<h3>${name} · ${items.length}</h3>`;
    items.forEach(t => {
      const d = document.createElement('div'); d.className = `task p${t.pri}` + (t.done ? ' done' : '');
      d.innerHTML = `<button class="check">${t.done ? '✓' : ''}</button><div class="txt"><b></b>${t.due ? `<span class="due ${!t.done && day(t.due) < n ? 'late' : ''}">📅 ${fmtDue(t.due)}</span>` : ''}${list < 0 ? ` <span class="due">${T.lists[t.list].split(' ')[0]}</span>` : ''}</div><button class="del">✕</button>`;
      d.querySelector('b').textContent = t.text;
      d.querySelector('.check').onclick = () => { t.done = !t.done; t.doneAt = Date.now(); if (t.done) buzz(15); save(); render(); };
      d.querySelector('.del').onclick = () => { tasks = tasks.filter(x => x !== t); save(); render(); };
      g.appendChild(d);
    });
    box.appendChild(g);
  });
}
function buzz(p) { try { if (window.Acornix) Acornix.vibrate(p); else if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
document.querySelectorAll('.pri').forEach(b => b.onclick = () => { pri = +b.dataset.p; render(); });
$('form').onsubmit = e => {
  e.preventDefault(); const text = $('text').value.trim(); if (!text) return;
  tasks.unshift({ id: Date.now(), text, pri, due: $('due').value ? new Date($('due').value + 'T12:00').getTime() : null, list: +$('listSel').value, done: false });
  $('text').value = ''; $('due').value = ''; save(); render();
};
window.addEventListener('acornixdata', async () => { tasks = await store.get('tasks', []); render(); });
(async () => { tasks = await store.get('tasks', []); render(); })();
</script>
</body>
</html>
