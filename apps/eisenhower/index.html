<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Priority Matrix</title>
<style>
  :root { --ink:#1f2333; --muted:#7c8196; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#f3f4f8; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, input { font:inherit; color:inherit; border:0; }
  button { cursor:pointer; background:none; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px); gap:10px; }
  header { display:flex; align-items:baseline; justify-content:space-between; padding:0 4px; }
  header h1 { margin:0; font-size:22px; }
  header small { color:var(--muted); font-weight:700; }
  .axes { display:grid; grid-template-columns:repeat(2,1fr); text-align:center; font-size:11px; font-weight:800; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
  #grid { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px; min-height:0; }
  .q { border-radius:20px; padding:10px; display:flex; flex-direction:column; min-height:0; }
  .q h2 { margin:0 0 2px; font-size:14px; display:flex; justify-content:space-between; }
  .q p { margin:0 0 6px; font-size:11px; font-weight:700; opacity:.7; }
  .q .items { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:5px; }
  .item { background:#ffffffcc; border-radius:10px; padding:8px 9px; font-size:13px; font-weight:600; text-align:left; word-break:break-word; }
  .item.sel { outline:2px solid var(--ink); }
  .q0 { background:#ffd6d6; } .q1 { background:#d6e8ff; } .q2 { background:#fff0c7; } .q3 { background:#e3e5ea; }
  form { display:flex; gap:8px; }
  form input { flex:1; padding:13px 14px; border-radius:14px; background:#fff; outline:none; }
  form select { border:0; border-radius:14px; background:#fff; padding:0 8px; font:inherit; font-weight:700; }
  form button { width:48px; border-radius:14px; background:var(--ink); color:#fff; font-size:22px; }
  #menu { position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:22px 22px 0 0; padding:14px 14px calc(env(safe-area-inset-bottom) + 14px); box-shadow:0 -10px 30px #0002; transform:translateY(110%); transition:transform .25s; z-index:5; }
  #menu.on { transform:none; }
  #menu b { display:block; margin:2px 4px 10px; }
  .mrow { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .mrow button { padding:12px; border-radius:12px; font-weight:800; font-size:13px; }
</style>
</head>
<body>
<div id="app">
  <header><h1>🧭 <span id="ttl"></span></h1><small id="cnt"></small></header>
  <div class="axes"><span id="axU"></span><span id="axN"></span></div>
  <div id="grid"></div>
  <form id="form"><input id="text" maxlength="80" autocomplete="off"><select id="qsel"></select><button>+</button></form>
</div>
<div id="menu"><b id="mTitle"></b><div class="mrow" id="mrow"></div></div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Prioridades', urgent:'Urgente', notUrgent:'No urgente', add:'Nueva tarea…', done:'✓ Hecha', del:'🗑 Borrar', left:'pendientes',
  qs:[['🔥 Hazlo ya','Importante y urgente'],['📅 Planifícalo','Importante, no urgente'],['🤝 Delégalo','Urgente, no importante'],['🗑️ Elimínalo','Ni urgente ni importante']], short:['Hacer','Planificar','Delegar','Eliminar'],
  samples:[[0,'Entregar el informe'],[1,'Hacer ejercicio 3 veces'],[1,'Aprender inglés'],[2,'Contestar correos'],[3,'Mirar redes sociales']] }
 : { title:'Priorities', urgent:'Urgent', notUrgent:'Not urgent', add:'New task…', done:'✓ Done', del:'🗑 Delete', left:'to do',
  qs:[['🔥 Do it now','Important and urgent'],['📅 Schedule it','Important, not urgent'],['🤝 Delegate it','Urgent, not important'],['🗑️ Drop it','Neither']], short:['Do','Schedule','Delegate','Drop'],
  samples:[[0,'Hand in the report'],[1,'Exercise 3 times a week'],[1,'Learn a language'],[2,'Answer emails'],[3,'Scroll social media']] };
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
$('ttl').textContent = T.title; $('axU').textContent = T.urgent; $('axN').textContent = T.notUrgent; $('text').placeholder = T.add;
$('qsel').innerHTML = T.short.map((s, i) => `<option value="${i}">${T.qs[i][0].split(' ')[0]} ${s}</option>`).join('');
let items = [], sel = null;
// Quadrants on screen: urgent+important, important, urgent, neither (the left column is the urgent one).
function save() { store.set('items', items); }
function render() {
  $('grid').innerHTML = '';
  [0, 1, 2, 3].forEach(q => {
    const div = document.createElement('div'); div.className = 'q q' + q;
    const mine = items.filter(i => i.q === q);
    div.innerHTML = `<h2>${T.qs[q][0]}<span>${mine.length || ''}</span></h2><p>${T.qs[q][1]}</p><div class="items"></div>`;
    mine.forEach(it => { const b = document.createElement('button'); b.className = 'item' + (it === sel ? ' sel' : ''); b.textContent = it.t; b.onclick = () => openMenu(it); div.querySelector('.items').appendChild(b); });
    div.onclick = e => { if (e.target === div || e.target.tagName === 'P' || e.target.tagName === 'H2') { $('qsel').value = q; $('text').focus(); } };
    $('grid').appendChild(div);
  });
  $('cnt').textContent = items.length + ' ' + T.left;
}
function openMenu(it) {
  sel = it; render(); $('mTitle').textContent = it.t;
  $('mrow').innerHTML = `<button style="background:#d9f5e3">${T.done}</button><button style="background:#f3f4f8">${T.del}</button>` + T.short.map((s, i) => i === it.q ? '' : `<button class="q${i}" data-q="${i}">→ ${T.qs[i][0].split(' ')[0]} ${s}</button>`).join('');
  const [doneB, delB] = $('mrow').children;
  doneB.onclick = () => { items = items.filter(x => x !== it); buzz(20); close(); };
  delB.onclick = () => { items = items.filter(x => x !== it); close(); };
  $('mrow').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { it.q = +b.dataset.q; close(); });
  $('menu').classList.add('on');
}
function close() { sel = null; $('menu').classList.remove('on'); save(); render(); }
document.addEventListener('pointerdown', e => { if ($('menu').classList.contains('on') && !e.target.closest('#menu') && !e.target.closest('.item')) { sel = null; $('menu').classList.remove('on'); render(); } });
function buzz(p) { try { if (window.Acornix) Acornix.vibrate(p); else if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
$('form').onsubmit = e => { e.preventDefault(); const t = $('text').value.trim(); if (!t) return; items.push({ t, q: +$('qsel').value }); $('text').value = ''; save(); render(); };
(async () => { items = await store.get('items', null); if (!items) { items = T.samples.map(([q, t]) => ({ q, t })); save(); } render(); })();
</script>
</body>
</html>
