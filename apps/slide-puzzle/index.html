<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fff9ef">
<title>Pequeño rompecabezas</title>
<style>
:root{--ink:#37334f;--muted:#8b849b;--purple:#7961d9;--paper:#fff9ef;--border:#e9e1f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid #a18bea;outline-offset:3px}
.app{width:min(100%,480px);margin:auto;padding:calc(16px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));min-height:100dvh}
header{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.logo{width:44px;height:44px;border-radius:15px;background:#ebe2ff;display:grid;place-items:center;font-size:27px;transform:rotate(-6deg)}
.brand{flex:1}.brand strong{display:block;font-size:19px;letter-spacing:-.6px}.brand span{font-size:12px;color:var(--muted)}
.icon-btn{border:1px solid var(--border);background:#fffdf9;width:44px;height:44px;border-radius:15px;font-size:20px;display:grid;place-items:center}
h1{font-size:29px;line-height:1.15;letter-spacing:-1px;margin:0 0 7px}
.intro{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.5}
.section-title{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#9990a9;margin-bottom:9px}
.pictures{display:flex;gap:10px;margin-bottom:18px}
.picture{flex:1;min-width:0;background:#fffdf9;border:2px solid #eee6db;border-radius:18px;padding:7px 6px 8px;position:relative;transition:.2s}
.picture.selected{border-color:var(--purple);background:#f0eaff;box-shadow:0 3px 0 #e4dafa}
.picture img{display:block;width:100%;height:60px;object-fit:contain;border-radius:10px;margin-bottom:5px}
.picture span{font-size:12px;font-weight:750}
.check{position:absolute;top:4px;right:4px;background:var(--purple);color:white;border-radius:50%;width:19px;height:19px;font-size:12px;display:grid;place-items:center}
.settings{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px;gap:8px}
.levels{display:flex;padding:4px;background:#eee9e3;border-radius:14px;gap:3px}
.levels button{padding:9px 15px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:750}
.levels button.active{background:white;box-shadow:0 2px 4px #5c426010;color:var(--purple)}
.preview-btn{background:transparent;border:0;color:var(--purple);padding:12px 0 12px 10px;font-size:12px;font-weight:750}
.stats{display:flex;gap:10px;margin-bottom:15px}
.stat{background:#fffdf9;border:1px solid #ece4da;border-radius:15px;flex:1;display:flex;align-items:center;gap:10px;padding:10px 13px}
.stat-icon{background:#fff0d5;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.stat:nth-child(2) .stat-icon{background:#eae5ff}
.stat small{display:block;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:750}
.stat strong{font-size:21px;font-variant-numeric:tabular-nums;line-height:1.25}
.board-shell{padding:8px;background:#e7d9c8;border-radius:23px;box-shadow:0 7px 0 #d7c6b2,0 14px 25px #725d3420;position:relative}
.board{position:relative;width:100%;aspect-ratio:1;border-radius:16px;background:#f5ece0;overflow:hidden;touch-action:none}
.tile{position:absolute;width:calc(100% / var(--n));height:calc(100% / var(--n));padding:0;border:2px solid #f5ece0;border-radius:11px;background-color:#d0ede7;background-repeat:no-repeat;transition:left .17s ease,top .17s ease,filter .15s;box-shadow:inset 0 0 0 1px #ffffff38;will-change:left,top}
.tile.movable{filter:brightness(1.025)}
.tile:active{filter:brightness(1.09)}
.tile.reveal{animation:appear .5s ease both}
.blank{position:absolute;width:calc(100% / var(--n));height:calc(100% / var(--n));display:grid;place-items:center;padding:7px;pointer-events:none;transition:left .17s,top .17s}
.blank span{display:grid;place-items:center;width:100%;height:100%;border:2px dashed #d5c5b1;border-radius:10px;color:#bfac94;font-size:24px}
.hint{text-align:center;font-size:12px;line-height:1.5;color:#9b8c7d;margin:17px 0 15px;min-height:18px}
.actions{display:flex;gap:10px}
.primary{background:var(--purple);color:white;border:0;border-radius:16px;min-height:50px;font-weight:750;font-size:14px;box-shadow:0 4px 0 #614ab9;flex:1;padding:13px 18px;transition:transform .1s}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #614ab9}
.secondary{border:1px solid var(--border);border-radius:16px;background:#fffcf7;padding:12px 17px;min-height:50px;font-weight:750}
.record{text-align:center;font-size:11px;color:#a299aa;margin:19px 0 0}
.overlay{position:fixed;inset:0;background:#34284b70;backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.overlay[hidden]{display:none}
.dialog{background:var(--paper);border-radius:29px;padding:25px;max-width:360px;width:100%;max-height:90dvh;overflow:auto;text-align:center;box-shadow:0 20px 60px #24133140;animation:appear .25s ease}
.dialog h2{font-size:26px;letter-spacing:-.7px;margin:7px 0 10px}
.dialog p{color:var(--muted);font-size:14px;line-height:1.6;margin:9px 0 18px}
.dialog img{width:100%;border-radius:18px;display:block}
.dialog .primary{width:100%;margin-top:15px}
.dialog .secondary{width:100%;margin-top:12px}
.trophy{font-size:60px;display:block;animation:bounce 1s ease infinite alternate}
.win-stats{background:#f0e9fc;border-radius:16px;padding:14px;display:flex;justify-content:space-around;font-size:14px}
.win-stats strong{font-size:23px;display:block;color:var(--purple)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:90%;background:#37334f;color:white;padding:13px 19px;border-radius:16px;z-index:50;font-size:13px;text-align:center;box-shadow:0 5px 20px #0002}
.toast[hidden]{display:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetto{position:absolute;top:-25px;border-radius:3px;animation:fall var(--duration) linear forwards}
@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(800deg)}}
@keyframes appear{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
@keyframes bounce{to{transform:translateY(-6px) rotate(5deg)}}
@media(min-height:850px){.app{padding-top:calc(27px + env(safe-area-inset-top))}header{margin-bottom:28px}.pictures{margin-bottom:22px}.picture img{height:70px}}
@media(max-height:720px){header{margin-bottom:13px}.intro{margin-bottom:12px}.picture img{height:43px}.pictures{margin-bottom:12px}h1{font-size:25px}.settings{margin-bottom:10px}.stats{margin-bottom:10px}.hint{margin:14px 0 10px}.record{margin-top:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="logo" aria-hidden="true">🧩</div>
<div class="brand"><strong>Pieza a pieza</strong><span>Pequeños retos, grandes sonrisas</span></div>
<button class="icon-btn" id="sound" aria-label="Activar sonido" aria-pressed="false">🔇</button>
</header>
<h1>¡Pon la imagen en orden!</h1>
<p class="intro">Desliza las piezas y descubre la sorpresa.</p>
<div class="section-title">Elige tu dibujo</div>
<div class="pictures" id="pictures"></div>
<div class="settings">
<div class="levels" aria-label="Tamaño del rompecabezas">
<button data-size="3" class="active" aria-pressed="true">3 × 3 · Fácil</button>
<button data-size="4" aria-pressed="false">4 × 4 · Reto</button>
</div>
<button class="preview-btn" id="preview">◉ Ver dibujo</button>
</div>
<div class="stats">
<div class="stat"><span class="stat-icon" aria-hidden="true">👣</span><div><small>Movimientos</small><strong id="moves">0</strong></div></div>
<div class="stat"><span class="stat-icon" aria-hidden="true">⏱</span><div><small>Tiempo</small><strong id="time">00:00</strong></div></div>
</div>
<div class="board-shell"><div class="board" id="board" role="group" aria-label="Rompecabezas deslizante"></div></div>
<p class="hint" id="hint">Toca una pieza junto al hueco para moverla.</p>
<div class="actions">
<button class="primary" id="shuffle">⤨ &nbsp; Mezclar de nuevo</button>
<button class="secondary" id="help" aria-label="Cómo jugar">¿Cómo?</button>
</div>
<p class="record" id="record">Cada pieza te acerca a la meta ✨</p>
</main>
<div class="overlay" id="modal" hidden>
<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="dialog"></section>
</div>
<div id="confetti" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>

<g fill="#a4b7df"><circle cx="53" cy="219" r="4"/><circle cx="183" cy="119" r="5"/><circle cx="561" cy="285" r="5"/><circle cx="407" cy="290" r="4"/><circle cx="196" cy="470" r="5"/><circle cx="394" cy="501" r="5"/><circle cx="37" cy="475" r="4"/><circle cx="555" cy="544" r="4"/></g>
<path d="M267 380q-22 73 33 160 55-87 33-160" fill="#ffb766"/><path d="M281 380q-12 58 19 105 31-47 19-105" fill="#ffe8a5"/>

];
drawings.forEach(d=>d.url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">${d.svg}</svg>`));
const key='pieza-a-pieza-v1';
let state={n:3,image:'arcoiris',tiles:[],moves:0,elapsed:0,started:false,completed:false,sound:false,records:{}};
let runningSince=0,ready=false,saveChain=Promise.resolve(),toastTimer,lastFocus,modalKind='',audio;
const db=window.Acornix?.db;
async function read(){if(db)return await db.get(key);const s=localStorage.getItem(key);return s?JSON.parse(s):null}
function elapsed(){return state.elapsed+(runningSince?Date.now()-runningSince:0)}
function save(){
 const snap={...state,tiles:[...state.tiles],records:{...state.records},elapsed:elapsed()};
 saveChain=saveChain.catch(()=>{}).then(()=>db?db.set(key,snap):localStorage.setItem(key,JSON.stringify(snap))).catch(()=>toast('No se pudo guardar el progreso. Vuelve a intentarlo.'));
 return saveChain;
}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3200)}
function time(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function neighbors(i){const n=state.n,r=Math.floor(i/n),c=i%n;return [r>0?i-n:-1,r<n-1?i+n:-1,c>0?i-1:-1,c<n-1?i+1:-1].filter(x=>x>=0)}
function solved(){return state.tiles.every((v,i)=>v===i)}
function newPuzzle(){
 runningSince=0;state.elapsed=0;state.moves=0;state.started=false;state.completed=false;
 const count=state.n**2;state.tiles=Array.from({length:count},(_,i)=>i);
 let empty=count-1,previous=-1;
 for(let j=0;j<count*24;j++){const opts=neighbors(empty).filter(v=>v!==previous);const next=opts[Math.floor(Math.random()*opts.length)];[state.tiles[empty],state.tiles[next]]=[state.tiles[next],state.tiles[empty]];previous=empty;empty=next}
 if(solved()){const next=neighbors(empty)[0];[state.tiles[empty],state.tiles[next]]=[state.tiles[next],state.tiles[empty]]}
 render();save();
}
function currentDrawing(){return drawings.find(d=>d.id===state.image)||drawings[0]}
function render(){
 const d=currentDrawing();
 $('#pictures').innerHTML=drawings.map(x=>`<button class="picture ${x.id===state.image?'selected':''}" data-image="${x.id}" aria-label="Dibujo: ${x.name}" aria-pressed="${x.id===state.image}"><img src="${x.url}" alt=""><span>${x.name}</span>${x.id===state.image?'<b class="check" aria-hidden="true">✓</b>':''}</button>`).join('');
 document.querySelectorAll('[data-size]').forEach(b=>{const a=+b.dataset.size===state.n;b.classList.toggle('active',a);b.setAttribute('aria-pressed',a)});
 $('#sound').textContent=state.sound?'🔊':'🔇';$('#sound').setAttribute('aria-pressed',state.sound);$('#sound').setAttribute('aria-label',state.sound?'Desactivar sonido':'Activar sonido');
 const board=$('#board');board.style.setProperty('--n',state.n);board.innerHTML='';
 const blank=document.createElement('div');blank.className='blank';blank.innerHTML='<span>✧</span>';blank.id='blank';board.append(blank);
 for(let v=0;v<state.n**2-1;v++){
 const tile=document.createElement('button');tile.className='tile';tile.dataset.value=v;
 tile.style.backgroundImage=`url("${d.url}")`;
 tile.style.backgroundSize=`${state.n*100}% ${state.n*100}%`;
 tile.style.backgroundPosition=`${v%state.n/(state.n-1)*100}% ${Math.floor(v/state.n)/(state.n-1)*100}%`;
 tile.addEventListener('click',()=>move(v));
 let sx=0,sy=0;
 tile.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
 tile.addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.hypot(dx,dy)<18)return;
 e.preventDefault();
 const pos=state.tiles.indexOf(v),z=state.tiles.indexOf(state.n**2-1);
 const tx=z%state.n-pos%state.n,ty=Math.floor(z/state.n)-Math.floor(pos/state.n);
 if(neighbors(z).includes(pos)&&((tx&&Math.abs(dx)>Math.abs(dy)&&Math.sign(dx)===tx)||(ty&&Math.abs(dy)>Math.abs(dx)&&Math.sign(dy)===ty)))move(v);
 },{passive:false});
 board.append(tile);
 }
 updateBoard();updateStats();
}
function updateStats(){
 $('#moves').textContent=state.moves;$('#time').textContent=time(elapsed());
 $('#hint').textContent=state.completed?'¡Lo conseguiste! Tu dibujo está completo.':'Toca una pieza junto al hueco para moverla.';
 const best=state.records[state.n];
 $('#record').textContent=best?`🏅 Tu récord en ${state.n} × ${state.n}: ${best.moves} movimientos · ${time(best.elapsed)}`:'Cada pieza te acerca a la meta ✨';
}
function updateBoard(){
 const n=state.n,z=state.tiles.indexOf(n*n-1);
 const blank=$('#blank');blank.style.left=(z%n*100/n)+'%';blank.style.top=(Math.floor(z/n)*100/n)+'%';blank.hidden=state.completed;
 document.querySelectorAll('.tile').forEach(t=>{
 const v=+t.dataset.value,p=state.tiles.indexOf(v);
 t.style.left=(p%n*100/n)+'%';t.style.top=(Math.floor(p/n)*100/n)+'%';
 t.classList.toggle('movable',neighbors(z).includes(p));
 t.setAttribute('aria-label',`Pieza del dibujo, fila ${Math.floor(p/n)+1}, columna ${p%n+1}${neighbors(z).includes(p)?', se puede mover':''}`);
 t.setAttribute('aria-disabled',state.completed?'true':'false');
 });
 if(state.completed&&!$('#lastTile')){
 const t=document.createElement('div'),v=n*n-1;t.id='lastTile';t.className='tile reveal';t.style.left=t.style.top=(n-1)*100/n+'%';t.style.backgroundImage=`url("${currentDrawing().url}")`;t.style.backgroundSize=`${n*100}% ${n*100}%`;t.style.backgroundPosition='100% 100%';$('#board').append(t);
 }
}
function play(win=false){
 if(!state.sound)return;
 try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();(win?[523,659,784,1047]:[440]).forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.2)})}catch(e){}
}
function move(v){
 if(!ready||state.completed)return;
 const p=state.tiles.indexOf(v),z=state.tiles.indexOf(state.n**2-1);
 if(!neighbors(z).includes(p))return;
 if(!state.started){state.started=true;runningSince=Date.now()}
 [state.tiles[p],state.tiles[z]]=[state.tiles[z],state.tiles[p]];state.moves++;
 if(solved()){
 state.elapsed=elapsed();runningSince=0;state.completed=true;
 const old=state.records[state.n];
 if(!old||state.moves<old.moves||(state.moves===old.moves&&state.elapsed<old.elapsed))state.records[state.n]={moves:state.moves,elapsed:state.elapsed};
 updateBoard();updateStats();save();play(true);
 setTimeout(()=>{if(state.completed){openWin();celebrate()}},350);
 }else{updateBoard();updateStats();save();play()}
}
function showDialog(html,kind){
 lastFocus=document.activeElement;modalKind=kind;$('#dialog').innerHTML=html;$('#modal').hidden=false;
 const btn=$('#dialog button');if(btn)btn.focus();
}
function closeDialog(){$('#modal').hidden=true;modalKind='';if(lastFocus?.isConnected)lastFocus.focus()}
function openPreview(){
 showDialog(`<h2 id="modalTitle">${currentDrawing().name}</h2><p>Así quedará tu dibujo. ¡Tú puedes!</p><img src="${currentDrawing().url}" alt="Dibujo completo: ${currentDrawing().name}"><button class="primary" id="closeModal">Seguir jugando</button>`,'preview');$('#closeModal').onclick=closeDialog;
}
function openHelp(){
 showDialog(`<span style="font-size:45px" aria-hidden="true">🧩</span><h2 id="modalTitle">Un hueco para jugar</h2><p>Toca una pieza que esté justo al lado del hueco. También puedes deslizarla hacia él.</p><p>Mueve las piezas hacia arriba, abajo o a los lados hasta reconstruir el dibujo. No se mueven en diagonal.</p><p>El reloj empieza con tu primer movimiento. Usa <strong>Ver dibujo</strong> si necesitas una pista. ¡Sin prisas!</p><button class="primary" id="closeModal">¡A jugar!</button>`,'help');$('#closeModal').onclick=closeDialog;
}
function openWin(){
 showDialog(`<span class="trophy" aria-hidden="true">🏆</span><h2 id="modalTitle">¡Lo has conseguido!</h2><p>Con paciencia, pieza a pieza.<br>¡Menudo rompecabezas has resuelto!</p><div class="win-stats"><span><strong>${state.moves}</strong>movimientos</span><span><strong>${time(state.elapsed)}</strong>tiempo</span></div><button class="primary" id="again">¡Otra vez!</button><button class="secondary" id="closeModal">Ver mi dibujo</button>`,'win');
 $('#again').onclick=()=>{closeDialog();newPuzzle()};$('#closeModal').onclick=closeDialog;
}
function celebrate(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const box=$('#confetti');box.innerHTML='';
 for(let i=0;i<65;i++){const p=document.createElement('i');p.className='confetto';p.style.cssText=`left:${Math.random()*100}%;width:${6+Math.random()*7}px;height:${8+Math.random()*9}px;background:${['#f3a2b6','#9acdb8','#ffcc76','#a994df','#83c8db'][i%5]};--duration:${2+Math.random()*1.8}s;--drift:${Math.random()*160-80}px;animation-delay:${Math.random()*.7}s`;box.append(p)}
 setTimeout(()=>box.innerHTML='',5000);
}
function requestChange(action){
 if(state.moves>0&&!state.completed){
 showDialog(`<span style="font-size:42px" aria-hidden="true">🌱</span><h2 id="modalTitle">¿Empezamos de nuevo?</h2><p>Se cambiará el rompecabezas y se reiniciarán el reloj y los movimientos. Tus récords se conservarán.</p><button class="primary" id="acceptChange">Sí, empezar de nuevo</button><button class="secondary" id="closeModal">Seguir con este</button>`,'change');
 $('#acceptChange').onclick=()=>{closeDialog();action()};$('#closeModal').onclick=closeDialog;
 }else action();
}
$('#pictures').onclick=e=>{const b=e.target.closest('[data-image]');if(!ready||!b||b.dataset.image===state.image)return;requestChange(()=>{state.image=b.dataset.image;newPuzzle()})};
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{if(!ready||+b.dataset.size===state.n)return;requestChange(()=>{state.n=+b.dataset.size;newPuzzle()})});
$('#shuffle').onclick=()=>ready&&requestChange(newPuzzle);
$('#preview').onclick=()=>ready&&openPreview();
$('#help').onclick=openHelp;
$('#sound').onclick=()=>{if(!ready)return;state.sound=!state.sound;save();$('#sound').textContent=state.sound?'🔊':'🔇';$('#sound').setAttribute('aria-pressed',state.sound);$('#sound').setAttribute('aria-label',state.sound?'Desactivar sonido':'Activar sonido');play()};
$('#modal').onclick=e=>{if(e.target===$('#modal'))closeDialog()};
document.addEventListener('keydown',e=>{
 if($('#modal').hidden)return;
 if(e.key==='Escape')closeDialog();
 if(e.key==='Tab'){
 const buttons=[...$('#dialog').querySelectorAll('button')],first=buttons[0],last=buttons[buttons.length-1];
 if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
 }
});
function valid(s){return s&&(s.n===3||s.n===4)&&drawings.some(d=>d.id===s.image)&&Array.isArray(s.tiles)&&s.tiles.length===s.n*s.n&&new Set(s.tiles).size===s.tiles.length&&s.tiles.every(x=>Number.isInteger(x)&&x>=0&&x<s.n*s.n)}
async function load(){
 try{
 const s=await read();
 if(valid(s)){state={...state,...s,elapsed:Math.max(0,Number(s.elapsed)||0),records:s.records||{}};runningSince=state.started&&!state.completed&&!document.hidden?Date.now():0;render()}
 else newPuzzle();
 }catch(e){newPuzzle();toast('No pudimos recuperar la partida. ¡Vamos con una nueva!')}
 ready=true;
}
window.addEventListener('acornixdata',async()=>{await saveChain;closeDialog();runningSince=0;await load()});
document.addEventListener('visibilitychange',()=>{
 if(!ready)return;
 if(document.hidden){state.elapsed=elapsed();runningSince=0;save()}
 else if(state.started&&!state.completed){runningSince=Date.now()}
});
window.addEventListener('pagehide',()=>{if(ready)save()});
setInterval(()=>{if(ready)updateStats()},500);
setInterval(()=>{if(ready&&runningSince)save()},5000);
load();
})();
</script>
</body>
</html>
