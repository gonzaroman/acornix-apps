<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Business Card</title>
<style>
  :root { --bg:#eef0f4; --card:#fff; --ink:#1a1d24; --muted:#787f8f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, input { font:inherit; color:inherit; border:0; }
  button { cursor:pointer; background:none; }
  #app { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { margin:0 0 12px; font-size:26px; }
  .stage { perspective:1000px; }
  canvas { width:100%; aspect-ratio:1.75; border-radius:14px; box-shadow:0 18px 36px #1a1d2433; transition:transform .6s; display:block; }
  .tpls { display:flex; gap:8px; margin:14px 0 8px; overflow-x:auto; scrollbar-width:none; }
  .tpls::-webkit-scrollbar { display:none; }
  .tpls button { flex:none; padding:9px 14px; border-radius:12px; background:var(--card); font-weight:800; font-size:13px; }
  .tpls button.on { background:var(--ink); color:#fff; }
  .colors { display:flex; gap:10px; margin-bottom:12px; }
  .colors button { width:34px; height:34px; border-radius:50%; }
  .colors button.on { outline:3px solid var(--ink); outline-offset:2px; }
  .form { background:var(--card); border-radius:18px; padding:12px; display:grid; gap:6px; }
  .form input { padding:11px; border-radius:10px; background:var(--bg); outline:none; }
  .acts { display:flex; gap:8px; margin-top:12px; }
  .acts button { flex:1; padding:14px; border-radius:14px; background:var(--card); font-weight:800; }
  .acts .main { background:var(--ink); color:#fff; }
  .msg { text-align:center; color:var(--muted); font-size:13px; margin-top:8px; min-height:18px; }
</style>
</head>
<body>
<div id="app">
  <h1>🪪 <span id="ttl"></span></h1>
  <div class="stage"><canvas id="c" width="1050" height="600"></canvas></div>
  <div class="tpls" id="tpls"></div>
  <div class="colors" id="colors"></div>
  <div class="form" id="form"></div>
  <div class="acts"><button id="contact"></button><button class="main" id="saveImg"></button></div>
  <div class="msg" id="msg"></div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { title:'Tarjeta de visita', tpls:['Moderna','Clásica','Atrevida','Minimal'], f:{ name:'Nombre', role:'Cargo', company:'Empresa', phone:'Teléfono', email:'Email', web:'Web' }, contact:'📤 Compartir contacto', save:'🖼️ Guardar imagen', saved:'Imagen guardada ✓', dl:'Imagen descargada ✓',
  d:{ name:'Laura Martín', role:'Diseñadora gráfica', company:'Estudio Nube', phone:'+34 600 123 456', email:'laura@estudionube.es', web:'estudionube.es' } }
 : { title:'Business Card', tpls:['Modern','Classic','Bold','Minimal'], f:{ name:'Name', role:'Job title', company:'Company', phone:'Phone', email:'Email', web:'Website' }, contact:'📤 Share contact', save:'🖼️ Save image', saved:'Image saved ✓', dl:'Image downloaded ✓',
  d:{ name:'Laura Martin', role:'Graphic designer', company:'Cloud Studio', phone:'+44 7700 900123', email:'laura@cloudstudio.co', web:'cloudstudio.co' } };
const COLORS = ['#2563eb', '#0f766e', '#be123c', '#7c3aed', '#c2410c', '#111827'];
const $ = id => document.getElementById(id);
$('ttl').textContent = T.title; $('contact').textContent = T.contact; $('saveImg').textContent = T.save;
const st = (() => { try { return JSON.parse(localStorage.getItem('card')); } catch (e) { return null; } })() || { tpl: 0, color: 0, ...T.d };
const save = () => { try { localStorage.setItem('card', JSON.stringify(st)); } catch (e) {} };
T.tpls.forEach((t, i) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { st.tpl = i; draw(); }; $('tpls').appendChild(b); });
COLORS.forEach((c, i) => { const b = document.createElement('button'); b.style.background = c; b.onclick = () => { st.color = i; draw(); }; $('colors').appendChild(b); });
Object.entries(T.f).forEach(([k, l]) => { const i = document.createElement('input'); i.placeholder = l; i.value = st[k] || ''; i.maxLength = 50; i.oninput = () => { st[k] = i.value; draw(); }; $('form').appendChild(i); });
const g = $('c').getContext('2d'), W = 1050, H = 600;
function initials() { return (st.name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(''); }
function lines(x, y, color, size, gap) { g.fillStyle = color; g.font = `500 ${size}px system-ui`; [['📞', st.phone], ['✉️', st.email], ['🌐', st.web]].filter(([, v]) => v).forEach(([e, v], i) => g.fillText(e + '  ' + v, x, y + i * gap)); }
function draw() {
  const c = COLORS[st.color];
  [...$('tpls').children].forEach((b, i) => b.classList.toggle('on', i === st.tpl)); [...$('colors').children].forEach((b, i) => b.classList.toggle('on', i === st.color));
  g.clearRect(0, 0, W, H); g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  if (st.tpl === 0) {
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.fillStyle = c; g.fillRect(0, 0, 360, H);
    g.fillStyle = '#ffffff22'; g.beginPath(); g.arc(180, 300, 150, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.font = '800 120px system-ui'; g.textAlign = 'center'; g.fillText(initials(), 180, 342); g.textAlign = 'left';
    g.fillStyle = '#111827'; g.font = '800 58px system-ui'; g.fillText(st.name, 420, 180); g.fillStyle = c; g.font = '600 32px system-ui'; g.fillText(st.role, 420, 228);
    g.fillStyle = '#6b7280'; g.font = '500 28px system-ui'; g.fillText(st.company, 420, 270); lines(420, 380, '#374151', 28, 52);
  } else if (st.tpl === 1) {
    g.fillStyle = '#fbf8f1'; g.fillRect(0, 0, W, H); g.strokeStyle = c; g.lineWidth = 6; g.strokeRect(30, 30, W - 60, H - 60); g.lineWidth = 2; g.strokeRect(44, 44, W - 88, H - 88);
    g.textAlign = 'center'; g.fillStyle = '#1f2937'; g.font = '700 60px Georgia'; g.fillText(st.name, W / 2, 220); g.fillStyle = c; g.font = 'italic 32px Georgia'; g.fillText(st.role + (st.company ? ' · ' + st.company : ''), W / 2, 270);
    g.fillStyle = c; g.fillRect(W / 2 - 60, 310, 120, 3); g.fillStyle = '#4b5563'; g.font = '28px Georgia'; [st.phone, st.email, st.web].filter(Boolean).forEach((v, i) => g.fillText(v, W / 2, 380 + i * 46));
  } else if (st.tpl === 2) {
    const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, c); gr.addColorStop(1, '#111827'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.fillStyle = '#ffffff14'; g.beginPath(); g.arc(W - 80, 80, 260, 0, 7); g.fill(); g.beginPath(); g.arc(W - 40, H, 180, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.font = '900 72px system-ui'; g.fillText(st.name.toUpperCase(), 70, 200); g.font = '600 32px system-ui'; g.fillStyle = '#ffffffcc'; g.fillText(st.role, 70, 252);
    g.fillStyle = '#fff'; g.font = '800 30px system-ui'; g.fillText(st.company, 70, 300); lines(70, 410, '#ffffffe6', 28, 50);
  } else {
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.fillStyle = c; g.fillRect(70, 120, 10, 120);
    g.fillStyle = '#111'; g.font = '300 64px system-ui'; g.fillText(st.name, 110, 180); g.fillStyle = '#777'; g.font = '400 28px system-ui'; g.fillText((st.role + ' — ' + st.company).replace(/^ — | — $/g, ''), 112, 228);
    g.fillStyle = '#111'; g.font = '400 26px system-ui'; [st.phone, st.email, st.web].filter(Boolean).forEach((v, i) => g.fillText(v, 112, 380 + i * 44));
  }
  save();
}
$('saveImg').onclick = async () => {
  const data = $('c').toDataURL('image/png');
  try { if (window.Acornix) { await Acornix.files.save('business-card.png', data); $('msg').textContent = T.saved; } else { const a = document.createElement('a'); a.href = data; a.download = 'business-card.png'; a.click(); $('msg').textContent = T.dl; } } catch (e) { $('msg').textContent = e.message || ''; }
};
$('contact').onclick = async () => { const text = [st.name, [st.role, st.company].filter(Boolean).join(' · '), st.phone && '📞 ' + st.phone, st.email && '✉️ ' + st.email, st.web && '🌐 ' + st.web].filter(Boolean).join('\n'); try { if (window.Acornix) await Acornix.share(text); else if (navigator.share) await navigator.share({ text }); else await navigator.clipboard.writeText(text); } catch (e) {} };
let flip = 0; $('c').onclick = () => { flip += 360; $('c').style.transform = `rotateY(${flip}deg)`; };
draw();
</script>
</body>
</html>
