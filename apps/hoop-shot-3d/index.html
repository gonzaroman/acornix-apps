<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hoop Shot 3D</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:#10131c; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action:none; }
  canvas { position:fixed; inset:0; display:block; z-index:0; }
  #hud { position:fixed; left:0; right:0; top:0; z-index:2; display:flex; justify-content:space-between; align-items:flex-start; padding:calc(env(safe-area-inset-top) + 12px) 16px; pointer-events:none; }
  .box { background:#000a; border:2px solid #ff8a1f; border-radius:14px; padding:6px 14px; text-align:center; min-width:84px; }
  .box small { display:block; font-size:10px; letter-spacing:2px; color:#ffb366; font-weight:800; }
  .box b { font-size:26px; font-variant-numeric:tabular-nums; color:#ffdf9e; font-family:ui-monospace,Menlo,monospace; }
  #msg { position:fixed; left:0; right:0; top:34%; z-index:2; text-align:center; font-size:44px; font-weight:900; font-style:italic; color:#ffdf3f; text-shadow:0 4px 0 #b34700, 0 0 30px #ff8a1f; opacity:0; transform:scale(.6); transition:opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1); pointer-events:none; }
  #msg.on { opacity:1; transform:none; }
  #hint { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 24px); left:0; right:0; text-align:center; z-index:2; font-weight:700; opacity:.75; pointer-events:none; }
  #panel { position:fixed; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; background:#000b; }
  #panel.hide { display:none; }
  #panel h1 { margin:0; font-size:44px; font-weight:900; font-style:italic; color:#ff8a1f; text-shadow:0 4px 0 #6b2a00; }
  #panel p { margin:0; color:#ddd; max-width:300px; line-height:1.5; }
  #panel .big { font-size:60px; font-weight:900; color:#ffdf3f; }
  #go { margin-top:10px; padding:15px 46px; border:0; border-radius:999px; background:linear-gradient(#ffb04a,#ff7a00); color:#3a1600; font:900 18px system-ui; box-shadow:0 5px 0 #a94800; cursor:pointer; }
</style>
</head>
<body>
<div id="hud"><div class="box"><small id="lScore"></small><b id="score">0</b></div><div class="box"><small id="lTime"></small><b id="time">60</b></div></div>
<div id="msg"></div><div id="hint"></div>
<div id="panel"><h1>HOOP SHOT</h1><p id="intro"></p><div class="big" id="final"></div><p id="bestLine"></p><button id="go"></button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script>
<script>
// The 3D engine comes from the internet: say so instead of showing a blank screen when offline.
if (!window.THREE) document.addEventListener('DOMContentLoaded', () => {
  const es = (navigator.language || '').toLowerCase().startsWith('es');
  document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font:600 18px system-ui;color:#fff;background:#111">' +
    (es ? '📡 Este juego en 3D necesita conexión a internet para cargar. Conéctate y vuelve a abrirlo.' : '📡 This 3D game needs an internet connection to load. Connect and open it again.') + '</div>';
});
</script>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = ES ? { score:'PUNTOS', time:'TIEMPO', intro:'Desliza hacia arriba para lanzar. Tienes 60 segundos. Las canastas seguidas valen más.', go:'JUGAR', again:'OTRA VEZ', best:'Récord', hint:'☝️ Desliza hacia arriba para lanzar', swish:'¡LIMPIA!', nice:'¡CANASTA!', fire:'¡EN RACHA!', end:'¡TIEMPO!' }
 : { score:'SCORE', time:'TIME', intro:'Swipe up to shoot. You have 60 seconds. Baskets in a row are worth more.', go:'PLAY', again:'AGAIN', best:'Best', hint:'☝️ Swipe up to shoot', swish:'SWISH!', nice:'NICE SHOT!', fire:'ON FIRE!', end:'TIME!' };
document.getElementById('lScore').textContent = T.score; document.getElementById('lTime').textContent = T.time;
const store = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v == null ? d : v; } const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) await Acornix.db.set(k, v); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const G = -9.8, BALL_R = 0.12, RIM_R = 0.23, RIM_Y = 3.05;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x10131c); scene.fog = new THREE.Fog(0x10131c, 14, 30);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 100);
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x302010, 1.4));
const spot = new THREE.SpotLight(0xffffff, 120, 30, Math.PI / 5, .4, 1.5); spot.position.set(0, 9, 1); spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); scene.add(spot); scene.add(spot.target);
function tex(w, h, draw, rx = 1, ry = 1) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t; }
// Wooden court with the key painted on it.
const floorTex = tex(512, 512, (g, w, h) => {
  for (let i = 0; i < 16; i++) { g.fillStyle = `hsl(30,${45 + (i % 3) * 6}%,${44 + (i * 7) % 10}%)`; g.fillRect(0, i * h / 16, w, h / 16); g.fillStyle = '#0000001a'; g.fillRect(0, i * h / 16, w, 2); for (let j = 0; j < 3; j++) g.fillRect(((i * 97 + j * 173) % w), i * h / 16, 2, h / 16); }
}, 4, 4);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.MeshStandardMaterial({ map: floorTex, roughness: .45 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const lines = tex(512, 512, (g, w, h) => { g.strokeStyle = '#fff'; g.lineWidth = 8; g.strokeRect(w * .3, 0, w * .4, h * .55); g.beginPath(); g.arc(w / 2, h * .55, w * .2, 0, Math.PI); g.stroke(); g.beginPath(); g.arc(w / 2, 0, w * .47, 0, Math.PI); g.stroke(); });
const key = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: lines, transparent: true, opacity: .8 }));
key.rotation.x = -Math.PI / 2; key.position.set(0, .01, -2.5); scene.add(key);
// Back wall with crowd lights.
const wallTex = tex(1024, 256, (g, w, h) => { g.fillStyle = '#161a26'; g.fillRect(0, 0, w, h); for (let i = 0; i < 260; i++) { g.fillStyle = `hsla(${Math.random() * 360},70%,${50 + Math.random() * 30}%,${.3 + Math.random() * .6})`; g.beginPath(); g.arc(Math.random() * w, h * .25 + Math.random() * h * .6, 2 + Math.random() * 4, 0, 7); g.fill(); } g.fillStyle = '#ff7a00'; g.fillRect(0, h - 20, w, 8); });
const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 7.5), new THREE.MeshBasicMaterial({ map: wallTex })); wall.position.set(0, 3.75, -9); scene.add(wall);
// Hoop: pole, backboard, rim and net.
const hoop = new THREE.Group(); scene.add(hoop);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(.08, .1, 3.3, 12), new THREE.MeshStandardMaterial({ color: 0x2b2f3a, metalness: .6, roughness: .4 })); pole.position.set(0, 1.65, -.75); pole.castShadow = true; hoop.add(pole);
const boardTex = tex(512, 340, (g, w, h) => { g.fillStyle = '#ffffffe8'; g.fillRect(0, 0, w, h); g.strokeStyle = '#d72f2f'; g.lineWidth = 14; g.strokeRect(7, 7, w - 14, h - 14); g.strokeRect(w * .33, h * .42, w * .34, h * .4); });
const board = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, .05), new THREE.MeshStandardMaterial({ map: boardTex, transparent: true, opacity: .92, roughness: .2 })); board.position.set(0, 3.45, -.4); board.castShadow = true; hoop.add(board);
const rim = new THREE.Mesh(new THREE.TorusGeometry(RIM_R, .018, 10, 40), new THREE.MeshStandardMaterial({ color: 0xff5a1f, metalness: .4, roughness: .3, emissive: 0x401000 })); rim.rotation.x = Math.PI / 2; rim.position.set(0, RIM_Y, -.15); hoop.add(rim);
const net = new THREE.Mesh(new THREE.CylinderGeometry(RIM_R, .14, .4, 16, 4, true), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: .7 })); net.position.set(0, RIM_Y - .2, -.15); hoop.add(net);
// Ball with seams.
const ballTex = tex(512, 256, (g, w, h) => { g.fillStyle = '#e8721c'; g.fillRect(0, 0, w, h); for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * .12})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); } g.strokeStyle = '#2a1206'; g.lineWidth = 7; g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke(); [w / 4, 3 * w / 4].forEach(x => { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }); g.beginPath(); g.ellipse(0, h / 2, w * .18, h / 2, 0, 0, 7); g.stroke(); g.beginPath(); g.ellipse(w, h / 2, w * .18, h / 2, 0, 0, 7); g.stroke(); });
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 32, 24), new THREE.MeshStandardMaterial({ map: ballTex, roughness: .7 })); ball.castShadow = true; scene.add(ball);
const rimPoints = Array.from({ length: 24 }, (_, i) => { const a = i / 24 * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * RIM_R, 0, Math.sin(a) * RIM_R); });

let vel = new THREE.Vector3(), flying = false, scored = false, wasAbove = false, touchedRim = false, score = 0, streak = 0, time = 60, best = 0, state = 'menu', hoopT = 0, audio, timerT;
function rimCenter() { return new THREE.Vector3(hoop.position.x, RIM_Y, -.15 + hoop.position.z); }
function resetBall() { flying = false; scored = false; touchedRim = false; ball.position.set((Math.random() - .5) * 1.2 * Math.min(1, score / 6), 1.25, 4.2); vel.set(0, 0, 0); }
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 62 : 48; camera.updateProjectionMatrix(); }
function tone(f, t = .12, type = 'sine', v = .08) { try { audio = audio || new AudioContext(); const o = audio.createOscillator(), a = audio.createGain(); o.type = type; o.frequency.value = f; a.gain.value = v; o.connect(a); a.connect(audio.destination); a.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + t); o.start(); o.stop(audio.currentTime + t); } catch (e) {} }
function buzz(p) { try { if (window.Acornix) Acornix.vibrate(p); else if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function flash(text) { const m = document.getElementById('msg'); m.textContent = text; m.classList.add('on'); clearTimeout(flash.t); flash.t = setTimeout(() => m.classList.remove('on'), 900); }
function start() {
  score = 0; streak = 0; time = 60; state = 'play'; hoop.position.set(0, 0, 0); resetBall();
  document.getElementById('panel').classList.add('hide'); document.getElementById('hint').textContent = T.hint; hud();
  clearInterval(timerT); timerT = setInterval(() => { if (state !== 'play') return; time--; hud(); if (time <= 5 && time > 0) tone(660, .08, 'square', .03); if (time <= 0) end(); }, 1000);
}
async function end() {
  state = 'over'; clearInterval(timerT); tone(220, .6, 'sawtooth', .05); buzz([100, 50, 200]);
  if (score > best) { best = score; await store.set('best', best); }
  flash(T.end);
  setTimeout(() => panel(true), 900);
}
function panel(over) {
  document.getElementById('panel').classList.remove('hide');
  document.getElementById('intro').textContent = over ? '' : T.intro;
  document.getElementById('final').textContent = over ? score : '';
  document.getElementById('bestLine').textContent = best ? T.best + ': ' + best : '';
  document.getElementById('go').textContent = over ? T.again : T.go;
}
function hud() { document.getElementById('score').textContent = score; document.getElementById('time').textContent = Math.max(0, time); }
document.getElementById('go').onclick = e => { e.stopPropagation(); start(); };
let sw = null;
addEventListener('pointerdown', e => { if (state === 'play' && !flying) sw = { x: e.clientX, y: e.clientY, t: performance.now() }; });
addEventListener('pointerup', e => {
  if (!sw || state !== 'play' || flying) { sw = null; return; }
  const dy = sw.y - e.clientY, dx = e.clientX - sw.x, dt = Math.max(60, performance.now() - sw.t); sw = null;
  if (dy < 40) return;
  // Swipe length sets the power, its angle the direction, a quick flick adds a little.
  const power = Math.min(1.25, dy / (innerHeight * .42)) * (1 + Math.min(.15, 120 / dt * .05));
  vel.set(dx / innerWidth * 3.2, 4.4 + power * 4.1, -(3.4 + power * 3.2));
  flying = true; wasAbove = false; document.getElementById('hint').textContent = ''; tone(180, .08, 'triangle', .05);
});
let last = performance.now();
function physics(dt) {
  vel.y += G * dt;
  ball.position.addScaledVector(vel, dt);
  ball.rotation.x -= vel.z * dt * 6; ball.rotation.z -= vel.x * dt * 6;
  const c = rimCenter();
  // Rim: bounce off the closest point of the ring.
  for (const p of rimPoints) {
    const q = c.clone().add(p), d = ball.position.clone().sub(q), len = d.length();
    if (len < BALL_R + .018) { d.normalize(); const vn = vel.dot(d); if (vn < 0) { vel.addScaledVector(d, -1.6 * vn); vel.multiplyScalar(.82); touchedRim = true; tone(520, .07, 'square', .04); } ball.position.copy(q).addScaledVector(d, BALL_R + .019); }
  }
  // Backboard.
  const bz = -.4 + hoop.position.z + .03;
  if (ball.position.z - BALL_R < bz && ball.position.z > bz - .2 && Math.abs(ball.position.x - hoop.position.x) < .9 && Math.abs(ball.position.y - 3.45) < .6 && vel.z < 0) { vel.z = -vel.z * .6; ball.position.z = bz + BALL_R; tone(140, .12, 'square', .05); }
  // Through the hoop, going down.
  const flat = Math.hypot(ball.position.x - c.x, ball.position.z - c.z);
  if (ball.position.y > RIM_Y) wasAbove = true;
  if (!scored && wasAbove && vel.y < 0 && ball.position.y < RIM_Y - .05 && ball.position.y > RIM_Y - .3 && flat < RIM_R - BALL_R * .4) basket();
  // Floor.
  if (ball.position.y < BALL_R) { ball.position.y = BALL_R; if (vel.y < 0) { vel.y = -vel.y * .55; vel.x *= .8; vel.z *= .8; if (Math.abs(vel.y) > .8) tone(90, .1, 'sine', .1); } }
}
function basket() {
  scored = true; streak++;
  const swish = !touchedRim, pts = (swish ? 3 : 2) * (streak >= 3 ? 2 : 1);
  score += pts; hud(); buzz(swish ? [20, 30, 20] : 25);
  flash(streak >= 3 ? T.fire + ' +' + pts : (swish ? T.swish : T.nice) + ' +' + pts);
  tone(660, .1); setTimeout(() => tone(990, .2), 90);
  net.scale.y = 1.35; if (streak >= 3) rim.material.emissive.setHex(0xff3d00);
}
function loop(t) {
  const dt = Math.min(.033, (t - last) / 1000); last = t;
  if (state === 'play') {
    if (score >= 10) { hoopT += dt; hoop.position.x = Math.sin(hoopT * (.6 + Math.min(score, 40) * .015)) * 1.6; }
    if (flying) { for (let i = 0; i < 4; i++) physics(dt / 4); if (ball.position.z < -3 || ball.position.z > 7 || (Math.hypot(vel.x, vel.y, vel.z) < .3 && ball.position.y < .2) || ball.position.y < -1 || (performance.now() > 0 && Math.abs(ball.position.x) > 6)) { if (!scored) { streak = 0; rim.material.emissive.setHex(0x401000); } resetBall(); } }
  } else if (state === 'menu') { ball.position.set(Math.sin(t / 900) * .4, 1.25 + Math.abs(Math.sin(t / 300)) * .6, 3.2); ball.rotation.x += .03; }
  net.scale.y += (1 - net.scale.y) * .15;
  camera.position.set(ball.position.x * .25 + hoop.position.x * .15, 2.1, 5.6); camera.lookAt(hoop.position.x * .4, 2.35, -1);
  spot.target.position.set(hoop.position.x, 0, 0);
  renderer.render(scene, camera); requestAnimationFrame(loop);
}
addEventListener('resize', resize);
(async () => { best = await store.get('best', 0); resize(); resetBall(); panel(false); requestAnimationFrame(loop); })();
</script>
</body>
</html>
