name: Count downloads

# Once a day, copy how many times each app's ZIP was downloaded into catalog.json,
# for the "Popular" and "Trending" lists in Acornix.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/downloads.py refresh
          python3 scripts/build_catalog.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats catalog.json
          git diff --cached --quiet || { git commit -m "Download counts $(date -u +%F)"; git pull --rebase; git push; }
